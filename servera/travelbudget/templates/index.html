<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소재 국내 출장비 관리</title>
<style>
:root{
/* 색 — 회색 3단계 + 브랜드 1 + 단계 음영 4 + 신호 3. 이 목록에 없는 색은 쓰지 않는다.
   원칙: 단계는 '진하기'로, 좋다/나쁘다는 '색'으로. 둘을 섞지 않는다. */
--bg:#F4F6F8;--white:#FFF;
--ink:#1A2230;      /* 본문 */
--ink2:#3D4A5C;     /* 보조 본문 */
--mut:#5C6878;      /* 캡션 (이전 --faint 와 값이 같아 하나로 합침) */
--line:#E3E8EF;--line2:#EEF1F5;--soft:#EDF1F5;--shade:#EFF2F5;
--side:#FBFCFD;      /* 사이드바 — 본문(흰 카드)보다 반 톤 낮춰 카드가 떠 보이게 */
--navy:#17365D;     /* 브랜드 · 제목 · 주버튼 */
/* 단계 음영 — 계획(잠정) → 확정 예정 → 처리 중 → 처리 완료.
   이 넷은 서로 다른 범주가 아니라 한 파이프라인의 단계다.
   색상(hue)을 바꾸면 무관한 것들처럼 읽히므로 명도만 바꾼다.
   진할수록 돈이 확정된 쪽.
   막대에서 실제로 맞닿는 사슬은 s1|s2|s3|가용 넷뿐이다(잠정은 아래 참고 막대에 혼자 놓임).
   실무에서 제일 헷갈리는 쌍이 '이미 쓴 돈(처리 중)'과 '쓰기로 한 돈(확정 예정)'이라
   그 간격을 가장 넓게 잡았다 — 1.98 → 2.51. 사슬 최소 2.05 */
--s1:#12304F;       /* 처리 완료 — 이미 나간 돈 */
--s2:#33608E;       /* 처리 중 */
--s3:#7BA4CE;       /* 확정 예정 */
--s4:#9FBBD8;       /* 계획(잠정) — 예산 미반영 */
--track:#E9EEF4;    /* 가용 잔여 · 빈 트랙 */
--s3bg:#D3E1F0;     /* 확정 예정 배지 바탕 */
--s3ln:#8FB0D2;     /* 확정 예정 배지 테두리 */
--s4ln:#B8CCE2;     /* 계획(잠정) 배지 테두리 */
/* 깔리는 면 — 흰 카드 위에 한 겹 더 얹을 때만 쓴다. 세 종류뿐.
   회색 계열 하나(표), 남색 기 도는 것 둘(선택·강조). 값이 비슷한 면을 새로 만들지 않는다. */
--surf:#FAFBFC;     /* 표 행 hover · 표 머리 · 안내 상자 — 거의 흰색 */
--tint:#F2F6FC;     /* 선택된 행 · 메뉴 항목 hover · 리드 블록 */
--tint2:#E6EFF8;    /* 묶음 머리 · 정렬 가능한 머리 hover — tint 다음 단계 */
/* 신호색 — 단계가 아니라 좋다/나쁘다. 단계 음영과 겹치지 않는다.
   신호는 '면 · 선 · 글자' 세 쪽이 한 벌이다. 벌을 섞지 않는다. */
--green:#166F59;    /* 정상 · 절감 · 증액 */
--amber:#8A5A10;    /* 경과 주의 (D+3~6) */
--red:#BE3A45;      /* 초과 · 취소 · 긴급 · 예산 부족 */
--red-bg:#FCF0F1;--red-ln:#E4B6BC;
--amber-bg:#FFF8E8;--amber-ln:#E8D4B0;--amber-bar:#C79A3A;--amber-ink:#7A5410;
/* 모서리 — 네 단계만. 컨테이너가 컨트롤보다 한 단계 크면 겹쳐 놓았을 때 자연스럽다.
   막대는 조각이 맞닿아 있어 크게 굴리면 이가 벌어져 보이므로 가장 작게 둔다. */
--r-ctl:6px;        /* 버튼 · 입력 · 메뉴 항목 */
--r-box:10px;       /* 카드 · 표 · 모달 · 팝오버 */
--r-pill:999px;     /* 상태 배지 — 표의 사각 셀과 즉시 구분된다 */
--r-bar:3px;        /* 막대 · 범례 조각 */
/* 테두리 굵기 — 1 · 2 · 4 세 단계만 (3px 을 섞지 않는다).
   1px = 기본 구분(카드·표·입력)  2px = 강한 구분(표 머리글 아래·상세행 경계)
   4px = 한쪽 표식(안내·경고·근거 블록의 왼쪽 띠, 문서 머리의 위쪽 띠)
   굵기로 '무엇인가'를 말하고, 색으로 '어떤 신호인가'를 말한다. */
/* 그림자 — 세 단계만. '얼마나 떠 있는가'를 뜻한다.
   면을 나누는 데는 그림자를 쓰지 않는다(그건 테두리 몫이다). */
--sh-1:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);  /* 카드 — 테두리 대신 이걸로 뜬다 */
--sh-2:0 4px 16px rgba(18,48,79,.16);     /* 살짝 뜬 것 (팝오버 · 인폼) */
--sh-3:0 12px 32px rgba(16,24,40,.20);    /* 완전히 뜬 것 (모달) */
--sh-cut:-2px 0 0 var(--white);           /* 뜬 것이 아니라 자르는 선 — 막대 조각 경계 */
/* 입력칸 높이 — 크롬은 select 의 line-height 를 무시하고(−3px), date 는 달력 아이콘 때문에
   +2px 로 그린다. 한 줄에 나란히 놓인 칸들이 어긋나 보이던 원인이라 높이를 못박는다. */
--h-ctl:38px;       /* 본문 입력·선택·날짜 (13px + 여백 8) */
--h-ctl-sm:28px;    /* 표 안 필터 줄 (12px + 여백 4) */
/* 하위호환 — 기존 선언이 참조하던 이름 */
--faint:#5C6878;--navy2:#17365D;--blue:#33608E;
}
*{box-sizing:border-box}
/* 여백 — 4 · 8 · 12 · 16 · 24 · 32 여섯 단계만 쓴다.
   4=라벨과 입력 사이, 8=한 덩어리 안, 12=칸과 칸 사이, 16=블록과 블록 사이,
   24=카드 안쪽, 32=본문 바깥 여백 */
/* 글꼴 — 화면은 Pretendard(가변), 없으면 맑은 고딕으로 조용히 내려간다.
   굵기는 400·700 두 종만 쓴다 — 맑은 고딕이 그 둘뿐이라, 폰트가 없는 PC 에서도
   화면이 같아 보이려면 선언을 그 둘에 맞춰야 한다.
   letter-spacing 은 양수·음수 모두 쓰지 않는다 — 한글은 기본 자간이 이미 맞다.
   줄높이는 배수(1.55)가 아니라 px 정수로 못박는다. 12px×1.55=18.6px 처럼 소수가 되면
   베이스라인이 서브픽셀에 걸려 줄마다 다르게 뭉개진다(윈도우에서 "글자가 우그러짐").

   ── 글꼴 파일 ────────────────────────────────────────────────
   static/fonts/PretendardVariable.woff2   (가변 — 이 한 개면 400·700 이 다 나온다)
   static/fonts/Pretendard-LICENSE.txt     (SIL OFL — 배포 시 함께 두어야 한다)
   파일이 없으면 아래 @font-face 는 조용히 무시되고 맑은 고딕으로 렌더된다.
   외부 CDN 을 부르지 않으므로 사내망 차단 환경에서도 안전하다.
   ※ 엑셀 내보내기(.xls)는 받는 PC 에 Pretendard 가 없으므로 맑은 고딕으로 고정한다.
   ─────────────────────────────────────────────────────────── */
{% if ui_font == "var" %}/* 가변 폰트 한 개로 400·700 을 다 낸다 (Pretendard, SIL OFL — 라이선스 동봉) */
@font-face{font-family:"TB UI";src:url("/travelbudget/static/fonts/PretendardVariable.woff2") format("woff2-variations");
font-weight:45 930;font-style:normal;font-display:swap}
{% elif ui_font %}@font-face{font-family:"TB UI";src:url("/travelbudget/static/fonts/ui-400.woff2") format("woff2");
font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"TB UI";src:url("/travelbudget/static/fonts/ui-700.woff2") format("woff2");
font-weight:700;font-style:normal;font-display:swap}
{% endif %}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:22px;
font-family:{% if ui_font %}"TB UI",{% endif %}"Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line2);
padding:24px 16px;display:flex;flex-direction:column;overflow-y:auto}
/* 이름표 — 메뉴가 아니라 '이 시스템이 무엇인가'를 말하는 자리.
   그래서 메뉴(13px 한 줄)와 다른 척도를 쓴다: 로고 + 16px 제목 + 12px 영문 + 아래 경계선 */
.brand{display:block;padding:0 8px 16px;margin-bottom:0;border-bottom:1px solid var(--line);
text-decoration:none;cursor:pointer;user-select:none}
.brand .logo{display:block;width:88px;margin-bottom:12px}
.brand .logo svg{display:block;width:100%;height:auto}
.brand .bt{display:block;color:var(--navy);font-size:16px;line-height:24px;font-weight:700}
.brand .bs{display:block;color:var(--mut);font-size:12px;line-height:18px}
.brand:hover .bt{color:var(--s2)}
.brand:focus-visible{outline:2px solid var(--s2);outline-offset:2px;border-radius:var(--r-ctl)}
.nav-label{margin:16px 8px 4px;color:var(--mut);font-size:12px;line-height:18px;font-weight:700}
.nav a{display:block;margin:1px 0;padding:8px 12px;color:var(--ink2);border:1px solid transparent;
cursor:pointer;border-radius:var(--r-ctl);font-size:13px;line-height:20px;user-select:none}
.nav a:hover{background:var(--soft);border-color:var(--line2);color:var(--navy)}
/* 지금 보고 있는 화면 — 항목 전체를 옅은 남색 면으로 채운다.
   마우스만 올린 상태는 회색(--soft)이라 색으로 구분된다 */
.nav a.on{background:var(--s3bg);border-color:var(--s4ln);color:var(--navy);font-weight:700}
.nav a .lk{font-size:12px;line-height:18px;color:var(--mut);margin-left:4px;font-weight:400}
.nav a.on .lk{color:var(--navy)}
.nav a.ext{color:var(--ink2);font-weight:400;font-size:12px;line-height:18px;text-decoration:none}
.nav a.ext::after{content:' ↗';color:var(--mut);font-size:12px;line-height:18px}
.ver{padding:0 8px 8px;color:var(--mut);font-size:12px;line-height:18px}
.util{margin-top:auto}
.contact{padding:16px 8px 0;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--mut)}
.contact b{display:block;color:var(--navy);font-size:12px;line-height:18px}
.contact a{color:var(--navy);text-decoration:none}
main{width:100%;max-width:1560px;padding:32px 32px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{margin:0;color:var(--navy);font-size:24px;line-height:32px}
.top .sub{color:var(--mut);font-size:12px;line-height:18px}
.top select{margin-left:auto;width:130px}
.view{display:none}.view.on{display:block}
.card{background:var(--white);border:1px solid var(--line2);box-shadow:var(--sh-1);
padding:24px;margin-bottom:16px;border-radius:var(--r-box)}
/* 좁은 화면에서는 바깥 여백·카드 안쪽을 줄여 표가 가로로 밀리지 않게 한다 (규칙 순서상 .card 뒤에 둔다) */
@media(max-width:1279px){main{padding:24px 24px 48px}.card{padding:16px}}
.card h2{margin:0 0 4px;color:var(--navy);font-size:16px;line-height:24px}
.card .cap{margin:0 0 12px;color:var(--mut);font-size:12px;line-height:18px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.headsel{width:auto;min-width:200px;max-width:260px}
/* 예산 한 장 — 큰 숫자 + 구성 막대. KPI 카드 4장을 대체한다 */
.hero{background:var(--white);border:1px solid var(--line2);box-shadow:var(--sh-1);
border-radius:var(--r-box);padding:24px 24px;margin-bottom:16px}
.hero.alert{background:var(--red-bg);border-color:var(--red-ln)}
/* 예산 미배정 — 좋다/나쁘다가 아니라 '아직 없음'. 신호색을 쓰지 않는다 */
.hero.unset{background:var(--soft);border-color:var(--line)}
.hero.unset .lamp{background:var(--mut)}
.hero.unset .amount{color:var(--mut)}
.hero.unset .msg{color:var(--ink2);font-weight:700}
.hmain{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero .label{color:var(--mut);font-size:12px;line-height:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.hero .label .sub{color:var(--mut);font-weight:400}
.hero .lamp{width:8px;height:8px;border-radius:var(--r-pill);background:var(--green);flex-shrink:0}
.hero.alert .lamp{background:var(--red)}
.hero .amount{margin:4px 0 0;color:var(--navy);font-size:32px;line-height:38px;font-weight:700;
font-variant-numeric:tabular-nums}
.hero.alert .amount{color:var(--red)}
.hero .amount .won,.hero .htot .won{font-size:16px;line-height:24px;font-weight:700;margin-left:2px}
.hero .msg{margin-top:4px;font-size:13px;line-height:20px;font-weight:700;color:var(--green)}
.hero.alert .msg{color:var(--red)}
.hright{text-align:right}
.hero .htot{margin:4px 0 0;color:var(--ink2);font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.hright .sub{color:var(--mut);font-size:12px;line-height:18px;margin-top:2px}
/* 구성 막대 — 총예산이 어디에 있는지 한 줄로 */
.stack{display:flex;height:14px;margin-top:16px;border-radius:var(--r-bar);overflow:hidden;background:var(--shade)}
.stack i{display:block;height:100%}
.s-done{background:var(--s1)}.s-wip{background:var(--s2)}
.s-cmt{background:var(--s3)}.s-ava{background:var(--track)}
.stack i+i{box-shadow:var(--sh-cut)}          /* 같은 색상 음영이라 경계선이 구분의 절반을 담당한다 */
/* 잠정 계획 — 예산에 반영되지 않으므로 위 막대에 섞지 않고, 같은 축·같은 폭으로 아래 따로 */
.ghost{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ghost .gl{font-size:12px;line-height:18px;color:var(--mut);margin-bottom:8px}
.ghost .gl b{color:var(--ink2)}
.ghost .stack{margin-top:0;height:8px;background:var(--track)}
.ghost .stack i{background:var(--s4)}
.skey{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:8px;font-size:12px;line-height:18px;color:var(--ink2)}
.skey span{display:flex;align-items:center;gap:8px}
.skey i{width:9px;height:9px;border-radius:var(--r-bar);display:block;flex-shrink:0}
.skey b{font-variant-numeric:tabular-nums;color:var(--navy)}
.hnote{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);
font-size:12px;line-height:18px;color:var(--mut)}
.hnote b{color:var(--ink2)}
/* 센터 제출 리포트 모달 전용 — 대시보드는 더 이상 쓰지 않지만 리포트가 쓴다 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);padding:16px 16px;border-radius:var(--r-box)}
.kpi span{display:block;color:var(--mut);font-size:12px;line-height:18px}
.kpi b{display:block;margin-top:4px;color:var(--navy);font-size:20px;line-height:28px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:12px;line-height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
label{display:block;margin-bottom:4px;color:var(--ink2);font-size:12px;line-height:18px;font-weight:700}
label .rq{color:var(--red)}label .au{color:var(--mut);font-weight:400;font-size:12px;line-height:18px;margin-left:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--white);padding:8px 8px;color:var(--ink);
font:inherit;font-size:13px;line-height:20px;border-radius:var(--r-ctl)}
/* 높이를 같게 — input · select · date 가 한 줄에서 눈높이가 맞아야 한다.
   선택자를 일부러 낮게 잡는다 — 표 안 필터(.colf) 처럼 자기 높이를 가진 칸이 이길 수 있게. */
input,select{height:var(--h-ctl)}
input[type=checkbox],input[type=radio],textarea{height:auto}
button,.btn{font-family:inherit}          /* 버튼도 본문과 같은 글꼴로 — 윈도우 기본 UI 글꼴 방지 */
input:focus,select:focus,textarea:focus{outline:2px solid rgba(37,99,168,.13);border-color:var(--s2)}
input[readonly],.auto{background:var(--shade);color:var(--mut)}
input[type=number],input.mny{text-align:right;font-variant-numeric:tabular-nums}
input.bad{border-color:var(--red);background:var(--red-bg)}
.fwarn{color:var(--red);font-size:12px;line-height:18px;font-weight:700;margin-top:4px}
.promptbox{margin:12px 0 0;padding:12px 16px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-box);
max-height:420px;overflow:auto;font-size:12px;line-height:18px;white-space:pre-wrap;word-break:break-word;
color:var(--ink2)}
/* 고정폭 — 붙여넣기 원문·미리보기처럼 자릿수가 맞아야 읽히는 곳에만 */
.mono,.promptbox{font-family:Consolas,"D2Coding","SF Mono",Menlo,"Malgun Gothic","맑은 고딕",monospace}
.card.just{border-left:4px solid var(--s2);background:var(--tint)}
.just .jt{font-weight:700;color:var(--navy);font-size:14px;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.just .jw{color:var(--ink2);font-size:12px;line-height:18px;margin:8px 0 8px}
.nav a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--s2);outline-offset:1px}
textarea{min-height:66px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--white);
color:var(--ink2);padding:8px 16px;font-weight:700;font-size:12px;line-height:18px;cursor:pointer;text-decoration:none;border-radius:var(--r-ctl)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--white)}.btn.pri:hover{background:var(--navy)}
.btn.red{color:var(--red);border-color:var(--red-ln)}
.btn.sm{padding:4px 8px;font-size:12px;line-height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 카드 안에 들어가는 표라 테두리를 또 두르면 상자 안 상자가 된다 — 모서리만 남긴다 */
.scroll{overflow:auto;border-radius:var(--r-box)}
table{width:100%;border-collapse:collapse;background:var(--white)}
th,td{padding:12px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap;font-size:12px;line-height:18px}
/* 머리글은 배경을 깔지 않고 선 하나로 가른다 — 회색 띠가 화면을 무겁게 만들었다 */
th{background:transparent;color:var(--mut);font-size:12px;line-height:18px;font-weight:700;
padding-top:8px;padding-bottom:8px;border-bottom:2px solid var(--line)}
/* 출장 칸이 길면 뒤 칸들이 밀려 나간다 — 여기서만 말줄임하고, 행을 누르면 전부 보인다 */
td.trip{max-width:300px;position:relative;padding-right:16px}
td.trip>b,td.trip>.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.trip .tw{position:absolute;right:2px;top:50%;transform:translateY(-50%);
color:var(--s4);font-size:12px;line-height:18px}
/* 태그(#) — 분류·검색용. 상태 배지(색으로 단계)와 섞이지 않게 회색 계열 한 톤만 쓴다 */
.tag{display:inline-block;margin:4px 4px 0 0;padding:1px 8px;border:1px solid var(--line);
background:var(--surf);color:var(--ink2);border-radius:var(--r-pill);
font-size:12px;line-height:18px;font-family:inherit;cursor:pointer}
.tag:hover{border-color:var(--s4ln);background:var(--tint);color:var(--navy)}
.tag.on{background:var(--s3bg);border-color:var(--s4ln);color:var(--navy);font-weight:700}
td.trip .tags{margin-top:2px}
.tagpick{display:flex;flex-wrap:wrap;gap:0 4px;margin-top:4px}
/* 문답 — 한 화면에 질문 하나. 지나온 답은 위에 한 줄씩 쌓이고, 누르면 그리로 돌아간다. */
.card.askcard{background:var(--tint);border-color:var(--s4ln)}
.askq3{font-size:24px;line-height:32px;color:var(--navy);margin-bottom:16px}
/* 고르는 줄 — 넉넉하게. 누르면 바로 다음으로 넘어간다. */
.askopt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;line-height:24px;
color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:8px;cursor:pointer}
.askopt:hover{border-color:var(--s3);background:var(--tint)}
.askopt .sub{display:block;margin-top:2px}
.askor{color:var(--mut);font-size:13px;line-height:20px;margin:16px 0 8px}
/* 사람 고르기는 이름만 짧아 줄로 늘어놓으면 화면을 다 먹는다 — 칩으로 눕힌다 */
.askchips{display:flex;flex-wrap:wrap;gap:8px}
.askchip{font:inherit;font-size:14px;line-height:22px;color:var(--ink);background:var(--white);
border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px 12px;cursor:pointer}
.askchip:hover{border-color:var(--s3);background:var(--tint)}
/* 이름 → 사번 매칭 결과 한 줄 */
.namehit{font-size:13px;line-height:20px;color:var(--mut);margin-top:8px}
.namehit.ok{color:var(--green)}
.namehit.warn{color:var(--amber)}
.askchip .sub{margin-left:4px}
.askgrid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.askgrid .askopt{margin-bottom:0}
.askme{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.askme .btn{margin-left:auto}
.askdone{display:flex;width:100%;text-align:left;align-items:center;gap:8px;font:inherit;
font-size:13px;line-height:20px;color:var(--ink);background:none;border:0;
border-bottom:1px solid var(--line2);padding:8px 0;cursor:pointer}
.askdone .askv{flex:1;min-width:0}
.askdone .askedit{color:var(--mut)}
.askdone:hover .askedit{color:var(--s2)}
.askdone + .askq3{margin-top:24px}
.asksum{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:16px;margin-bottom:12px}
.askfoot{margin-top:24px}
/* 체크박스가 폭 200px 로 늘어나던 것 — 필터 줄과 같은 처방 */
.askchk{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
.askchk input[type=checkbox]{flex:0 0 auto;min-width:0;width:auto;margin:0}
.tagbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
tr.lrow{cursor:pointer}
tr.lrow.open{background:var(--tint)}
tr.lrow.open td.trip .tw{color:var(--s2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surf)}
tfoot td{background:var(--shade);font-weight:700;color:var(--navy)}
td .sub{color:var(--mut);font-size:12px;line-height:18px}
/* 출장자별 비목 내역 — 정산서를 쓰려면 여기서 다 보여야 한다 */
.dtl-row>td{background:var(--surf);padding:12px!important;border-bottom:2px solid var(--line)}
.dtl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;line-height:20px}
.dtl-head .gb{margin-left:auto;display:flex;gap:8px}
table.dtl{background:var(--white)}
table.dtl th{font-size:12px;line-height:18px;white-space:nowrap}
table.dtl td{padding:8px;font-size:12px;line-height:18px}
table.dtl tfoot td{background:var(--shade);font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.dtl-rm{margin-top:8px;padding:8px 12px;background:var(--white);border:1px solid var(--line);
border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--ink2)}
.dtl-rm b{color:var(--navy);margin-right:4px}
.pdtl{margin:0;padding:8px 12px 12px;border-top:1px solid var(--line2)}
.pdtl summary{font-size:12px;line-height:18px}
.pdtl summary .sub{font-weight:400;margin-left:4px}
/* 시스템 설정 — 값이 코드가 아니라 원장에 있으므로 화면에서 고친다 */
.cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cfg-row input{flex:1;min-width:0}
.cfg-row .btn{flex:0 0 auto}
.cfg-tbl input{padding:8px}
.cfg-tbl td{padding:4px}
.cfg-used{font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.cfg-used b{color:var(--ink2)}
.cfg-warn{margin-top:8px;padding:12px;background:var(--amber-bg);border:1px solid var(--amber-ln);
border-left:4px solid var(--amber-bar);border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--amber-ink)}
.cfg-warn b{color:var(--amber-ink)}
.status{display:inline-block;padding:2px 8px;border:1px solid var(--s4ln);background:var(--white);color:var(--s1);font-size:12px;line-height:18px;font-weight:700;border-radius:var(--r-pill)}
/* 배지도 같은 단계 음영 — 채움 강도로 진행을 읽는다.
   흰 테두리(계획) → 옅은 바탕(확정) → 중간 채움(처리중) → 진한 채움(완료) */
.status.done{background:var(--s1);border-color:var(--s1);color:var(--white)}
.status.wip{background:var(--s2);border-color:var(--s2);color:var(--white)}
.status.cancel{background:var(--shade);color:var(--mut);text-decoration:line-through}
.status.urgent{background:var(--red-bg);border-color:var(--red-ln);color:var(--red)}
.status.hold{background:var(--red-bg);border-color:var(--red-ln);color:var(--red)}
.status.confirm{background:var(--s3bg);border-color:var(--s3ln);color:var(--s1)}
.pgroup{border:1px solid var(--line);border-radius:var(--r-box);margin-bottom:8px;overflow:hidden}
.pg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 12px;background:var(--surf);border-bottom:1px solid var(--line2)}
.pg-head .nm{font-weight:700;color:var(--navy)}
.pg-sum{font-size:12px;line-height:18px;color:var(--mut)}
.pg-sum b{color:var(--red)}
.pg-head .gb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 바로 할 일 큐 — 건수가 아니라 '무엇이 며칠 묵었는가'. 눌러서 그 건으로 바로 간다 */
.queue{border:1px solid var(--line);border-radius:var(--r-box);margin-top:12px}
.qrow{display:grid;grid-template-columns:76px minmax(0,1fr) 56px 104px;align-items:center;
gap:12px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surf)}
/* 큐의 종류 표시는 배지가 아니라 글자 — 단계 배지와 뜻이 겹치지 않게 */
.qk{font-size:12px;line-height:18px;font-weight:700;color:var(--mut)}
.qk.warn{color:var(--red)}
.qnm{font-size:13px;line-height:20px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd{text-align:right;font-size:12px;line-height:18px;font-weight:700;font-variant-numeric:tabular-nums}
.qmore{padding:8px 12px;font-size:12px;line-height:18px;color:var(--mut);border-top:1px solid var(--line2)}
/* 큐에서 넘어온 건을 잠깐 표시 — 스크롤만 하면 어느 블록인지 모른다 */
.pgroup.flash{outline:2px solid var(--s2);outline-offset:2px}
/* CCG 집행 막대 — 라이브러리 없이 div 로. 색은 상태 3색만 사용 */
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;align-items:center;gap:8px}
.bnm{font-size:12px;line-height:18px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar{height:16px;background:var(--shade);border-radius:var(--r-bar);display:flex;overflow:hidden}
.bbar i{display:block;height:100%}
.bbar i.sd,.lgd i.sd{background:var(--s1)}
.bbar i.sw,.lgd i.sw{background:var(--s2)}
.bbar i.sc,.lgd i.sc{background:var(--s3)}
.bbar i+i{box-shadow:var(--sh-cut)}
/* 확정 예정 — 집계에 안 들어가는 참고값. 사선으로 '아직 안 쓴 돈'임을 표시한다 */
.ghost-seg{background:repeating-linear-gradient(135deg,var(--s3) 0 3px,var(--white) 3px 6px)!important;opacity:.65}
.brow.only-cmt .bnm,.brow.only-cmt .bval{color:var(--mut)}
.lgd i.ghost-seg{opacity:.8}
.bval{text-align:right;font-size:12px;line-height:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
/* 구성비를 고정폭 칸에 넣어야 금액 끝이 세로로 맞는다 (안 그러면 8% 행과 34% 행이 어긋난다) */
.bval .sub{display:inline-block;width:32px;text-align:right}
.lgd{display:flex;gap:12px;font-size:12px;line-height:18px;color:var(--mut);font-weight:400;flex-wrap:wrap}
.lgd span{display:flex;align-items:center;gap:4px}
.lgd i{width:10px;height:10px;border-radius:var(--r-bar);display:block}
/* 비목 구성 — 단계가 아니라 범주다. 색으로 나누면 단계 음영과 헷갈리므로
   전부 같은 색 한 겹으로 두고 이름과 길이로만 구분한다 */
.cost{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.cost .ct{font-size:12px;line-height:18px;font-weight:700;color:var(--navy);margin-bottom:8px}
.cost .ct span{font-weight:400;color:var(--mut)}
.cost .bbar i{background:var(--s2)}
.fold{margin-top:16px}
.fold summary{cursor:pointer;font-size:12px;line-height:18px;font-weight:700;color:var(--navy);padding:4px 0;user-select:none}
.fold summary:hover{text-decoration:underline}
.ref{margin-top:16px;padding:8px 12px;background:var(--soft);border-left:4px solid var(--mut);
border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--ink2)}
.ref b{color:var(--navy)}
.ref .sub{display:block;margin-top:4px}
.note{padding:8px 12px;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font-size:12px;line-height:18px;border-radius:var(--r-box);margin-bottom:12px}
.err{margin-bottom:12px;padding:8px 12px;border:1px solid var(--red-ln);background:var(--red-bg);color:var(--red);font-size:12px;line-height:18px;border-radius:var(--r-box);white-space:pre-line}
/* 출장자 표 — 1280px 에서 가로 스크롤 없이 들어가도록 열 폭을 맞춘다.
   첫 칸 고정(sticky)은 쓰지 않는다: 스크롤되면 뒷칸 위에 겹쳐 올라가
   사번·직책 칸이 성명 칸 밑으로 사라졌다(최대 72px 침범). 행이 1~4개뿐이라 고정이 필요 없다. */
.trav-table input,.trav-table select{min-width:0;padding:8px 8px;font-size:13px;line-height:20px}
.trav-table td{padding:4px}
.trav-table .w-nm{min-width:84px}.trav-table .w-no{min-width:82px}.trav-table .w-rk{min-width:72px}
.trav-table .w-tm{min-width:148px}
/* 데스크톱(1360px 이상 — 사내 표준 1366×768 포함)에서는 가장 긴 팀 이름 + CCG 번호가
   닫힌 상태에서도 다 보이게 넓힌다. 그보다 좁으면 표가 가로로 밀리므로 좁게 두고,
   번호는 목록을 펼치면 온전히 보인다. */
@media(min-width:1360px){.trav-table .w-tm{min-width:240px}}
/* 금액칸은 두 표(계획·실적)에서 같은 크기여야 한다.
   폭을 안 잡으면 열이 적은 실적 표에서 195px 까지 늘어나 계획 표와 리듬이 어긋난다.
   남는 폭은 칸을 늘리지 않고 여백으로 둔다 — 오른쪽 정렬이라 숫자 열은 그대로 맞는다. */
/* 금액칸은 '1,250,000' 이 들어가면 충분하다. 상한을 낮춰 남는 폭을 CCG 칸에 준다
   (두 표가 같은 상한을 쓰므로 계획·실적 표의 금액칸 크기도 서로 같아진다) */
.trav-table .w-mn{min-width:76px;max-width:88px;display:block;margin-left:auto}
/* 한 행 안의 칸은 전부 한 줄이어야 옆 칸과 눈높이가 맞는다 (CCG 코드는 선택지 안에 있다).
   입력 표에서는 버튼도 입력칸과 같은 높이 — 한 줄이 통째로 반듯해진다 */
.trav-table td{vertical-align:middle}
.trav-table td .btn{height:var(--h-ctl)}
/* 비용 4열을 묶는 그룹 머리 — 열 폭이 '계획 식대&잡비' 같은 긴 머리글에 끌려다니지 않게 */
.trav-table thead th{vertical-align:bottom}
.trav-table th.grp{text-align:center;border-bottom:1px solid var(--line2);
font-weight:700;color:var(--mut);padding-bottom:4px}
.trav-table th.sub2{font-weight:700;color:var(--ink2)}
/* 인폼은 떠 있지 않고 화면 맨 아래에 놓인다 — 아래쪽 버튼을 가리지 않는다 */
.mailcard{margin:16px 0 0;background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);overflow:hidden;
box-shadow:var(--sh-1)}
.mailcard .mh{background:var(--navy);color:var(--white);padding:8px 16px;font-size:12px;line-height:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mailcard .mh button{background:none;border:0;color:var(--s4);font-size:16px;line-height:24px;cursor:pointer;padding:0 4px}
.mailcard .mh button:hover{color:var(--white)}
.mailcard .mhb{display:flex;gap:2px;align-items:center}

.mailcard .meta{padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;line-height:18px}
.mailcard .meta .row{display:flex;gap:8px;margin-bottom:4px}
.mailcard .meta .k{color:var(--mut);font-weight:700;width:36px;flex-shrink:0}
.mailcard .how{padding:8px 16px;background:var(--tint);border-bottom:1px solid var(--line);
font-size:12px;line-height:18px;color:var(--ink2)}
.mailcard .how b{color:var(--navy)}
.mailcard .how .sub{color:var(--mut)}
/* 끌 수 있는 곳임을 눈으로 알리는 구역 — 점선 테두리 + 손잡이 + 잡는 커서 */
.mailcard .dragzone{margin:12px 16px 0;border:2px dashed var(--s3);border-radius:var(--r-box);background:var(--tint);
transition:border-color .12s,background .12s,box-shadow .12s}
.mailcard .dragzone:hover{border-color:var(--s2);background:var(--tint2);box-shadow:var(--sh-1)}
.mailcard .dragzone.dragging{border-color:var(--s1);background:var(--tint2);box-shadow:var(--sh-2)}
.apv-tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;background:var(--white)}
.apv-tbl th{background:var(--surf);color:var(--ink2);font-size:12px;line-height:18px;text-align:left;
padding:8px;border-bottom:2px solid var(--line)}
.apv-tbl td{padding:8px;border-bottom:1px solid var(--line2)}
.apv-tbl td:first-child{color:var(--mut);white-space:nowrap;width:1%}
.mailcard .draghint{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--s4ln);
font-size:12px;line-height:18px;color:var(--s2);font-weight:700;cursor:grab;user-select:none}
.mailcard .draghint b{color:var(--navy)}
.mailcard .draghint .grip{font-size:14px;line-height:22px;color:var(--s3)}
.mailcard .dragzone:hover .draghint .grip{color:var(--s2)}
.mailcard .body{padding:12px;overflow:auto;max-height:420px;cursor:grab}
.mailcard .dragzone:active,.mailcard .body:active,.mailcard .draghint:active{cursor:grabbing}
.mailcard .mfhint{margin-left:auto;font-size:12px;line-height:18px;color:var(--mut)}
.mailcard .mf{padding:8px 16px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.46);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-box{width:330px;max-width:96vw;background:var(--white);border:1px solid var(--line);
border-radius:var(--r-box);overflow:hidden;box-shadow:var(--sh-3)}
.modal-box .mh{background:var(--navy);color:var(--white);padding:12px 16px;font-size:14px;line-height:22px;font-weight:700}
.modal-box .mb{padding:16px}
.modal-box .hint{font-size:12px;line-height:18px;color:var(--mut);background:var(--shade);padding:8px 8px;margin:8px 0 12px;border-radius:var(--r-box)}
.modal-box .hint b{color:var(--navy)}
.modal-box .merr{color:var(--red);font-size:12px;line-height:18px;margin-bottom:8px;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--white);
padding:8px 16px;z-index:200;font-size:12px;line-height:18px;font-weight:700;border-radius:var(--r-box)}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row input,.filter-row select{width:auto;min-width:170px}
.filter-row input{flex:1;min-width:200px}
.filter-row input[type=checkbox]{flex:0 0 auto;min-width:0;width:auto}   /* 체크박스까지 200px 로 늘던 것 */
tr.grp-head td{background:var(--tint2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
padding:8px 8px;color:var(--navy)}
tr.grp-head:hover td{background:var(--tint2)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:var(--tint2);color:var(--navy)}
th .sic{color:var(--s2);font-size:12px;line-height:18px}
tr.filt th{background:var(--surf);padding:4px 4px;border-bottom:1px solid var(--line)}
.colf{width:100%;min-width:74px;height:var(--h-ctl-sm);padding:4px 8px;font-size:12px;line-height:18px;
border:1px solid var(--line);border-radius:var(--r-ctl)}
/* 상태 고르는 칸은 '계획(잠정)' 같은 이름이 통째로 들어가야 한다 — 잘리면 고를 수가 없다 */
.colf-sel{min-width:104px}
.colf::placeholder{color:var(--mut);font-size:12px;line-height:18px;opacity:1}   /* 1.87:1 → 5.67:1 */
@media(max-width:980px){.filter-row input,.filter-row select,.filter-row .btn{width:100%;min-width:0}}
/* 여러 건 골라 한 번에 확정 — 고른 게 있을 때만 나타나는 띠 */
th.pick,td.pick{width:32px;padding-left:8px;padding-right:0;text-align:center}
th.pick input,td.pick input{width:auto;min-width:0;margin:0;cursor:pointer}
tr.picked td{background:var(--tint)}
.selbar{display:none}
.selbar.on{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
margin:0 0 12px;padding:8px 12px;background:var(--s3bg);border:1px solid var(--s4ln);border-radius:var(--r-box);
font-size:13px;line-height:20px;color:var(--navy)}
/* 행의 ⋯ 메뉴 — 되돌릴 수 없는 동작을 주요 동작과 같은 크기로 늘어놓지 않는다 */
details.rowmenu{display:inline-block;position:relative}
details.rowmenu>summary{list-style:none;display:inline-block;padding:4px 8px;cursor:pointer}
details.rowmenu>summary::-webkit-details-marker{display:none}
details.rowmenu[open]>summary{background:var(--s3bg);border-color:var(--s4ln)}
.rowmenu-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:180px;
background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);box-shadow:var(--sh-2);
padding:4px 0;text-align:left}
.rowmenu-item{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:0;
font-size:13px;line-height:20px;color:var(--ink);cursor:pointer;white-space:nowrap}
.rowmenu-item:hover{background:var(--tint)}
.rowmenu-item.danger{color:var(--red);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.rowmenu-item.danger:hover{background:var(--red-bg)}
/* 대시보드 안내 문구 */
.notice{background:var(--amber-bg);border:1px solid var(--amber-ln);border-left:4px solid var(--amber-bar);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:16px}
.notice .nt{color:var(--amber-ink);font-size:13px;line-height:20px;font-weight:700;white-space:pre-line}
.notice .ns{color:var(--amber);font-size:12px;line-height:18px;margin-top:4px}
.notice .ne{margin-top:8px}
.notice textarea{min-height:60px;font-size:13px;line-height:20px}
/* 이용 안내(흐름) */
.g-lead{background:var(--tint);border:1px solid var(--line);border-radius:var(--r-box);padding:16px 24px;margin-bottom:16px}
.g-lead h2{margin:0 0 8px;color:var(--navy);font-size:16px;line-height:24px}
.g-lead p{margin:0;color:var(--ink2);font-size:13px;line-height:20px}
.g-formula{display:inline-block;margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);padding:8px 12px;font-size:13px;line-height:20px;font-weight:700;color:var(--navy)}
.flowbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.flowbar .pill{padding:8px 12px;border-radius:var(--r-pill);font-size:12px;line-height:18px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--navy)}
.flowbar .pill{background:var(--white);border-color:var(--s4ln);color:var(--s1)}
.flowbar .pill.confirm{background:var(--s3bg);border-color:var(--s3ln);color:var(--s1)}
.flowbar .pill.wip{background:var(--s2);border-color:var(--s2);color:var(--white)}
.flowbar .pill.done{background:var(--s1);border-color:var(--s1);color:var(--white)}
.flowbar .arrow{color:var(--mut);font-weight:700}
.gstep{display:flex;gap:16px;padding:16px 2px;border-top:1px solid var(--line2)}
.gstep:first-of-type{border-top:0}
.gnum{width:30px;height:30px;border-radius:var(--r-pill);background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:22px;flex-shrink:0}
.gstep.admin .gnum{background:var(--s2)}.gstep.cancel .gnum{background:var(--mut)}
.gbody{flex:1;min-width:0}
.gtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--navy);font-size:14px;line-height:22px}
.grole{padding:1px 8px;border-radius:var(--r-pill);font-size:12px;line-height:18px;font-weight:700}
/* 역할은 단계가 아니다 — 음영 램프를 쓰지 않고 중립 회색 칩 하나로 */
.grole.owner,.grole.admin{background:var(--shade);color:var(--ink2);border:1px solid var(--line)}
.gwhat{margin:8px 0 8px;color:var(--ink2);font-size:13px;line-height:20px}
.gauto{font-size:12px;line-height:18px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:var(--r-box);padding:8px 8px;display:inline-block}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:18px;color:var(--mut);margin-top:4px}
.glegend span{display:inline-flex;align-items:center;gap:8px}
.glegend .arrow{color:var(--mut);font-weight:700}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}aside,main{min-width:0;max-width:100%}aside{position:relative;height:auto}
.contact{margin-top:16px}.kpis,.grid2,.c4,.c3,.c2{grid-template-columns:1fr}main{padding:16px}
.top select{margin-left:0}
.hero{flex-wrap:wrap}.hero>div{min-width:0}.hero .amount{font-size:20px;line-height:28px}.hero .fig{word-break:keep-all;white-space:normal}}
@media print{
  aside,.top select,.btns,.btn,.mailcard,.modal,.filter-row,tr.filt,.nav{display:none!important}
  /* 조작용 UI 는 결재 첨부물에 찍히면 안 된다 — 선택칸·⋯메뉴·선택 띠 */
  th.pick,td.pick,details.rowmenu,.selbar{display:none!important}
  tr.picked td{background:transparent!important}
  .app{display:block}main{max-width:none;padding:0}
  .card,.hero,.kpi,.scroll{border:1px solid var(--mut);box-shadow:none;break-inside:avoid}
  th,td{white-space:normal}
  body{background:var(--white);font-size:11pt}
}
