<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소재 국내 출장비 관리</title>
<style>
:root{
/* 색 — 회색 3단계 + 브랜드 1 + 단계 음영 4 + 신호 3. 이 목록에 없는 색은 쓰지 않는다.
   원칙: 단계는 '진하기'로, 좋다/나쁘다는 '색'으로. 둘을 섞지 않는다. */
--bg:#F4F6F8;--white:#FFF;
--ink:#1A2230;      /* 본문 */
--ink2:#3D4A5C;     /* 보조 본문 */
--mut:#5C6878;      /* 캡션 (이전 --faint 와 값이 같아 하나로 합침) */
--line:#E3E8EF;--line2:#EEF1F5;--soft:#EDF1F5;--shade:#EFF2F5;
--side:#FBFCFD;      /* 사이드바 — 본문(흰 카드)보다 반 톤 낮춰 카드가 떠 보이게 */
--navy:#17365D;     /* 브랜드 · 제목 · 주버튼 */
/* 단계 음영 — 계획(잠정) → 확정 예정 → 처리 중 → 처리 완료.
   이 넷은 서로 다른 범주가 아니라 한 파이프라인의 단계다.
   색상(hue)을 바꾸면 무관한 것들처럼 읽히므로 명도만 바꾼다.
   진할수록 돈이 확정된 쪽.
   막대에서 실제로 맞닿는 사슬은 s1|s2|s3|가용 넷뿐이다(잠정은 아래 참고 막대에 혼자 놓임).
   실무에서 제일 헷갈리는 쌍이 '이미 쓴 돈(처리 중)'과 '쓰기로 한 돈(확정 예정)'이라
   그 간격을 가장 넓게 잡았다 — 1.98 → 2.51. 사슬 최소 2.05 */
--s1:#12304F;       /* 처리 완료 — 이미 나간 돈 */
--s2:#33608E;       /* 처리 중 */
--s3:#7BA4CE;       /* 확정 예정 */
--s4:#9FBBD8;       /* 계획(잠정) — 예산 미반영 */
--track:#E9EEF4;    /* 가용 잔여 · 빈 트랙 */
--s3bg:#D3E1F0;     /* 확정 예정 배지 바탕 */
--s3ln:#8FB0D2;     /* 확정 예정 배지 테두리 */
--s4ln:#B8CCE2;     /* 계획(잠정) 배지 테두리 */
/* 깔리는 면 — 흰 카드 위에 한 겹 더 얹을 때만 쓴다. 세 종류뿐.
   회색 계열 하나(표), 남색 기 도는 것 둘(선택·강조). 값이 비슷한 면을 새로 만들지 않는다. */
--surf:#FAFBFC;     /* 표 행 hover · 표 머리 · 안내 상자 — 거의 흰색 */
--tint:#F2F6FC;     /* 선택된 행 · 메뉴 항목 hover · 리드 블록 */
--tint2:#E6EFF8;    /* 묶음 머리 · 정렬 가능한 머리 hover — tint 다음 단계 */
/* 신호색 — 단계가 아니라 좋다/나쁘다. 단계 음영과 겹치지 않는다.
   신호는 '면 · 선 · 글자' 세 쪽이 한 벌이다. 벌을 섞지 않는다. */
--green:#166F59;    /* 정상 · 절감 · 증액 */
--amber:#8A5A10;    /* 경과 주의 (D+3~6) */
--red:#BE3A45;      /* 초과 · 취소 · 긴급 · 예산 부족 */
--red-bg:#FCF0F1;--red-ln:#E4B6BC;
--amber-bg:#FFF8E8;--amber-ln:#E8D4B0;--amber-bar:#C79A3A;--amber-ink:#7A5410;
/* 모서리 — 네 단계만. 컨테이너가 컨트롤보다 한 단계 크면 겹쳐 놓았을 때 자연스럽다.
   막대는 조각이 맞닿아 있어 크게 굴리면 이가 벌어져 보이므로 가장 작게 둔다. */
--r-ctl:6px;        /* 버튼 · 입력 · 메뉴 항목 */
--r-box:10px;       /* 카드 · 표 · 모달 · 팝오버 */
--r-pill:999px;     /* 상태 배지 — 표의 사각 셀과 즉시 구분된다 */
--r-bar:3px;        /* 막대 · 범례 조각 */
/* 테두리 굵기 — 1 · 2 · 4 세 단계만 (3px 을 섞지 않는다).
   1px = 기본 구분(카드·표·입력)  2px = 강한 구분(표 머리글 아래·상세행 경계)
   4px = 한쪽 표식(안내·경고·근거 블록의 왼쪽 띠, 문서 머리의 위쪽 띠)
   굵기로 '무엇인가'를 말하고, 색으로 '어떤 신호인가'를 말한다. */
/* 그림자 — 세 단계만. '얼마나 떠 있는가'를 뜻한다.
   면을 나누는 데는 그림자를 쓰지 않는다(그건 테두리 몫이다). */
--sh-1:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05);  /* 카드 — 테두리 대신 이걸로 뜬다 */
--sh-2:0 4px 16px rgba(18,48,79,.16);     /* 살짝 뜬 것 (팝오버 · 인폼) */
--sh-3:0 12px 32px rgba(16,24,40,.20);    /* 완전히 뜬 것 (모달) */
--sh-cut:-2px 0 0 var(--white);           /* 뜬 것이 아니라 자르는 선 — 막대 조각 경계 */
/* 입력칸 높이 — 크롬은 select 의 line-height 를 무시하고(−3px), date 는 달력 아이콘 때문에
   +2px 로 그린다. 한 줄에 나란히 놓인 칸들이 어긋나 보이던 원인이라 높이를 못박는다. */
--h-ctl:38px;       /* 본문 입력·선택·날짜 (13px + 여백 8) */
--h-ctl-sm:28px;    /* 표 안 필터 줄 (12px + 여백 4) */
/* 하위호환 — 기존 선언이 참조하던 이름 */
--faint:#5C6878;--navy2:#17365D;--blue:#33608E;
}
*{box-sizing:border-box}
/* 여백 — 4 · 8 · 12 · 16 · 24 · 32 여섯 단계만 쓴다.
   4=라벨과 입력 사이, 8=한 덩어리 안, 12=칸과 칸 사이, 16=블록과 블록 사이,
   24=카드 안쪽, 32=본문 바깥 여백 */
/* 글꼴 — 화면은 Pretendard(가변), 없으면 맑은 고딕으로 조용히 내려간다.
   굵기는 400·700 두 종만 쓴다 — 맑은 고딕이 그 둘뿐이라, 폰트가 없는 PC 에서도
   화면이 같아 보이려면 선언을 그 둘에 맞춰야 한다.
   letter-spacing 은 양수·음수 모두 쓰지 않는다 — 한글은 기본 자간이 이미 맞다.
   줄높이는 배수(1.55)가 아니라 px 정수로 못박는다. 12px×1.55=18.6px 처럼 소수가 되면
   베이스라인이 서브픽셀에 걸려 줄마다 다르게 뭉개진다(윈도우에서 "글자가 우그러짐").

   ── 글꼴 파일 ────────────────────────────────────────────────
   static/fonts/PretendardVariable.woff2   (가변 — 이 한 개면 400·700 이 다 나온다)
   static/fonts/Pretendard-LICENSE.txt     (SIL OFL — 배포 시 함께 두어야 한다)
   파일이 없으면 아래 @font-face 는 조용히 무시되고 맑은 고딕으로 렌더된다.
   외부 CDN 을 부르지 않으므로 사내망 차단 환경에서도 안전하다.
   ※ 엑셀 내보내기(.xls)는 받는 PC 에 Pretendard 가 없으므로 맑은 고딕으로 고정한다.

font-family:"TB UI","Malgun Gothic","맑은 고딕",-apple-system,"Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line2);
padding:24px 16px;display:flex;flex-direction:column;overflow-y:auto}
/* 이름표 — 메뉴가 아니라 '이 시스템이 무엇인가'를 말하는 자리.
   그래서 메뉴(13px 한 줄)와 다른 척도를 쓴다: 로고 + 16px 제목 + 12px 영문 + 아래 경계선 */
.brand{display:block;padding:0 8px 16px;margin-bottom:0;border-bottom:1px solid var(--line);
text-decoration:none;cursor:pointer;user-select:none}
.brand .logo{display:block;width:88px;margin-bottom:12px}
.brand .logo svg{display:block;width:100%;height:auto}
.brand .bt{display:block;color:var(--navy);font-size:16px;line-height:24px;font-weight:700}
.brand .bs{display:block;color:var(--mut);font-size:12px;line-height:18px}
.brand:hover .bt{color:var(--s2)}
.brand:focus-visible{outline:2px solid var(--s2);outline-offset:2px;border-radius:var(--r-ctl)}
.nav-label{margin:16px 8px 4px;color:var(--mut);font-size:12px;line-height:18px;font-weight:700}
.nav a{display:block;margin:1px 0;padding:8px 12px;color:var(--ink2);border:1px solid transparent;
cursor:pointer;border-radius:var(--r-ctl);font-size:13px;line-height:20px;user-select:none}
.nav a:hover{background:var(--soft);border-color:var(--line2);color:var(--navy)}
/* 지금 보고 있는 화면 — 항목 전체를 옅은 남색 면으로 채운다.
   마우스만 올린 상태는 회색(--soft)이라 색으로 구분된다 */
.nav a.on{background:var(--s3bg);border-color:var(--s4ln);color:var(--navy);font-weight:700}
.nav a .lk{font-size:12px;line-height:18px;color:var(--mut);margin-left:4px;font-weight:400}
.nav a.on .lk{color:var(--navy)}
.nav a.ext{color:var(--ink2);font-weight:400;font-size:12px;line-height:18px;text-decoration:none}
.nav a.ext::after{content:' ↗';color:var(--mut);font-size:12px;line-height:18px}
.ver{padding:0 8px 8px;color:var(--mut);font-size:12px;line-height:18px}
.util{margin-top:auto}
.contact{padding:16px 8px 0;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--mut)}
.contact b{display:block;color:var(--navy);font-size:12px;line-height:18px}
.contact a{color:var(--navy);text-decoration:none}
main{width:100%;max-width:1560px;padding:32px 32px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{margin:0;color:var(--navy);font-size:24px;line-height:32px}
.top .sub{color:var(--mut);font-size:12px;line-height:18px}
.top select{margin-left:auto;width:130px}
.view{display:none}.view.on{display:block}
.card{background:var(--white);border:1px solid var(--line2);box-shadow:var(--sh-1);
padding:24px;margin-bottom:16px;border-radius:var(--r-box)}
/* 좁은 화면에서는 바깥 여백·카드 안쪽을 줄여 표가 가로로 밀리지 않게 한다 (규칙 순서상 .card 뒤에 둔다) */
@media(max-width:1279px){main{padding:24px 24px 48px}.card{padding:16px}}
.card h2{margin:0 0 4px;color:var(--navy);font-size:16px;line-height:24px}
.card .cap{margin:0 0 12px;color:var(--mut);font-size:12px;line-height:18px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.headsel{width:auto;min-width:200px;max-width:260px}
/* 예산 한 장 — 큰 숫자 + 구성 막대. KPI 카드 4장을 대체한다 */
.hero{background:var(--white);border:1px solid var(--line2);box-shadow:var(--sh-1);
border-radius:var(--r-box);padding:24px 24px;margin-bottom:16px}
.hero.alert{background:var(--red-bg);border-color:var(--red-ln)}
/* 예산 미배정 — 좋다/나쁘다가 아니라 '아직 없음'. 신호색을 쓰지 않는다 */
.hero.unset{background:var(--soft);border-color:var(--line)}
.hero.unset .lamp{background:var(--mut)}
.hero.unset .amount{color:var(--mut)}
.hero.unset .msg{color:var(--ink2);font-weight:700}
.hmain{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero .label{color:var(--mut);font-size:12px;line-height:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.hero .label .sub{color:var(--mut);font-weight:400}
.hero .lamp{width:8px;height:8px;border-radius:var(--r-pill);background:var(--green);flex-shrink:0}
.hero.alert .lamp{background:var(--red)}
.hero .amount{margin:4px 0 0;color:var(--navy);font-size:32px;line-height:38px;font-weight:700;
font-variant-numeric:tabular-nums}
.hero.alert .amount{color:var(--red)}
.hero .amount .won,.hero .htot .won{font-size:16px;line-height:24px;font-weight:700;margin-left:2px}
.hero .msg{margin-top:4px;font-size:13px;line-height:20px;font-weight:700;color:var(--green)}
.hero.alert .msg{color:var(--red)}
.hright{text-align:right}
.hero .htot{margin:4px 0 0;color:var(--ink2);font-size:20px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.hright .sub{color:var(--mut);font-size:12px;line-height:18px;margin-top:2px}
/* 구성 막대 — 총예산이 어디에 있는지 한 줄로 */
.stack{display:flex;height:14px;margin-top:16px;border-radius:var(--r-bar);overflow:hidden;background:var(--shade)}
.stack i{display:block;height:100%}
.s-done{background:var(--s1)}.s-wip{background:var(--s2)}
.s-cmt{background:var(--s3)}.s-ava{background:var(--track)}
.stack i+i{box-shadow:var(--sh-cut)}          /* 같은 색상 음영이라 경계선이 구분의 절반을 담당한다 */
/* 잠정 계획 — 예산에 반영되지 않으므로 위 막대에 섞지 않고, 같은 축·같은 폭으로 아래 따로 */
.ghost{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ghost .gl{font-size:12px;line-height:18px;color:var(--mut);margin-bottom:8px}
.ghost .gl b{color:var(--ink2)}
.ghost .stack{margin-top:0;height:8px;background:var(--track)}
.ghost .stack i{background:var(--s4)}
.skey{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:8px;font-size:12px;line-height:18px;color:var(--ink2)}
.skey span{display:flex;align-items:center;gap:8px}
.skey i{width:9px;height:9px;border-radius:var(--r-bar);display:block;flex-shrink:0}
.skey b{font-variant-numeric:tabular-nums;color:var(--navy)}
.hnote{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);
font-size:12px;line-height:18px;color:var(--mut)}
.hnote b{color:var(--ink2)}
/* 센터 제출 리포트 모달 전용 — 대시보드는 더 이상 쓰지 않지만 리포트가 쓴다 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);padding:16px 16px;border-radius:var(--r-box)}
.kpi span{display:block;color:var(--mut);font-size:12px;line-height:18px}
.kpi b{display:block;margin-top:4px;color:var(--navy);font-size:20px;line-height:28px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:12px;line-height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
label{display:block;margin-bottom:4px;color:var(--ink2);font-size:12px;line-height:18px;font-weight:700}
label .rq{color:var(--red)}label .au{color:var(--mut);font-weight:400;font-size:12px;line-height:18px;margin-left:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--white);padding:8px 8px;color:var(--ink);
font:inherit;font-size:13px;line-height:20px;border-radius:var(--r-ctl)}
/* 높이를 같게 — input · select · date 가 한 줄에서 눈높이가 맞아야 한다.
   선택자를 일부러 낮게 잡는다 — 표 안 필터(.colf) 처럼 자기 높이를 가진 칸이 이길 수 있게. */
input,select{height:var(--h-ctl)}
input[type=checkbox],input[type=radio],textarea{height:auto}
button,.btn{font-family:inherit}          /* 버튼도 본문과 같은 글꼴로 — 윈도우 기본 UI 글꼴 방지 */
input:focus,select:focus,textarea:focus{outline:2px solid rgba(37,99,168,.13);border-color:var(--s2)}
input[readonly],.auto{background:var(--shade);color:var(--mut)}
input[type=number],input.mny{text-align:right;font-variant-numeric:tabular-nums}
input.bad{border-color:var(--red);background:var(--red-bg)}
.fwarn{color:var(--red);font-size:12px;line-height:18px;font-weight:700;margin-top:4px}
.promptbox{margin:12px 0 0;padding:12px 16px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-box);
max-height:420px;overflow:auto;font-size:12px;line-height:18px;white-space:pre-wrap;word-break:break-word;
color:var(--ink2)}
/* 고정폭 — 붙여넣기 원문·미리보기처럼 자릿수가 맞아야 읽히는 곳에만 */
.mono,.promptbox{font-family:Consolas,"D2Coding","SF Mono",Menlo,"Malgun Gothic","맑은 고딕",monospace}
.card.just{border-left:4px solid var(--s2);background:var(--tint)}
.just .jt{font-weight:700;color:var(--navy);font-size:14px;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.just .jw{color:var(--ink2);font-size:12px;line-height:18px;margin:8px 0 8px}
.nav a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--s2);outline-offset:1px}
textarea{min-height:66px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--white);
color:var(--ink2);padding:8px 16px;font-weight:700;font-size:12px;line-height:18px;cursor:pointer;text-decoration:none;border-radius:var(--r-ctl)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--white)}.btn.pri:hover{background:var(--navy)}
.btn.red{color:var(--red);border-color:var(--red-ln)}
.btn.sm{padding:4px 8px;font-size:12px;line-height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* 카드 안에 들어가는 표라 테두리를 또 두르면 상자 안 상자가 된다 — 모서리만 남긴다 */
.scroll{overflow:auto;border-radius:var(--r-box)}
table{width:100%;border-collapse:collapse;background:var(--white)}
th,td{padding:12px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap;font-size:12px;line-height:18px}
/* 머리글은 배경을 깔지 않고 선 하나로 가른다 — 회색 띠가 화면을 무겁게 만들었다 */
th{background:transparent;color:var(--mut);font-size:12px;line-height:18px;font-weight:700;
padding-top:8px;padding-bottom:8px;border-bottom:2px solid var(--line)}
/* 출장 칸이 길면 뒤 칸들이 밀려 나간다 — 여기서만 말줄임하고, 행을 누르면 전부 보인다 */
td.trip{max-width:300px;position:relative;padding-right:16px}
td.trip>b,td.trip>.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.trip .tw{position:absolute;right:2px;top:50%;transform:translateY(-50%);
color:var(--s4);font-size:12px;line-height:18px}
/* 태그(#) — 분류·검색용. 상태 배지(색으로 단계)와 섞이지 않게 회색 계열 한 톤만 쓴다 */
.tag{display:inline-block;margin:4px 4px 0 0;padding:1px 8px;border:1px solid var(--line);
background:var(--surf);color:var(--ink2);border-radius:var(--r-pill);
font-size:12px;line-height:18px;font-family:inherit;cursor:pointer}
.tag:hover{border-color:var(--s4ln);background:var(--tint);color:var(--navy)}
.tag.on{background:var(--s3bg);border-color:var(--s4ln);color:var(--navy);font-weight:700}
td.trip .tags{margin-top:2px}
.tagpick{display:flex;flex-wrap:wrap;gap:0 4px;margin-top:4px}
/* 문답 — 한 화면에 질문 하나. 지나온 답은 위에 한 줄씩 쌓이고, 누르면 그리로 돌아간다. */
.card.askcard{background:var(--tint);border-color:var(--s4ln)}
.askq3{font-size:24px;line-height:32px;color:var(--navy);margin-bottom:16px}
/* 고르는 줄 — 넉넉하게. 누르면 바로 다음으로 넘어간다. */
.askopt{display:block;width:100%;text-align:left;font:inherit;font-size:16px;line-height:24px;
color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:8px;cursor:pointer}
.askopt:hover{border-color:var(--s3);background:var(--tint)}
.askopt .sub{display:block;margin-top:2px}
.askor{color:var(--mut);font-size:13px;line-height:20px;margin:16px 0 8px}
/* 사람 고르기는 이름만 짧아 줄로 늘어놓으면 화면을 다 먹는다 — 칩으로 눕힌다 */
.askchips{display:flex;flex-wrap:wrap;gap:8px}
.askchip{font:inherit;font-size:14px;line-height:22px;color:var(--ink);background:var(--white);
border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px 12px;cursor:pointer}
.askchip:hover{border-color:var(--s3);background:var(--tint)}
.askgrid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.askgrid .askopt{margin-bottom:0}
.askme{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.askme .btn{margin-left:auto}
.askdone{display:flex;width:100%;text-align:left;align-items:center;gap:8px;font:inherit;
font-size:13px;line-height:20px;color:var(--ink);background:none;border:0;
border-bottom:1px solid var(--line2);padding:8px 0;cursor:pointer}
.askdone .askv{flex:1;min-width:0}
.askdone .askedit{color:var(--mut)}
.askdone:hover .askedit{color:var(--s2)}
.askdone + .askq3{margin-top:24px}
.asksum{background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);
padding:16px;margin-bottom:12px}
.askfoot{margin-top:24px}
/* 체크박스가 폭 200px 로 늘어나던 것 — 필터 줄과 같은 처방 */
.askchk{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
.askchk input[type=checkbox]{flex:0 0 auto;min-width:0;width:auto;margin:0}
.tagbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
tr.lrow{cursor:pointer}
tr.lrow.open{background:var(--tint)}
tr.lrow.open td.trip .tw{color:var(--s2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surf)}
tfoot td{background:var(--shade);font-weight:700;color:var(--navy)}
td .sub{color:var(--mut);font-size:12px;line-height:18px}
/* 출장자별 비목 내역 — 정산서를 쓰려면 여기서 다 보여야 한다 */
.dtl-row>td{background:var(--surf);padding:12px!important;border-bottom:2px solid var(--line)}
.dtl-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;line-height:20px}
.dtl-head .gb{margin-left:auto;display:flex;gap:8px}
table.dtl{background:var(--white)}
table.dtl th{font-size:12px;line-height:18px;white-space:nowrap}
table.dtl td{padding:8px;font-size:12px;line-height:18px}
table.dtl tfoot td{background:var(--shade);font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.dtl-rm{margin-top:8px;padding:8px 12px;background:var(--white);border:1px solid var(--line);
border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--ink2)}
.dtl-rm b{color:var(--navy);margin-right:4px}
.pdtl{margin:0;padding:8px 12px 12px;border-top:1px solid var(--line2)}
.pdtl summary{font-size:12px;line-height:18px}
.pdtl summary .sub{font-weight:400;margin-left:4px}
/* 시스템 설정 — 값이 코드가 아니라 원장에 있으므로 화면에서 고친다 */
.cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cfg-row input{flex:1;min-width:0}
.cfg-row .btn{flex:0 0 auto}
.cfg-tbl input{padding:8px}
.cfg-tbl td{padding:4px}
.cfg-used{font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap}
.cfg-used b{color:var(--ink2)}
.cfg-warn{margin-top:8px;padding:12px;background:var(--amber-bg);border:1px solid var(--amber-ln);
border-left:4px solid var(--amber-bar);border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--amber-ink)}
.cfg-warn b{color:var(--amber-ink)}
.status{display:inline-block;padding:2px 8px;border:1px solid var(--s4ln);background:var(--white);color:var(--s1);font-size:12px;line-height:18px;font-weight:700;border-radius:var(--r-pill)}
/* 배지도 같은 단계 음영 — 채움 강도로 진행을 읽는다.
   흰 테두리(계획) → 옅은 바탕(확정) → 중간 채움(처리중) → 진한 채움(완료) */
.status.done{background:var(--s1);border-color:var(--s1);color:var(--white)}
.status.wip{background:var(--s2);border-color:var(--s2);color:var(--white)}
.status.cancel{background:var(--shade);color:var(--mut);text-decoration:line-through}
.status.urgent{background:var(--red-bg);border-color:var(--red-ln);color:var(--red)}
.status.hold{background:var(--red-bg);border-color:var(--red-ln);color:var(--red)}
.status.confirm{background:var(--s3bg);border-color:var(--s3ln);color:var(--s1)}
.pgroup{border:1px solid var(--line);border-radius:var(--r-box);margin-bottom:8px;overflow:hidden}
.pg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 12px;background:var(--surf);border-bottom:1px solid var(--line2)}
.pg-head .nm{font-weight:700;color:var(--navy)}
.pg-sum{font-size:12px;line-height:18px;color:var(--mut)}
.pg-sum b{color:var(--red)}
.pg-head .gb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* 바로 할 일 큐 — 건수가 아니라 '무엇이 며칠 묵었는가'. 눌러서 그 건으로 바로 간다 */
.queue{border:1px solid var(--line);border-radius:var(--r-box);margin-top:12px}
.qrow{display:grid;grid-template-columns:76px minmax(0,1fr) 56px 104px;align-items:center;
gap:12px;padding:8px 12px;border-bottom:1px solid var(--line2)}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surf)}
/* 큐의 종류 표시는 배지가 아니라 글자 — 단계 배지와 뜻이 겹치지 않게 */
.qk{font-size:12px;line-height:18px;font-weight:700;color:var(--mut)}
.qk.warn{color:var(--red)}
.qnm{font-size:13px;line-height:20px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd{text-align:right;font-size:12px;line-height:18px;font-weight:700;font-variant-numeric:tabular-nums}
.qmore{padding:8px 12px;font-size:12px;line-height:18px;color:var(--mut);border-top:1px solid var(--line2)}
/* 큐에서 넘어온 건을 잠깐 표시 — 스크롤만 하면 어느 블록인지 모른다 */
.pgroup.flash{outline:2px solid var(--s2);outline-offset:2px}
/* CCG 집행 막대 — 라이브러리 없이 div 로. 색은 상태 3색만 사용 */
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;align-items:center;gap:8px}
.bnm{font-size:12px;line-height:18px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar{height:16px;background:var(--shade);border-radius:var(--r-bar);display:flex;overflow:hidden}
.bbar i{display:block;height:100%}
.bbar i.sd,.lgd i.sd{background:var(--s1)}
.bbar i.sw,.lgd i.sw{background:var(--s2)}
.bbar i.sc,.lgd i.sc{background:var(--s3)}
.bbar i+i{box-shadow:var(--sh-cut)}
/* 확정 예정 — 집계에 안 들어가는 참고값. 사선으로 '아직 안 쓴 돈'임을 표시한다 */
.ghost-seg{background:repeating-linear-gradient(135deg,var(--s3) 0 3px,var(--white) 3px 6px)!important;opacity:.65}
.brow.only-cmt .bnm,.brow.only-cmt .bval{color:var(--mut)}
.lgd i.ghost-seg{opacity:.8}
.bval{text-align:right;font-size:12px;line-height:18px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
/* 구성비를 고정폭 칸에 넣어야 금액 끝이 세로로 맞는다 (안 그러면 8% 행과 34% 행이 어긋난다) */
.bval .sub{display:inline-block;width:32px;text-align:right}
.lgd{display:flex;gap:12px;font-size:12px;line-height:18px;color:var(--mut);font-weight:400;flex-wrap:wrap}
.lgd span{display:flex;align-items:center;gap:4px}
.lgd i{width:10px;height:10px;border-radius:var(--r-bar);display:block}
/* 비목 구성 — 단계가 아니라 범주다. 색으로 나누면 단계 음영과 헷갈리므로
   전부 같은 색 한 겹으로 두고 이름과 길이로만 구분한다 */
.cost{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.cost .ct{font-size:12px;line-height:18px;font-weight:700;color:var(--navy);margin-bottom:8px}
.cost .ct span{font-weight:400;color:var(--mut)}
.cost .bbar i{background:var(--s2)}
.fold{margin-top:16px}
.fold summary{cursor:pointer;font-size:12px;line-height:18px;font-weight:700;color:var(--navy);padding:4px 0;user-select:none}
.fold summary:hover{text-decoration:underline}
.ref{margin-top:16px;padding:8px 12px;background:var(--soft);border-left:4px solid var(--mut);
border-radius:var(--r-box);font-size:12px;line-height:18px;color:var(--ink2)}
.ref b{color:var(--navy)}
.ref .sub{display:block;margin-top:4px}
.note{padding:8px 12px;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font-size:12px;line-height:18px;border-radius:var(--r-box);margin-bottom:12px}
.err{margin-bottom:12px;padding:8px 12px;border:1px solid var(--red-ln);background:var(--red-bg);color:var(--red);font-size:12px;line-height:18px;border-radius:var(--r-box);white-space:pre-line}
/* 출장자 표 — 1280px 에서 가로 스크롤 없이 들어가도록 열 폭을 맞춘다.
   첫 칸 고정(sticky)은 쓰지 않는다: 스크롤되면 뒷칸 위에 겹쳐 올라가
   사번·직책 칸이 성명 칸 밑으로 사라졌다(최대 72px 침범). 행이 1~4개뿐이라 고정이 필요 없다. */
.trav-table input,.trav-table select{min-width:0;padding:8px 8px;font-size:13px;line-height:20px}
.trav-table td{padding:4px}
.trav-table .w-nm{min-width:84px}.trav-table .w-no{min-width:82px}.trav-table .w-rk{min-width:72px}
.trav-table .w-tm{min-width:148px}
/* 데스크톱(1360px 이상 — 사내 표준 1366×768 포함)에서는 가장 긴 팀 이름 + CCG 번호가
   닫힌 상태에서도 다 보이게 넓힌다. 그보다 좁으면 표가 가로로 밀리므로 좁게 두고,
   번호는 목록을 펼치면 온전히 보인다. */
@media(min-width:1360px){.trav-table .w-tm{min-width:240px}}
/* 금액칸은 두 표(계획·실적)에서 같은 크기여야 한다.
   폭을 안 잡으면 열이 적은 실적 표에서 195px 까지 늘어나 계획 표와 리듬이 어긋난다.
   남는 폭은 칸을 늘리지 않고 여백으로 둔다 — 오른쪽 정렬이라 숫자 열은 그대로 맞는다. */
/* 금액칸은 '1,250,000' 이 들어가면 충분하다. 상한을 낮춰 남는 폭을 CCG 칸에 준다
   (두 표가 같은 상한을 쓰므로 계획·실적 표의 금액칸 크기도 서로 같아진다) */
.trav-table .w-mn{min-width:76px;max-width:88px;display:block;margin-left:auto}
/* 한 행 안의 칸은 전부 한 줄이어야 옆 칸과 눈높이가 맞는다 (CCG 코드는 선택지 안에 있다).
   입력 표에서는 버튼도 입력칸과 같은 높이 — 한 줄이 통째로 반듯해진다 */
.trav-table td{vertical-align:middle}
.trav-table td .btn{height:var(--h-ctl)}
/* 비용 4열을 묶는 그룹 머리 — 열 폭이 '계획 식대&잡비' 같은 긴 머리글에 끌려다니지 않게 */
.trav-table thead th{vertical-align:bottom}
.trav-table th.grp{text-align:center;border-bottom:1px solid var(--line2);
font-weight:700;color:var(--mut);padding-bottom:4px}
.trav-table th.sub2{font-weight:700;color:var(--ink2)}
/* 인폼은 떠 있지 않고 화면 맨 아래에 놓인다 — 아래쪽 버튼을 가리지 않는다 */
.mailcard{margin:16px 0 0;background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);overflow:hidden;
box-shadow:var(--sh-1)}
.mailcard .mh{background:var(--navy);color:var(--white);padding:8px 16px;font-size:12px;line-height:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mailcard .mh button{background:none;border:0;color:var(--s4);font-size:16px;line-height:24px;cursor:pointer;padding:0 4px}
.mailcard .mh button:hover{color:var(--white)}
.mailcard .mhb{display:flex;gap:2px;align-items:center}

.mailcard .meta{padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;line-height:18px}
.mailcard .meta .row{display:flex;gap:8px;margin-bottom:4px}
.mailcard .meta .k{color:var(--mut);font-weight:700;width:36px;flex-shrink:0}
.mailcard .how{padding:8px 16px;background:var(--tint);border-bottom:1px solid var(--line);
font-size:12px;line-height:18px;color:var(--ink2)}
.mailcard .how b{color:var(--navy)}
.mailcard .how .sub{color:var(--mut)}
/* 끌 수 있는 곳임을 눈으로 알리는 구역 — 점선 테두리 + 손잡이 + 잡는 커서 */
.mailcard .dragzone{margin:12px 16px 0;border:2px dashed var(--s3);border-radius:var(--r-box);background:var(--tint);
transition:border-color .12s,background .12s,box-shadow .12s}
.mailcard .dragzone:hover{border-color:var(--s2);background:var(--tint2);box-shadow:var(--sh-1)}
.mailcard .dragzone.dragging{border-color:var(--s1);background:var(--tint2);box-shadow:var(--sh-2)}
.apv-tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;background:var(--white)}
.apv-tbl th{background:var(--surf);color:var(--ink2);font-size:12px;line-height:18px;text-align:left;
padding:8px;border-bottom:2px solid var(--line)}
.apv-tbl td{padding:8px;border-bottom:1px solid var(--line2)}
.apv-tbl td:first-child{color:var(--mut);white-space:nowrap;width:1%}
.mailcard .draghint{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--s4ln);
font-size:12px;line-height:18px;color:var(--s2);font-weight:700;cursor:grab;user-select:none}
.mailcard .draghint b{color:var(--navy)}
.mailcard .draghint .grip{font-size:14px;line-height:22px;color:var(--s3)}
.mailcard .dragzone:hover .draghint .grip{color:var(--s2)}
.mailcard .body{padding:12px;overflow:auto;max-height:420px;cursor:grab}
.mailcard .dragzone:active,.mailcard .body:active,.mailcard .draghint:active{cursor:grabbing}
.mailcard .mfhint{margin-left:auto;font-size:12px;line-height:18px;color:var(--mut)}
.mailcard .mf{padding:8px 16px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.46);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-box{width:330px;max-width:96vw;background:var(--white);border:1px solid var(--line);
border-radius:var(--r-box);overflow:hidden;box-shadow:var(--sh-3)}
.modal-box .mh{background:var(--navy);color:var(--white);padding:12px 16px;font-size:14px;line-height:22px;font-weight:700}
.modal-box .mb{padding:16px}
.modal-box .hint{font-size:12px;line-height:18px;color:var(--mut);background:var(--shade);padding:8px 8px;margin:8px 0 12px;border-radius:var(--r-box)}
.modal-box .hint b{color:var(--navy)}
.modal-box .merr{color:var(--red);font-size:12px;line-height:18px;margin-bottom:8px;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--white);
padding:8px 16px;z-index:200;font-size:12px;line-height:18px;font-weight:700;border-radius:var(--r-box)}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row input,.filter-row select{width:auto;min-width:170px}
.filter-row input{flex:1;min-width:200px}
.filter-row input[type=checkbox]{flex:0 0 auto;min-width:0;width:auto}   /* 체크박스까지 200px 로 늘던 것 */
tr.grp-head td{background:var(--tint2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
padding:8px 8px;color:var(--navy)}
tr.grp-head:hover td{background:var(--tint2)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:var(--tint2);color:var(--navy)}
th .sic{color:var(--s2);font-size:12px;line-height:18px}
tr.filt th{background:var(--surf);padding:4px 4px;border-bottom:1px solid var(--line)}
.colf{width:100%;min-width:74px;height:var(--h-ctl-sm);padding:4px 8px;font-size:12px;line-height:18px;
border:1px solid var(--line);border-radius:var(--r-ctl)}
/* 상태 고르는 칸은 '계획(잠정)' 같은 이름이 통째로 들어가야 한다 — 잘리면 고를 수가 없다 */
.colf-sel{min-width:104px}
.colf::placeholder{color:var(--mut);font-size:12px;line-height:18px;opacity:1}   /* 1.87:1 → 5.67:1 */
@media(max-width:980px){.filter-row input,.filter-row select,.filter-row .btn{width:100%;min-width:0}}
/* 여러 건 골라 한 번에 확정 — 고른 게 있을 때만 나타나는 띠 */
th.pick,td.pick{width:32px;padding-left:8px;padding-right:0;text-align:center}
th.pick input,td.pick input{width:auto;min-width:0;margin:0;cursor:pointer}
tr.picked td{background:var(--tint)}
.selbar{display:none}
.selbar.on{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
margin:0 0 12px;padding:8px 12px;background:var(--s3bg);border:1px solid var(--s4ln);border-radius:var(--r-box);
font-size:13px;line-height:20px;color:var(--navy)}
/* 행의 ⋯ 메뉴 — 되돌릴 수 없는 동작을 주요 동작과 같은 크기로 늘어놓지 않는다 */
details.rowmenu{display:inline-block;position:relative}
details.rowmenu>summary{list-style:none;display:inline-block;padding:4px 8px;cursor:pointer}
details.rowmenu>summary::-webkit-details-marker{display:none}
details.rowmenu[open]>summary{background:var(--s3bg);border-color:var(--s4ln)}
.rowmenu-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:180px;
background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);box-shadow:var(--sh-2);
padding:4px 0;text-align:left}
.rowmenu-item{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:0;
font-size:13px;line-height:20px;color:var(--ink);cursor:pointer;white-space:nowrap}
.rowmenu-item:hover{background:var(--tint)}
.rowmenu-item.danger{color:var(--red);border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.rowmenu-item.danger:hover{background:var(--red-bg)}
/* 대시보드 안내 문구 */
.notice{background:var(--amber-bg);border:1px solid var(--amber-ln);border-left:4px solid var(--amber-bar);border-radius:var(--r-box);
padding:12px 16px;margin-bottom:16px}
.notice .nt{color:var(--amber-ink);font-size:13px;line-height:20px;font-weight:700;white-space:pre-line}
.notice .ns{color:var(--amber);font-size:12px;line-height:18px;margin-top:4px}
.notice .ne{margin-top:8px}
.notice textarea{min-height:60px;font-size:13px;line-height:20px}
/* 이용 안내(흐름) */
.g-lead{background:var(--tint);border:1px solid var(--line);border-radius:var(--r-box);padding:16px 24px;margin-bottom:16px}
.g-lead h2{margin:0 0 8px;color:var(--navy);font-size:16px;line-height:24px}
.g-lead p{margin:0;color:var(--ink2);font-size:13px;line-height:20px}
.g-formula{display:inline-block;margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-box);padding:8px 12px;font-size:13px;line-height:20px;font-weight:700;color:var(--navy)}
.flowbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.flowbar .pill{padding:8px 12px;border-radius:var(--r-pill);font-size:12px;line-height:18px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--navy)}
.flowbar .pill{background:var(--white);border-color:var(--s4ln);color:var(--s1)}
.flowbar .pill.confirm{background:var(--s3bg);border-color:var(--s3ln);color:var(--s1)}
.flowbar .pill.wip{background:var(--s2);border-color:var(--s2);color:var(--white)}
.flowbar .pill.done{background:var(--s1);border-color:var(--s1);color:var(--white)}
.flowbar .arrow{color:var(--mut);font-weight:700}
.gstep{display:flex;gap:16px;padding:16px 2px;border-top:1px solid var(--line2)}
.gstep:first-of-type{border-top:0}
.gnum{width:30px;height:30px;border-radius:var(--r-pill);background:var(--navy);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:22px;flex-shrink:0}
.gstep.admin .gnum{background:var(--s2)}.gstep.cancel .gnum{background:var(--mut)}
.gbody{flex:1;min-width:0}
.gtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--navy);font-size:14px;line-height:22px}
.grole{padding:1px 8px;border-radius:var(--r-pill);font-size:12px;line-height:18px;font-weight:700}
/* 역할은 단계가 아니다 — 음영 램프를 쓰지 않고 중립 회색 칩 하나로 */
.grole.owner,.grole.admin{background:var(--shade);color:var(--ink2);border:1px solid var(--line)}
.gwhat{margin:8px 0 8px;color:var(--ink2);font-size:13px;line-height:20px}
.gauto{font-size:12px;line-height:18px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:var(--r-box);padding:8px 8px;display:inline-block}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:18px;color:var(--mut);margin-top:4px}
.glegend span{display:inline-flex;align-items:center;gap:8px}
.glegend .arrow{color:var(--mut);font-weight:700}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}aside,main{min-width:0;max-width:100%}aside{position:relative;height:auto}
.contact{margin-top:16px}.kpis,.grid2,.c4,.c3,.c2{grid-template-columns:1fr}main{padding:16px}
.top select{margin-left:0}
.hero{flex-wrap:wrap}.hero>div{min-width:0}.hero .amount{font-size:20px;line-height:28px}.hero .fig{word-break:keep-all;white-space:normal}}
@media print{
  aside,.top select,.btns,.btn,.mailcard,.modal,.filter-row,tr.filt,.nav{display:none!important}
  /* 조작용 UI 는 결재 첨부물에 찍히면 안 된다 — 선택칸·⋯메뉴·선택 띠 */
  th.pick,td.pick,details.rowmenu,.selbar{display:none!important}
  tr.picked td{background:transparent!important}
  .app{display:block}main{max-width:none;padding:0}
  .card,.hero,.kpi,.scroll{border:1px solid var(--mut);box-shadow:none;break-inside:avoid}
  th,td{white-space:normal}
  body{background:var(--white);font-size:11pt}
}

■ 변환 규칙 (중요)

1) 그룹 묶기 — 원본이 "1인 1행"이면, 아래가 모두 같은 행들은 **한 group 으로 합치고**
   각 사람을 travelers 배열에 넣습니다.
     출장도시 + 출장기관&업체 + 출발일자 + 복귀일자 + 출장목적&사유
   (같은 출장을 다녀온 동행자입니다. 절대 사람 수만큼 group 을 만들지 마세요.)

2) group_id — "TB-0001" 부터 순번으로 부여. 전체에서 유일해야 합니다.

3) emp_no — **문자열**로. 앞의 0 이 있으면 유지 ("0012345"). 같은 group 안에서 중복 금지.
   중복이면 서로 다른 사람인지 확인하고, 정말 같은 사람이면 한 명으로 합치세요.

4) 금액 — **정수(원)**. 콤마·"원"·공백 제거. 빈 칸은 0.
   소수점이 있으면 반올림. 음수는 0 으로. 1억(100000000)을 넘는 값은 자릿수 오류이니
   원본을 그대로 두지 말고 해당 건을 [확인필요] 목록에 올리세요.

5) status 판정 — **원본에 근거가 있을 때만** 아래로 정합니다.
     정산/지급 완료가 원본에 명시된 건            → "처리 완료"
     이관했다고 명시된 건                        → "소재 이관"
     실적 금액이 있으나 처리 여부는 불명          → "실적 입력·인폼"
     아직 안 갔고 실제로 간다고 명시된 건         → "확정 예정"
     아직 안 갔고 갈지 미정인 건                 → "계획 등록"
     취소된 건                                  → "취소"

   [주의] 실적 금액이 있다는 이유만으로 "처리 완료" 로 추론하지 마세요.
     처리 완료는 돈이 실제로 나갔다는 뜻이라, 잘못 넣으면 예산 잔액이 틀어집니다.
     근거가 없으면 실적이 있어도 "실적 입력·인폼", 실적이 없으면 "계획 등록" 으로 두고
     해당 건을 _confirm_needed 에 적으세요.

6) 사람마다 처리 상태가 다른 경우 — 5명 중 3명만 처리됐다면
   각 traveler 에 "status" 를 개별로 넣습니다. 허용값:
     실적 입력·인폼 / 소재 이관 / 처리 완료 / 보류
   (예: 예산 부족으로 못 넘긴 사람은 "보류")
   전원이 같은 상태면 traveler 의 status 는 넣지 마세요.

7) 날짜 — 반드시 "YYYY-MM-DD". "2026.8.4", "26/08/04", "8월 4일" 등은 모두 변환.
   연도가 없으면 같은 시트의 다른 행이나 분기 정보로 추정하고, 추정한 건은 [확인필요]에 올리세요.
   복귀일이 출발일보다 빠르면 안 됩니다(당일 출장은 두 날짜가 같음).

8) 없는 값은 **지어내지 마세요.** 문자열은 "", 금액은 0 으로 둡니다.

────────────────────────────────
[출력 전 자가 점검 — 통과 못 하면 고쳐서 다시 출력]

□ 출력 전체가 JSON 하나인가 — json.load() 로 바로 읽히는가 (코드펜스·설명문 없이)
□ 최상위에 settings / budget / groups / audit_log 가 모두 있는가
□ 모든 group 에 travelers 가 1명 이상 있는가
□ 모든 group_id 가 유일한가
□ 같은 group 안에 emp_no 중복이 없는가
□ 모든 dep_dt / ret_dt 가 YYYY-MM-DD 이고, ret_dt >= dep_dt 인가
□ status / kind / rank / car / plan_type / ccg_nm 이 전부 허용값 목록과 글자까지 같은가
□ 모든 금액이 콤마 없는 정수인가 (0 이상, 1억 이하)
□ LV2·CCG코드·출장일수·총합계 같은 자동계산 필드를 넣지 않았는가
□ 근거 없이 "처리 완료" 로 추론한 건이 없는가

[출력 형식 — 반드시 지킬 것]
출력 전체가 **JSON 하나**여야 합니다. json.load() 로 바로 읽히지 않으면 실패입니다.
- 마크다운 코드펜스 금지, 인사말·설명·주석 금지, JSON 앞뒤에 어떤 글자도 붙이지 마세요.
- 판단이 애매했던 건은 **JSON 안의 _confirm_needed 배열**에 넣습니다. (시스템은 이 키를 무시합니다)

  "_confirm_needed": [
    "TB-0007 : 복귀일자 없음 → 출발일과 같게 처리",
    "TB-0012 : 실적 3,200,000원 (원본 자릿수 확인 요망)"
  ]

애매한 건이 없으면 "_confirm_needed": [] 로 둡니다.

────────────────────────────────
[원본 데이터]

(여기에 엑셀/CSV 내용을 붙여넣으세요)`;

  const aw = d.todo.actual_wait.length, pw = d.todo.process_wait.length, hd = (d.todo.hold || []).length;
  const QMAX = 6;
  const qitem = (gid, kind, cls, label, act, fn) => {
    const g = ST.groups.find(x => x.group_id === gid);
    if (!g) return null;
    const n = daysSince(g.ret_dt);
    return {g, kind, cls, label, act, fn, d: (n != null && n >= 0) ? n : null};
  };
  const qrows = [
    ...(d.todo.hold || []).map(id => qitem(id, 'hold', 'red', '보류', '처리 관리 →', 'openProcess')),
    ...d.todo.actual_wait.map(id => qitem(id, 'act', '', '실적 대기', '실적 입력 →', 'openActual')),
    ...d.todo.process_wait.map(id => qitem(id, 'proc', '', '이관·처리', '처리 관리 →', 'openProcess')),
  ].filter(Boolean).sort((a, b) => (b.d ?? -1) - (a.d ?? -1));   // 오래 묵은 건이 위로
  const dcol = n => n == null ? 'var(--mut)'
    : n >= 7 ? 'var(--red)' : n >= 3 ? 'var(--amber)' : 'var(--mut)';
  // 복귀 전(d=null)은 급할 이유가 없으니 큐 아래로
  const todo = qrows.length ? `
    <div class="card"><h2>바로 할 일</h2>
      <p class="cap">오래 묵은 순. 누르면 그 건으로 갑니다.</p>
      <div class="queue">
        ${qrows.slice(0, QMAX).map(r => `<div class="qrow">
          <div class="qk${r.cls === 'red' ? ' warn' : ''}">${r.label}</div>
          <div class="qnm">${esc(gname(r.g))} <span class="sub">${esc(names(r.g))}</span></div>
          <div class="qd" style="color:${dcol(r.d)}">${r.d == null ? '–' : 'D+' + r.d}</div>
          <button class="btn sm${r.cls === 'red' ? ' red' : ''}"
            onclick="${r.fn}('${r.g.group_id}')">${r.act}</button>
        </div>`).join('')}
        ${qrows.length > QMAX ? `<div class="qmore">외 ${qrows.length - QMAX}건 —
          <a onclick="nav('list')" style="color:var(--navy);cursor:pointer;font-weight:700">출장 내역</a>에서 전체 보기</div>` : ''}
      </div>
      <div class="btns"><button class="btn" onclick="showReport()">센터 제출 리포트</button></div>
    </div>` : `
    <div class="card"><h2>바로 할 일</h2><p class="cap">지금 처리할 건이 없습니다.</p>
      <div class="btns" style="margin-top:0"><button class="btn" onclick="showReport()">센터 제출 리포트</button></div></div>`;
  // ── CCG팀별 집행 — 막대로 도식화. 잠정(예산 미반영)은 표에서 빼고 아래에 따로 표기.
  //    (잠정 금액을 같은 표에 두면 실제 집행액보다 커져 숫자가 튀어 보임)
  // 부서별 구분은 실집행(처리 중 + 처리 완료) 기준. 확정 예정은 아직 안 쓴 돈이라
  // 합계·구성비에서 빼고 막대 뒤에 흐리게 덧붙인다 — '앞으로 들어올 것'으로만 읽히게.
  const rowsData = d.byCcg;
  const barTot = Math.max(1, rowsData.reduce((a, r) => a + r.total, 0));
  const seg = (v, cls) => v > 0 ? `<i class="${cls}" style="width:${(v / barTot * 100).toFixed(2)}%"></i>` : '';
  const bars = rowsData.map(r => {
    const cm = r.commit || 0;
    return `<div class="brow${r.total ? '' : ' only-cmt'}">
      <div class="bnm">${esc(r.team)}<span class="sub"> ${r.total ? `${r.people}명` : `예정 ${r.cpeople || 0}명`}</span></div>
      <div class="bbar" title="처리 완료 ${won(r.done)} · 처리 중 ${won(r.wip)}${cm ? ` / 확정 예정 ${won(cm)}` : ''}">
        ${seg(r.done, 'sd')}${seg(r.wip, 'sw')}${seg(cm, 'sc ghost-seg')}</div>
      <div class="bval">${r.total ? won(r.total) : '–'}<span class="sub"> ${r.total ? Math.round(r.share * 100) + '%' : '예정'}</span></div>
    </div>`;
  }).join('') || '<div class="note" style="margin:0">집행 내역이 없습니다.</div>';
  const cmtTot = rowsData.reduce((a, r) => a + (r.commit || 0), 0);

  const rows = rowsData.map(r => `<tr>
    <td><b>${esc(r.team)}</b> <span class="sub">${r.ccg}</span></td>
    <td class="num">${won(r.done)}</td><td class="num">${won(r.wip)}</td>
    <td class="num" style="color:var(--s2)">${won(r.commit || 0)}</td>
    <td class="num"><b>${won(r.done + r.wip + (r.commit || 0))}</b></td>
    <td class="num">${(r.share * 100).toFixed(1)}%</td>
    <td class="num">${r.people}</td></tr>`).join('')
    || '<tr><td colspan="7" style="color:var(--faint);text-align:center;padding:16px">집행 내역이 없습니다.</td></tr>';
  const tot = rowsData.reduce((a, r) => ({done: a.done + r.done, wip: a.wip + r.wip,
    commit: a.commit + (r.commit || 0), people: a.people + r.people}), {done:0, wip:0, commit:0, people:0});
  const totSum = tot.done + tot.wip + tot.commit;
  // 비목 구성 — CCG(누가 썼나) 다음에 무엇에 썼나. 같은 합계를 다른 축으로.
  // 단계 음영과 헷갈리지 않도록 색으로 나누지 않고 이름·길이로만 구분한다.
  function costStrip(d){
    const cs = (d.byCost || []).filter(c => c.amt > 0);
    const sum = cs.reduce((a, c) => a + c.amt, 0);
    if (!sum) return '';
    // CCG 막대와 같은 규칙 — 분모는 합계. 라벨이 35%면 막대도 35%.
    const denom = Math.max(1, sum);
    return `<div class="cost"><div class="ct">비목 구성 <span>합계 ${won(sum)}원</span></div>
      <div class="bars">${cs.map(c => `<div class="brow">
        <div class="bnm">${c.name}</div>
        <div class="bbar" title="${c.name} ${won(c.amt)}원"><i style="width:${(c.amt / denom * 100).toFixed(2)}%"></i></div>
        <div class="bval">${won(c.amt)}<span class="sub"> ${Math.round(c.share * 100)}%</span></div>
      </div>`).join('')}</div></div>`;
  }

  const ccg = !rowsData.length ? `
    <div class="card">
      <h2>CCG팀(부서)별 집행 현황</h2>
      <div class="note" style="margin:0">이번 분기(${esc(YQ)}) 집행 내역이 아직 없습니다 —
        출장을 <b>확정</b>하면 팀별·비목별로 여기에 쌓입니다.</div>
    </div>` : `
    <div class="card">
      <div class="card-head"><h2>CCG팀(부서)별 집행 현황</h2>
        <div class="lgd"><span><i class="sd"></i>처리 완료</span><span><i class="sw"></i>처리 중</span>
          <span><i class="sc ghost-seg"></i>확정 예정 <span class="sub">집계 제외</span></span></div></div>
      <div class="bars">${bars}</div>
      <details class="fold"><summary>금액 표로 보기</summary>
        <div class="scroll" style="margin-top:8px"><table>
          <thead><tr><th>CCG팀</th><th class="num">처리 완료</th><th class="num">처리 중</th>
            <th class="num">확정 예정</th><th class="num">합계</th><th class="num">구성비</th>
            <th class="num">인원</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>합계</td><td class="num">${won(tot.done)}</td><td class="num">${won(tot.wip)}</td>
            <td class="num">${won(tot.commit)}</td><td class="num">${won(totSum)}</td>
            <td class="num">${totSum ? '100.0%' : '–'}</td><td class="num">${tot.people}</td></tr></tfoot>
        </table></div></details>
      ${costStrip(d)}
      ${(d.nUsedTrips || 0) || cmtTot ? `<div class="ref">실집행 <b>${d.nUsedTrips || 0}건</b> · 인원 <b>${d.nUsedPeople || 0}명</b>
        <span class="sub">위 금액·인원은 처리 중·처리 완료만 셉니다${
          cmtTot ? ` · 확정 예정 ${won(cmtTot)}원은 아직 집계 밖` : ''}</span></div>` : ''}
    </div>`;
  // 부서별 현황이 먼저다 — 매번 스크롤해야 보이던 자리(y≈940px)를 첫 화면으로 올린다.
  // '바로 할 일' 큐는 그 아래. 큐는 목록·처리 화면에도 진입로가 있지만 부서별 집계는 여기뿐이다.
  $('#v-dash').innerHTML = notice + '<div class="askbox"></div>' + hero + ccg + todo;
  askDraw();
}

/* 'YYYY-MM-DD' 를 Date.parse 에 넘기면 UTC 로 잡혀 KST 오전에 하루가 모자란다.
   로컬 자정 기준으로 직접 만든다. */
function dLocal(s){ const [y, m, d] = String(s || '').split('-').map(Number);
  return (y && m && d) ? new Date(y, m - 1, d) : null; }
function daysSince(s){ const t = dLocal(s); return t == null ? null
  : Math.floor((new Date().setHours(0, 0, 0, 0) - t) / 864e5); }
/* 큐에서 바로 그 건으로 — 이동 후 다시 찾게 만들지 않는다 */

  sel.value = gid; pickActual(gid);
}

let TRAV_N = 0;
function travRow(p = {}){
  TRAV_N++;
  /* 팀 이름이 아니라 CCG 코드로 맞춘다.
     이름으로 맞추면, 설정에서 팀 이름을 바꾼 뒤 예전 건을 열었을 때 아무것도 선택되지 않고
     저장 시 팀 이름이 빈 값으로 덮여 쓰였다 (코드는 남아 검증은 통과 → 조용히 이름만 소실). */
  const known = !!p.ccg && ST.ccg.some(t => t.ccg === p.ccg);
  const teams = ST.ccg.map(t => {
    const sel = p.ccg ? t.ccg === p.ccg : t.team === p.ccg_nm;
    return `<option value="${esc(t.team)}" data-ccg="${esc(t.ccg)}"${sel ? ' selected' : ''}>`
      + `${esc(t.team)} · ${esc(t.ccg)}</option>`;
  }).join('')
  // 목록에 없는 코드(폐지된 팀 등)는 저장된 값을 그대로 남긴다 — 열었다고 지워지면 안 된다
  + (p.ccg && !known
     ? `<option value="${esc(p.ccg_nm || p.ccg)}" data-ccg="${esc(p.ccg)}" selected>`
       + `${esc(p.ccg_nm || p.ccg)} · ${esc(p.ccg)} (목록에 없음)</option>` : '');
  const ranks = ST.meta.ranks.map(r => `<option${r === (p.rank || 'TL') ? ' selected' : ''}>${r}</option>`).join('');
  return `<tr data-tid="${TRAV_N}">
    <td><input class="w-nm t-nm" value="${esc(p.name || '')}" placeholder="성명"></td>
    <td><input class="w-no t-no" value="${esc(p.emp_no || '')}" placeholder="사번"></td>
    <td><select class="w-rk t-rk" aria-label="직책">${ranks}</select></td>
    <td><select class="w-tm t-tm" aria-label="CCG팀(CCG 번호 포함)" onchange="syncCcg(this)"><option value="">선택</option>${teams}</select>
      <input class="t-cc" type="hidden" value="${esc(p.ccg || '')}"></td>
    ${KEYS.map(k => `<td>${mfield('w-mn t-p-' + k, p['p_' + k], '0', 'planSum()')}</td>`).join('')}
    <td class="num t-sum" style="font-weight:700">0</td>
    <td><button class="btn sm" onclick="this.closest('tr').remove(); planSum()">삭제</button></td>
  </tr>`;
}
function syncCcg(sel){
  // 선택지에 실린 코드를 그대로 쓴다 — 목록에 없는 팀(폐지 등)도 코드를 잃지 않게
  const opt = sel.selectedOptions[0];
  const code = (opt && opt.dataset.ccg) || (ST.ccg.find(x => x.team === sel.value) || {}).ccg || '';
  const tr = sel.closest('tr');
  tr.querySelector('.t-cc').value = code;
}
function planSum(){
  let tot = 0;
  $$('#travBody tr').forEach(tr => {
    let s = 0;
    KEYS.forEach(k => s += mnum(tr.querySelector('.t-p-' + k)));
    tr.querySelector('.t-sum').textContent = won(s);
    tot += s;
  });
  const el = $('#planTot'); if (el) el.textContent = won(tot) + '원';
  const d1 = $('#pl_dep')?.value, d2 = $('#pl_ret')?.value;
  const dy = $('#pl_days'), warn = $('#plDateWarn');
  const days = (d1 && d2) ? (new Date(d2) - new Date(d1)) / 864e5 + 1 : null;
  if (dy) dy.value = days === null ? '' : Math.max(0, days);
  if (warn) {   // 잘못된 기간은 제출 전에 그 자리에서 알려준다
    const bad = days !== null && days < 1;
    warn.textContent = bad ? '복귀일자가 출발일자보다 빠릅니다' : '';
    warn.style.display = bad ? 'block' : 'none';
    dy?.classList.toggle('bad', bad);
  }
}

function copyPlan(gid){
  if (!gid) return;
  const g = ST.groups.find(x => x.group_id === gid);
  if (!g) return;
  $('#pl_type').value = g.plan_type; $('#pl_city').value = g.city; $('#pl_org').value = g.org;

function collectTravelers(){
  return $$('#travBody tr').map(tr => {
    const p = {name: tr.querySelector('.t-nm').value.trim(),
      emp_no: tr.querySelector('.t-no').value.trim(),
      rank: tr.querySelector('.t-rk').value,
      ccg_nm: tr.querySelector('.t-tm').value,
      ccg: tr.querySelector('.t-cc').value};
    KEYS.forEach(k => p['p_' + k] = mnum(tr.querySelector('.t-p-' + k)));

/* 태그는 주관식이 기본이고, 이미 쓰인 것은 눌러서 넣을 수 있게 한다
   (선택형만 두면 새 분류를 못 만들고, 주관식만 두면 같은 뜻이 여러 철자로 갈린다) */
function addPlanTag(tag){
  const el = $('#pl_tags'); if (!el) return;
  const cur = el.value.split(',').map(s => s.trim()).filter(Boolean);
  if (!cur.includes(tag)) cur.push(tag);
  el.value = cur.join(', ');
  el.focus();
}
function submitPlan(){ return once('#planBtn', _submitPlan); }
async function _submitPlan(){
  const body = {plan_type: $('#pl_type').value, city: $('#pl_city').value.trim(),
    org: $('#pl_org').value.trim(), kind: $('#pl_kind').value,
    dep_dt: $('#pl_dep').value, ret_dt: $('#pl_ret').value, car: $('#pl_car').value,
    purpose: $('#pl_purpose').value.trim(), remark: $('#pl_remark').value.trim(),
    tags: $('#pl_tags') ? $('#pl_tags').value : '',
    confirmed: $('#pl_confirm')?.checked || false,
    travelers: collectTravelers()};
  if (EDIT_GID) {                          // 수정 — 상태·개인 처리상태는 서버가 고정
    const r = await api(`/groups/${EDIT_GID}`, {method: 'PUT', body: JSON.stringify(body)});
    if (!r.ok) {
      if (r.status === 401) { askAdmin(() => submitPlan()); return; }
      showErr('#planErr', r.data.errors); return;
    }
    toast('수정 저장 완료 — 변경 내용은 감사 로그에 기록됩니다');
    EDIT_GID = null; await load(); nav('list'); return;
  }
  // 확정 시 예산이 모자라면 막지 않고 확인만 받는다 (차단 아님)
  if (body.confirmed) {
    const need = collectTravelers().reduce((sm, t) =>
      sm + KEYS.reduce((x, k) => x + (t['p_' + k] || 0), 0), 0);
    const after = (ST.dash.avail || 0) - need;
    if (after < 0 && !confirm(
        `확정 후 가용 잔여가 ${after < 0 ? '−' : ''}${won(Math.abs(after))}원입니다.\n` +
        '예산 부족을 인지한 상태로 계속 확정하시겠습니까?\n\n' +
        '[확인] 계속 확정   /   [취소] 돌아가기')) return;
  }
  const {ok, data} = await api('/groups', {method: 'POST', body: JSON.stringify(body)});
  if (!ok) { showErr('#planErr', data.errors); return; }
  toast(`등록 완료 — ${dispSt(data.group.status)} · ${body.travelers.length}명`);
  PLAN_JUST = data.group;
  YQ = data.group.yq;
  await load(); nav('plan');
  $('#v-plan').scrollIntoView({block: 'start'});
}

  $$('#actSel optgroup').forEach(gp => {
    gp.hidden = [...gp.children].every(o => o.hidden);
  });

function actSum(){
  const g = ST.groups.find(x => x.group_id === ACT_GID);
  if (!g) return;
  const ft = {trans:0, lodg:0, meal:0, etc:0};
  let tot = 0, planTot = 0;
  $$('#actRows tr').forEach(tr => {
    const emp = tr.dataset.emp;
    const p = g.travelers.find(x => String(x.emp_no) === emp) || {};
    let s = 0, pl = 0;
    KEYS.forEach(k => { const v = mnum(tr.querySelector('.a-' + k));
      s += v; ft[k] += v; pl += p['p_' + k] || 0; });
    tot += s; planTot += pl;
    tr.querySelector('.a-sum').textContent = won(s);
    const v = pl && s ? pl - s : 0;
    const el = tr.querySelector('.a-var');
    el.textContent = v ? (v > 0 ? '+' : '−') + won(Math.abs(v)) : '–';
    el.style.color = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--faint)';
  });
  KEYS.forEach(k => $('#af-' + k).textContent = won(ft[k]));
  $('#afTot').textContent = won(tot);
  const gv = planTot && tot ? planTot - tot : 0;
  const fe = $('#afVar');
  fe.textContent = gv ? (gv > 0 ? '+' : '−') + won(Math.abs(gv)) : '–';
  fe.style.color = gv >= 0 ? 'var(--green)' : 'var(--red)';
}

  });
  const {ok, data} = await api(`/groups/${ACT_GID}/actual`,
    {method: 'POST', body: JSON.stringify({travelers, remark: $('#ac_remark').value.trim()})});
  if (!ok) { showErr('#actErr', data.errors); return; }
  const gid = ACT_GID;

규칙
· 한 번의 출장에 여러 명이 가면 travelers 에 사람을 추가합니다(출장 1건 = 객체 1개).
· 서로 다른 출장은 배열에 객체를 늘립니다.
· 금액은 숫자만 씁니다(콤마·"원" 없이). 모르면 0 을 넣습니다.
· 실적 금액은 넣지 않습니다 — 다녀온 뒤 화면에서 입력합니다.
· CCG팀명은 아래 목록의 이름을 정확히 씁니다: {{CCG}}
· 날짜는 반드시 YYYY-MM-DD 입니다.`;


const bnorm = t => String(t || '').replace(/\s+/g, '').replace(/[·・]/g, '·').trim();
function bTeam(v){                          // 'EDTW소재기술' 'EDTW소재개발' 'CCG번호' 모두 인식
  const q = bnorm(v).toLowerCase();
  if (!q) return '';
  const exact = ST.ccg.find(x => bnorm(x.team).toLowerCase() === q)
             || ST.ccg.find(x => x.ccg.toLowerCase() === q);
  if (exact) return exact.team;
  /* 앞글자 매칭은 '한 팀만' 걸릴 때만 쓴다.
     'Patterning소재기술/개발', 'C&C소재기술/개발' 처럼 앞이 같은 팀이 있어서,
     먼저 찾은 것을 그냥 쓰면 개발 건이 기술 팀으로 조용히 들어간다. */
  const pre = ST.ccg.filter(x => bnorm(x.team).toLowerCase().startsWith(q));
  return pre.length === 1 ? pre[0].team : '';
}
function bDate(v){                           // 2026.8.4 / 26-08-04 / 45000(엑셀 일련번호) 허용
  const t = String(v || '').trim();
  if (!t) return '';
  if (/^\d{5}$/.test(t)) {                   // 엑셀 날짜 일련번호
    const d = new Date(Date.UTC(1899, 11, 30) + Number(t) * 864e5);
    return d.toISOString().slice(0, 10);
  }
  const m = t.match(/(\d{2,4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
  if (!m) return '';
  let y = +m[1]; if (y < 100) y += 2000;
  return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
}
function bKind(v){
  const q = bnorm(v).toLowerCase();
  // 비어 있으면 '기타'. 특정 분류(정기 Audit)로 채우면 센터 제출본에 그럴듯한 거짓이 들어간다.
  if (!q) return '기타';
  return ST.meta.kinds.find(k => bnorm(k).toLowerCase() === q)
      || ST.meta.kinds.find(k => bnorm(k).toLowerCase().includes(q) || q.includes(bnorm(k).toLowerCase().slice(0,4)))
      || '기타';
}
/* JSON 으로 붙여넣는 경우 — 사내 LLM 에게 형식을 주고 받아 그대로 붙이는 길.
   엑셀 붙여넣기와 같은 화면·같은 미리보기·같은 등록 버튼을 쓴다(경로를 둘로 만들지 않는다). */
function bParseJson(text){
  let raw;
  try { raw = JSON.parse(text); }
  catch (e) { return {groups: [], errs: ['JSON 형식이 아닙니다 — ' + e.message]}; }
  if (raw && !Array.isArray(raw) && Array.isArray(raw.groups)) raw = raw.groups;   // {"groups":[...]} 도 허용
  if (!Array.isArray(raw)) raw = [raw];                                            // 한 건만 준 경우
  const errs = [], groups = [];
  raw.forEach((g, i) => {
    const n = i + 1;
    if (!g || typeof g !== 'object') { errs.push(`${n}번째 항목이 객체가 아닙니다.`); return; }
    const trav = Array.isArray(g.travelers) ? g.travelers : [];
    if (!trav.length) { errs.push(`${n}번째 — travelers 가 비어 있습니다.`); return; }
    const dep = bDate(g.dep_dt) || String(g.dep_dt || '').trim();
    const ret = bDate(g.ret_dt) || String(g.ret_dt || '').trim() || dep;
    if (!dep) { errs.push(`${n}번째 — dep_dt(출발일자)가 없습니다.`); return; }
    const T = trav.map((p, j) => {
      const team = bTeam(p.ccg_nm || p.ccg || '');
      if (!team) errs.push(`${n}번째 ${j + 1}번 출장자 — CCG팀을 알 수 없습니다: ${p.ccg_nm || p.ccg || '(비어 있음)'}`);
      const num = v => Math.max(0, Math.round(Number(String(v ?? 0).replace(/[^0-9.-]/g, '')) || 0));
      const row = {name: String(p.name || '').trim(), emp_no: String(p.emp_no || '').trim(),
                   rank: p.rank === '팀장' ? '팀장' : 'TL', ccg_nm: team};
      KEYS.forEach(k => { row['p_' + k] = num(p['p_' + k]); row['a_' + k] = num(p['a_' + k]); });
      if (!row.name || !row.emp_no) errs.push(`${n}번째 ${j + 1}번 출장자 — 성명·사번은 필수입니다.`);
      return row;
    });
    groups.push({plan_type: ['계획', '변경', '긴급'].includes(g.plan_type) ? g.plan_type : '계획',
                 city: String(g.city || '').trim(), org: String(g.org || '').trim(),
                 purpose: String(g.purpose || '').trim(), kind: bKind(g.kind),
                 dep_dt: dep, ret_dt: ret,
                 car: g.car === '자차사용' ? '자차사용' : '미사용',
                 remark: String(g.remark || '').trim(),
                 tags: g.tags ?? '',   // 정리는 서버 clean_tags 가 한다 (계획 폼과 같은 경로)
                 travelers: T, _rows: [`JSON ${n}`]});
  });
  groups.forEach((g, i) => {
    if (!g.city || !g.org || !g.purpose)
      errs.push(`${i + 1}번째 — city·org·purpose 는 필수입니다.`);
  });
  return {groups, errs};
}

/* ── 문답으로 끝내기 ────────────────────────────────────────────
   한 화면에 질문 하나. 고르면 바로 다음으로 넘어가고, 적어야 하는 것만 [다음]을 누른다.
   본인이 누구인지는 처음 한 번만 묻고 이 브라우저에 기억한다 — 그 뒤로는 안 묻는다.
   그래서 계획은 '어디로·언제·무슨 일로·누구랑·얼마' 다섯, 실적은 '어느 출장·얼마' 둘이다.

   고를 수 있는 값은 전부 눌러서 고른다(구분·CCG·직책·자차·태그). 날짜는 달력을 쓴다.
   자유롭게 적는 칸은 목적·비고뿐이고 그건 해석하지 않는다.

   저장은 하지 않는다: 마지막 확인 화면에서 사람이 누르면 기존 라우트로 나간다.
   (문답이 새 쓰기 경로가 되면 검증·권한 게이트가 무의미해진다) */
const ME_KEY = 'tb_me';
function meGet(){
  try { const v = JSON.parse(localStorage.getItem(ME_KEY) || 'null');
    return v && v.emp_no && v.name ? v : null; } catch (e) { return null; }

/* 원장에 이미 있는 사람 — 대부분 여기서 자기 이름을 찾는다 */
function mePeople(){
  const seen = [], out = [];
  for (const g of ST.groups) for (const p of (g.travelers || [])) {
    if (p.emp_no && !seen.includes(String(p.emp_no))) {
      seen.push(String(p.emp_no));
      out.push({name: p.name, emp_no: String(p.emp_no), rank: p.rank || 'TL', ccg_nm: p.ccg_nm});
    }
  }
  return out;
}

function askBox(){
  const me = meGet();
  if (!me) return askMeBox();
  if (!ASK) {
    return `<div class="card askcard">
      <div class="askq3">${esc(me.name)}님, 무엇을 하시겠어요?</div>
      <div class="askgrid">
        ${askOpt('출장 계획 넣기', "askStart('plan')", '가기 전에 계획과 예상 비용을 올립니다')}
        ${askOpt('다녀와서 실적 넣기', "askStart('act')", '실제 쓴 금액을 넣으면 인폼이 만들어집니다')}
      </div>
      <div class="askfoot"><button class="btn sm" onclick="meClear()">${esc(me.name)}님이 아닌가요?</button></div>
    </div>`;
  }
  const flow = ASK_FLOW[ASK.mode];
  const done = ASK.i >= flow.length;
  // 지나온 답은 위에 한 줄씩 — 물어본 말과 고른 값을 둘 다 늘어놓지 않는다
  const trail = flow.slice(0, ASK.i).map(k => {
    const st = ASK_STEP[k], has = ASK.v[k] !== undefined && ASK.v[k] !== null;
    return `<button type="button" class="askdone" onclick="askBack('${k}')">
      <span class="askv">${has ? st.show(ASK.v[k]) : '건너뜀'}</span><span class="askedit">고치기</span></button>`;
  }).join('');
  const body = done ? askConfirm() : (() => {
    const st = ASK_STEP[flow[ASK.i]];
    const needBtn = !['trip'].includes(flow[ASK.i]);
    return `<div class="askq3">${esc(st.q())}</div>${st.view()}
      ${needBtn ? `<div class="btns" style="margin-top:24px">
        <button class="btn pri" onclick="askNext()">다음</button>
        <button class="btn" onclick="askStop()">그만두기</button></div>`
      : `<div class="askfoot"><button class="btn sm" onclick="askStop()">그만두기</button></div>`}`;
  })();
  return `<div class="card askcard">
    ${trail}${body}</div>`;
}

function askExtra(){ ASK.extra = true; askDraw(); }
/* 칩만 갈아 끼운다 — 다시 그리면 같은 화면에 이미 친 글이 지워진다 */
function askSet(name, v){
  askSel[name] = v;
  const box = $('#pick-' + name);
  if (!box) { askDraw(); return; }
  [...box.children].forEach(b => b.classList.toggle('on', b.textContent.trim() === v));
}
function askDraw(){
  const box = $('.askbox');
  if (!box) return;
  box.innerHTML = askBox();
  if (ASK && ASK.i < ASK_FLOW[ASK.mode].length) askRestore(ASK_FLOW[ASK.mode][ASK.i]);
  if (ASK && ASK.i >= ASK_FLOW[ASK.mode].length && ASK.extra) askRestore('extra');
  const el = box.querySelector('.askq3 ~ .form-grid input,.askq3 ~ div input');
  if (el && el.type !== 'checkbox') el.focus();
}
/* 고치기로 돌아오면 넣어 뒀던 값이 그대로 있어야 한다 */
function askRestore(k){
  const v = ASK.v[k];
  if (k === 'extra') { askFill('a_tags', (ASK.extraV || {}).tags || ''); askFill('a_remark', (ASK.extraV || {}).remark || ''); return; }
  if (v === undefined || v === null) return;
  if (k === 'where') { askFill('a_city', v.city); askFill('a_org', v.org); }
  if (k === 'why')   { askFill('a_purpose', v.purpose); askSel.kind = v.kind; }
  if (k === 'when')  { askFill('a_dep', v.dep); askFill('a_ret', v.ret); askSel.car = v.car; }
  if (k === 'cost')  { KEYS.forEach(x => askFill2('.a-c-' + x, v[x])); askCostSum(); }
  if (k === 'spent') { KEYS.forEach(x => askFill2('.a-s-' + x, v[x])); askSpentSum(); }
}
function askFill(id, v){ const el = $('#' + id); if (el) el.value = v || ''; }
function askFill2(sel, v){ const el = $(sel); if (el) el.value = v ? won(v) : ''; }
function askBack(k){ if (ASK) { ASK.i = ASK_FLOW[ASK.mode].indexOf(k); askDraw(); } }
function askNext(){
  if (!ASK) return;
  const k = ASK_FLOW[ASK.mode][ASK.i];
  const st = ASK_STEP[k];
  const v = st.read();
  if (!st.okay(v)) { toast(st.warn || '값을 넣어 주세요'); return; }
  ASK.v[k] = v;
  ASK.i++;
  askDraw();
}
function askExtraRead(){
  ASK.extraV = {tags: ($('#a_tags') || {}).value || '', remark: ($('#a_remark') || {}).value || ''};
  return ASK.extraV;
}

/* 저장은 기존 라우트로 나간다 — 검증·권한·감사 로그가 전부 그대로 살아 있다 */
function askSubmit(){ return once('#askBtn', ASK && ASK.mode === 'plan' ? askSendPlan : askSendAct); }
function askPlanBody(){
  const v = ASK.v;
  const w = v.where || {city: '', org: ''};
  const y = v.why || {purpose: '', kind: '기타'};
  const t = v.when || {dep: '', ret: '', car: '미사용'};
  const c = v.cost || {trans: 0, lodg: 0, meal: 0, etc: 0};
  const x = ASK.extra ? askExtraRead() : (ASK.extraV || {tags: '', remark: ''});
  return {plan_type: askSel.ptype || '계획', city: w.city, org: w.org, kind: y.kind,
    dep_dt: t.dep, ret_dt: t.ret || t.dep, car: t.car,
    purpose: y.purpose, remark: (x.remark || '').trim(),
    tags: (x.tags || '').split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean),
    confirmed: $('#askConfirm')?.checked || false,
    travelers: (v.who || []).map(p => ({name: p.name, emp_no: p.emp_no, rank: p.rank, ccg_nm: p.ccg_nm,
      p_trans: c.trans, p_lodg: c.lodg, p_meal: c.meal, p_etc: c.etc}))};
}
async function askSendPlan(){
  const body = askPlanBody();
  // 확정 시 예산이 모자라면 막지 않고 확인만 받는다 (계획 화면과 같은 규칙)
  if (body.confirmed) {
    const need = body.travelers.reduce((sm, t) => sm + KEYS.reduce((x, k) => x + (t['p_' + k] || 0), 0), 0);
    const after = (ST.dash.avail || 0) - need;
    if (after < 0 && !confirm(
        `확정 후 가용 잔여가 −${won(Math.abs(after))}원입니다.\n` +
        '예산 부족을 인지한 상태로 계속 확정하시겠습니까?\n\n' +
        '[확인] 계속 확정   /   [취소] 돌아가기')) return;
  }
  const {ok, data} = await api('/groups', {method: 'POST', body: JSON.stringify(body)});
  if (!ok) { showErr('#askErr', data.errors); return; }
  toast(`등록 완료 — ${dispSt(data.group.status)} · ${body.travelers.length}명`);
  PLAN_JUST = data.group;
  YQ = data.group.yq;
  ASK = null; askSel = {};
  await load();
}
async function askSendAct(){
  const me = meGet() || {};
  const gid = ASK.v.trip;
  const g = ST.groups.find(x => x.group_id === gid);
  if (!g) { showErr('#askErr', ['연결된 출장이 없습니다.']); return; }
  const c = ASK.v.spent || {trans: 0, lodg: 0, meal: 0, etc: 0};
  const x = ASK.extra ? askExtraRead() : (ASK.extraV || {remark: ''});
  // 내 줄만 보낸다 — 서버가 사번으로 맞춰 넣으므로 같이 가신 분 실적은 건드리지 않는다
  const body = {travelers: [{emp_no: me.emp_no,
    a_trans: c.trans, a_lodg: c.lodg, a_meal: c.meal, a_etc: c.etc}]};
  if ((x.remark || '').trim()) body.remark = x.remark.trim();
  const {ok, data} = await api(`/groups/${gid}/actual`, {method: 'POST', body: JSON.stringify(body)});
  if (!ok) {
    if (data.status === 401 || (data.errors || []).some(t => /관리자/.test(t))) {
      askAdmin(() => askSubmit()); return;
    }
    showErr('#askErr', data.errors); return;
  }
  // 같이 가신 분 실적이 아직 0이면 인폼 금액이 그만큼 비어 나간다 — 저장은 됐으니 알리기만
  const rest = (data.group.travelers || []).filter(p =>
    String(p.emp_no) !== String(me.emp_no) && KEYS.every(k => !p['a_' + k])).length;
  toast(rest ? `저장했습니다 — 같이 가신 ${rest}명 실적은 아직 비어 있습니다`
             : '저장했습니다 — 인폼 메일이 만들어졌습니다');
  ASK = null; askSel = {};
  await load();
}
function bParse(text){
  const raw = String(text || '').trim();
  if (raw.startsWith('[') || raw.startsWith('{')) return bParseJson(raw);
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (!lines.length) return {groups: [], errs: ['붙여넣은 내용이 없습니다.']};
  const cut = l => l.split('\t').length > 1 ? l.split('\t') : l.split(',');
  let head = cut(lines[0]).map(bnorm);
  let map, body;
  if (head.some(h => BULK_COLS[h])) {        // 머리글이 있는 경우 — 이름으로 매칭
    map = head.map(h => BULK_COLS[h] || '_skip');
    body = lines.slice(1);
  } else {                                   // 머리글 없이 값만 붙인 경우 — 센터 27필드 순서로 가정
    // 열 수가 27에 한참 못 미치면 '일부 열만' 복사한 것이다. 그대로 순서로 읽으면
    // 날짜를 CCG명으로 해석하는 식으로 조용히 어긋난다 — 여기서 멈추고 머리글을 요청한다.
    const ncol = Math.max(...lines.map(l => cut(l).length));
    if (ncol < CENTER_ORDER.length - 4) {
      return {groups: [], errs: [
        `머리글 없이 ${ncol}개 열만 붙여넣었습니다 (센터 양식은 ${CENTER_ORDER.length}개 열).`,
        '일부 열만 복사할 때는 반드시 머리글 행을 함께 붙여넣으세요 — 순서만으로는 어느 칸인지 알 수 없습니다.',
        '필요한 열: ' + BULK_MIN.join(' · '),
      ]};
    }
    map = CENTER_ORDER.map(h => BULK_COLS[h] || '_skip');
    body = lines;
  }
  const errs = [], byKey = new Map();
  body.forEach((line, i) => {
    const c = cut(line), o = {};
    map.forEach((k, j) => { if (k && k !== '_skip') o[k] = (c[j] ?? '').trim(); });
    const ln = i + (body === lines ? 1 : 2);
    const dep = bDate(o.dep_dt), ret = bDate(o.ret_dt) || bDate(o.dep_dt);
    const team = bTeam(o.ccg_nm) || bTeam(o._ccgcode);
    const miss = [];
    if (!o.city) miss.push('출장도시');
    if (!o.org) miss.push('기관&업체');
    if (!o.purpose) miss.push('목적&사유');
    if (!dep) miss.push('출발일자');
    if (!o.name) miss.push('성명');
    if (!o.emp_no) miss.push('사번');
    if (!team) miss.push('CCG명' + (o.ccg_nm ? `('${o.ccg_nm}' 인식 불가)` : ''));
    if (miss.length) { errs.push(`${ln}행: ${miss.join(', ')} 없음/오류`); return; }
    const key = [o.city, o.org, dep, ret, o.purpose].join('|');
    if (!byKey.has(key)) byKey.set(key, {
      plan_type: ['계획','변경','긴급'].includes(bnorm(o.plan_type)) ? bnorm(o.plan_type) : '계획',
      city: o.city, org: o.org, purpose: o.purpose, dep_dt: dep, ret_dt: ret,
      car: bnorm(o.car).includes('자차') ? '자차사용' : '미사용',
      kind: bKind(o.kind), remark: o.remark || '', travelers: [], _rows: [],
    });
    const g = byKey.get(key);
    if (g.travelers.some(t => t.emp_no === o.emp_no)) { errs.push(`${ln}행: 같은 출장에 사번 ${o.emp_no} 중복`); return; }
    const t = {name: o.name, emp_no: o.emp_no,
      rank: bnorm(o.rank) === '팀장' ? '팀장' : 'TL', ccg_nm: team};
    KEYS.forEach(k => { t['p_' + k] = numFrom(o['p_' + k]); t['a_' + k] = numFrom(o['a_' + k]); });
    g.travelers.push(t); g._rows.push(ln);
  });
  return {groups: [...byKey.values()], errs};
}

    : '<div class="note" style="margin:8px 0 0">등록할 수 있는 행이 없습니다.</div>'}`;

async function bSubmit(){
  if (!BULK_ROWS || !BULK_ROWS.length) return;
  const confirmed = $('#bkConfirm')?.checked || false;
  const btn = $('#bkGo'); if (btn) { btn.disabled = true; btn.textContent = '등록 중…'; }
  let okN = 0; const fail = [];
  for (const g of BULK_ROWS) {
    const body = {...g, confirmed}; delete body._rows;
    const r = await api('/groups', {method: 'POST', body: JSON.stringify(body)});
    if (r.ok) okN++; else fail.push(`${g.city} ${g.org}: ${(r.data.errors || ['실패'])[0]}`);
  }
  await load();
  BULK_ROWS = null;
  rBulk(); nav('bulk');                     // 화면을 먼저 새로 그린 뒤 결과를 넣는다
  $('#bkText').value = fail.length ? $('#bkText').value : '';   // 실패가 있으면 원본을 남겨 고칠 수 있게
  $('#bkOut').innerHTML = `<div class="${fail.length ? 'err' : 'note'}" style="margin:8px 0 0">
    <b>${okN}건 등록 완료</b>${fail.length
      ? `\n실패 ${fail.length}건 — 아래 내용을 고쳐 다시 등록하세요:\n${fail.map(esc).join('\n')}`
      : ''}</div>`;
  toast(`${okN}건 등록 완료${fail.length ? ` · 실패 ${fail.length}건` : ''}`);
}

/* 태그 편집 — 분류·검색용이라 이관·완료된 건도 고칠 수 있다(금액·상태는 건드리지 않는다) */
async function editTags(gid){
  const g = ST.groups.find(x => x.group_id === gid); if (!g) return;
  const used = (ST.tags || []).map(x => x.tag).join(' · ');
  const cur = (g.tags || []).join(', ');
  const v = prompt(`태그 (쉼표로 여러 개, 비우면 전부 삭제)\n\n${gname(g)}\n`
    + (used ? `\n지금까지 쓰인 태그: ${used}` : ''), cur);
  if (v === null) return;
  const {ok, data} = await api(`/groups/${gid}/tags`, {method: 'POST', body: JSON.stringify({tags: v})});
  if (!ok) { toast((data.errors || ['저장 실패'])[0]); return; }
  await load(); renderListBody();
  toast(data.tags.length ? `태그 ${data.tags.length}개 저장` : '태그를 모두 지웠습니다');
}

/* ═══ 결재 작성 도우미 (국내 출장 정산서) ═══
   결재는 사내 전자결재 사이트에서 사람이 올린다. 이 화면은 그 창의 칸 순서 그대로
   '넣을 값'을 꺼내 주고, 한 줄씩·통째로 복사하게만 한다. 값을 대신 써 넣지 않는다.
   정산서는 인원을 추가할 수 있어 한 출장을 한 장으로 올린다 — 공통 값 + 인원별 값. */
const APV_TRANS = ['타인 차량 동승', '공용차량', '개인차량(고속도로이용)', '개인차량(국도이용)',
                   '대중교통', '셔틀버스', '의전차량', '항공기', '고속철도', '렌트차량'];
const APV_FROM = ['근무지 사업장 — 분당캠퍼스', '근무지 사업장 — 센터원오피스',
                  '근무지 사업장 — 이천캠퍼스', '근무지 사업장 — 청주캠퍼스', '거주지(주소 입력)'];

/* 출장 한 건에 한 번만 넣는 값 = [라벨, 값, 도움말]. 값이 비면 '시스템에 없는 값'으로 표시 */
function apvCommon(g){
  const car = g.car === '자차사용' ? '개인차량(고속도로이용)' : '대중교통';
  return [
    ['출장 목적', g.purpose || '', ''],
    ['세부일정', `${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} ${g.city} ${g.org} · ${g.purpose}`,
     '일자 · 방문처 · 목적을 한 줄로'],
    ['방문회사', g.org || '', ''],
    ['방문자', names(g).replace(/<[^>]*>/g, ''), '우리 쪽 출장자입니다. 상대측 담당자는 결재 창에서 직접'],
    ['목적지 주소 및 전화번호', '', '시스템에 없는 값 — 결재 창에서 직접'],
    ['출장일시', `${g.dep_dt} ~ ${g.ret_dt || g.dep_dt}`, '시작 ~ 종료'],
    ['교통편', car, '자차 여부로 미리 골라 둔 것 — 실제와 다르면 결재 창에서 바꾸세요'],
    ['출발지', '', '근무지 사업장 또는 거주지 — 결재 창에서 고르세요'],
    ['출장지', [g.city, g.org].filter(Boolean).join(' '), '주소는 결재 창에서 [추가]'],
    ['비고', g.remark || '', ''],
  ];
}
/* 인원 — 정산서에서 [추가]로 늘리는 부분. 사람마다 사번·소속·금액이 붙는다 */
function apvPeopleHead(isAct){
  return ['성명', '사번', '소속 CCG',
          `${isAct ? '실적' : '계획'} 교통비`, '숙박비', '식대&잡비', '기타', '합계'];
}
function apvPeopleRows(g){
  const isAct = (g.act_tot || 0) > 0, pre = isAct ? 'a_' : 'p_';
  return (g.travelers || []).map(p => {
    const v = k => Number(p[pre + k]) || 0;
    const sum = ['trans', 'lodg', 'meal', 'etc'].reduce((a, k) => a + v(k), 0);
    return [p.name || '', p.emp_no || '', `${p.ccg_nm || ''}${p.ccg ? ` (${p.ccg})` : ''}`,
            won(v('trans')), won(v('lodg')), won(v('meal')), won(v('etc')), won(sum)];
  });
}
/* 통째로 복사 — 탭으로 나눠 결재 창·엑셀 어디에 붙여도 칸이 맞는다 */
function apvText(g){
  const isAct = (g.act_tot || 0) > 0;
  const L = apvCommon(g).filter(([, v]) => v).map(([k, v]) => `${k}\t${v}`);
  L.push('', `인원 ${(g.travelers || []).length}명`);
  L.push(apvPeopleHead(isAct).join('\t'));
  apvPeopleRows(g).forEach(r => L.push(r.join('\t')));
  L.push(`${isAct ? '실적' : '계획'} 총합계\t${won(isAct ? g.act_tot : g.plan_tot)}원`);
  return L.join('\n');
}

      <div class="scroll"><table class="apv-tbl">

/* ═══ 인폼 카드 ═══ */
async function reopenMail(gid){
  const {ok, data} = await api(`/groups/${gid}/mail`);
  if (!ok) { toast((data.errors || ['인폼을 만들 수 없습니다'])[0]); return; }
  showMail(data.mail);
}
/* 인폼은 지금 보고 있는 화면의 맨 아래에 붙는다.
   떠 있는 카드는 아래쪽 버튼을 가려서 접기·여백 보정이 필요했다 — 흐름 안에 두면 그럴 일이 없다. */
function mailHost(){
  return [...document.querySelectorAll('.view')].find(v => v.offsetParent !== null) || document.body;
}
function showMail(mail){
  document.getElementById('mailCard')?.remove();
  const el = document.createElement('section');
  el.className = 'mailcard'; el.id = 'mailCard';
  el.innerHTML = `
    <div class="mh"><span>${esc(mail.heading || '실비 이관 요청 인폼 (그룹당 1통)')}</span>
      <span class="mhb">
        <button title="닫기" onclick="this.closest('.mailcard').remove()">×</button></span></div>
    <div class="meta">
      <div class="row"><span class="k">수신</span>${mail.to
        ? `<span style="word-break:break-all">${esc(mail.to)}</span>`
        : `<span style="color:var(--red);font-weight:700">${esc(mail.to_hint || '수신자: 직접 지정')}</span>`}</div>
      <div class="row"><span class="k">제목</span><span>${esc(mail.subject)}</span></div>
    </div>
    <div class="how">아래 표를 <b>끌어다 놓기(드래그 &amp; 드롭)</b> 하거나 <b>표 포함 복사</b> 후
      메일에 붙여넣어 보내주세요. <span class="sub">서식·표가 그대로 유지됩니다.</span></div>
    <div class="dragzone">
      <div class="draghint"><span class="grip" aria-hidden="true">⠿</span>
        <span>여기를 <b>마우스로 끌어</b> 메일 본문에 놓으세요</span></div>
      <div class="body" id="mailBody" draggable="true"
           title="끌어서 메일 본문에 놓으세요">${mail.body_html}</div>
    </div>
    <div class="mf">
      <button class="btn sm pri" id="mailCopyHtml">표 포함 복사</button>
      <button class="btn sm" id="mailCopyText">본문 텍스트 복사</button>
      <span class="mfhint">수신 · 제목은 위에 있습니다</span>
    </div>`;
  mailHost().appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  // 드래그로 메일에 바로 떨어뜨릴 수 있게 HTML 서식을 함께 실어 보낸다
  const zone = el.querySelector('.dragzone');
  $('#mailBody').addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/html', mail.body_html);
    e.dataTransfer.setData('text/plain', mail.body_text);
    e.dataTransfer.effectAllowed = 'copy';
    zone.classList.add('dragging');          // 끌고 가는 중이라는 표시
  });
  $('#mailBody').addEventListener('dragend', () => zone.classList.remove('dragging'));
  $('#mailCopyHtml').onclick = async () => {
    if (!navigator.clipboard) { copyText(mail.body_text); return; }
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([mail.body_html], {type: 'text/html'}),
        'text/plain': new Blob([mail.body_text], {type: 'text/plain'})})]);
      toast('표 포함 복사됨 — 메일에 붙여넣으세요');
    } catch (e) { copyText(mail.body_text, '텍스트로 복사되었습니다'); }
  };
  $('#mailCopyText').onclick = () => copyText(mail.body_text, '본문을 복사했습니다');
}

  {k:'trav',  th:'출장자',   f:'txt', ph:'성명·사번·팀'},
  {k:'date',  th:'기간',     f:'txt', ph:'예: 07/25', num:true},
  {k:'plan',  th:'계획',     f:'min', ph:'≥금액', num:true},
  {k:'act',   th:'실적',     f:'min', ph:'≥금액', num:true},
];
const LQ = {q:'', sort:'stage', dir:'desc', group:true, col:{}, tag:''};
const BQ = {q:'', type:'', dir:'desc'};
function setBQ(k, v){ BQ[k] = v; rBudget(); nav('budget'); }
function toggleBDir(){ BQ.dir = BQ.dir === 'asc' ? 'desc' : 'asc'; rBudget(); nav('budget'); }
const dirIcon = d => d === 'asc' ? '▲ 오름차순' : '▼ 내림차순';

function lVal(g, k){
  if (k === 'stage') return g.stage;
  if (k === 'name')  return gname(g) + ' ' + (g.purpose || '');
  if (k === 'trav')  return (g.travelers || []).map(p => `${p.name} ${p.emp_no} ${p.ccg_nm || ''}`).join(' ');
  if (k === 'date')  return g.dep_dt || '';
  if (k === 'plan')  return g.plan_tot || 0;
  if (k === 'act')   return g.act_tot || 0;
  return '';
}
function listRows(){
  const all = ST.groups.filter(g => g.yq === YQ);
  const q = LQ.q.trim().toLowerCase();
  // 전체 검색은 '데이터'만 대상 — 관리 버튼 문구가 걸리지 않도록
  const hay = g => [g.city, g.org, g.purpose, g.roll, g.plan_type, ...(g.tags || []),
    ...(g.travelers || []).flatMap(p => [p.name, p.emp_no, p.ccg_nm])]
    .filter(Boolean).join(' ').toLowerCase();
  const G = all.filter(g => {
    if (LQ.tag && !(g.tags || []).includes(LQ.tag)) return false;
    if (q && !hay(g).includes(q)) return false;
    for (const c of LCOLS) {                       // 컬럼별 검색창
      const v = String(LQ.col[c.k] || '').trim();
      if (!v) continue;
      if (c.k === 'stage') { if (g.roll !== v) return false; continue; }
      if (c.f === 'min') {
        if ((Number(lVal(g, c.k)) || 0) < (Number(v.replace(/[^0-9-]/g, '')) || 0)) return false;
        continue;
      }
      if (c.k === 'date') {
        const period = `${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} ${g.dep_dt} ${g.ret_dt}`;
        if (!period.includes(v)) return false;
        continue;
      }
      if (!String(lVal(g, c.k)).toLowerCase().includes(v.toLowerCase())) return false;
    }
    return true;
  });
  const sgn = LQ.dir === 'asc' ? 1 : -1;
  const cmpCol = (a, b, k) => { const x = lVal(a, k), y = lVal(b, k);
    return (typeof x === 'number' && typeof y === 'number') ? x - y
      : (String(x) < String(y) ? -1 : String(x) > String(y) ? 1 : 0); };
  const sorted = G.slice().sort((a, b) => {
    if (LQ.group) { const d = a.stage - b.stage; if (d) return d; }   // 그룹은 항상 워크플로 순
    const k = effSort();
    return sgn * cmpCol(a, b, k) || cmpCol(a, b, 'date');
  });
  return {all, G: sorted};
}
/* 묶기 중에는 그룹 순서가 고정이라 '상태' 정렬의 실제 대상은 기간이다.

function effSort(){ return (LQ.group && LQ.sort === 'stage') ? 'date' : LQ.sort; }
function sortList(k){
  if (LQ.sort === k) LQ.dir = LQ.dir === 'asc' ? 'desc' : 'asc';
  else { LQ.sort = k; LQ.dir = (k === 'plan' || k === 'act') ? 'desc' : 'asc'; }
  renderListBody();
}

function clearList(){ LQ.q = ''; LQ.col = {}; LQ.tag = ''; rList(); nav('list'); }

/* 출장자별 비목 내역 — 사내 출장 정산서를 쓰려면 이게 보여야 한다.
   지금까지는 이 정보가 '출장 실적 입력' 화면에만 있어서, 담당자가 확인하려면
   되돌리기 → 수정 으로 들어가야 했다(상태를 건드려야 볼 수 있었다).
   여기서는 읽기만 한다 — 어떤 상태도 바뀌지 않는다. */
const n0 = v => Number.isFinite(+v) ? +v : 0;
function detailRows(g){
  const act = g.act_tot > 0;                       // 실적이 있으면 실적, 없으면 계획
  const px = act ? 'a_' : 'p_';
  const body = g.travelers.map(p => {
    const cells = KEYS.map(k => n0(p[px + k]));
    const sum = cells.reduce((a, v) => a + v, 0);
    const plan = KEYS.reduce((a, k) => a + n0(p['p_' + k]), 0);
    const gap = act ? sum - plan : 0;
    const eff = pEff(p, g);
    return `<tr>
      <td><b>${esc(p.name)}</b> <span class="sub">${esc(p.rank || '')}</span></td>
      <td class="mono">${esc(p.emp_no)}</td>
      <td>${esc(p.ccg_nm || '')} <span class="sub">${esc(p.ccg || '')}</span></td>
      ${cells.map(v => `<td class="num">${v ? won(v) : '–'}</td>`).join('')}
      <td class="num"><b>${won(sum)}</b></td>
      ${act ? `<td class="num" style="color:${gap > 0 ? 'var(--red)' : gap < 0 ? 'var(--green)' : 'var(--mut)'}">${
        gap ? (gap > 0 ? '+' : '−') + won(Math.abs(gap)) : '–'}</td>` : ''}
      <td>${eff ? `<span class="status ${pStClass(eff)}">${esc(eff)}</span>` : '<span class="sub">–</span>'}</td>
    </tr>`;
  }).join('');
  const tot = KEYS.map(k => g.travelers.reduce((a, p) => a + n0(p[px + k]), 0));
  return `<table class="dtl">
    <thead><tr><th>성명</th><th>사번</th><th>CCG팀</th>
      ${KEYS.map((k, i) => `<th class="num">${ST.meta.cost[i].label}</th>`).join('')}
      <th class="num">${act ? '실적' : '계획'} 합계</th>${act ? '<th class="num">계획 대비</th>' : ''}
      <th>처리 상태</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="3">합계 ${g.travelers.length}명</td>
      ${tot.map(v => `<td class="num">${won(v)}</td>`).join('')}
      <td class="num">${won(tot.reduce((a, v) => a + v, 0))}</td>${act ? '<td></td>' : ''}<td></td></tr></tfoot>
  </table>`;
}
/* 출장자 개인의 실효 처리 상태 — core.eff_status 와 같은 규칙 */
function pEff(p, g){
  if (['계획 등록', '확정 예정', '취소'].includes(g.status)) return '';
  return p.status || g.status;
}
/* 정산서에 그대로 옮길 수 있게 탭 구분으로 — 엑셀에 붙여넣으면 칸이 맞는다 */
function copyDetail(gid){
  const g = ST.groups.find(x => x.group_id === gid);
  if (!g) return;
  const act = g.act_tot > 0, px = act ? 'a_' : 'p_';
  const head = ['성명', '사번', '직책', 'CCG팀', 'CCG', ...ST.meta.cost.map(c => c.label), '합계'];
  const lines = [`${gname(g)} · ${g.purpose} · ${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} (${act ? '실적' : '계획'})`,
    head.join('\t')];
  g.travelers.forEach(p => {
    const cells = KEYS.map(k => n0(p[px + k]));
    lines.push([p.name, p.emp_no, p.rank || '', p.ccg_nm || '', p.ccg || '',
      ...cells, cells.reduce((a, v) => a + v, 0)].join('\t'));

  copyText(lines.join('\n'), '정산서용 표를 복사했습니다 — 엑셀에 붙여넣으세요');
}

function drawSelBar(G){

    + `</span>

      <button class="btn pri sm" id="selGo" onclick="bulkConfirm()">선택한 ${n0(pick.length)}건 출장 확정</button>

async function bulkConfirm(){
  const {G} = listRows();
  const pick = G.filter(g => SEL.has(g.group_id));
  if (!pick.length) return;
  const sum = pick.reduce((a, g) => a + (g.plan_tot || 0), 0);
  const avail = ST.dash.avail || 0;
  let msg = `${pick.length}건을 출장 확정할까요?\n계획 합계 ${won(sum)}원만큼 예산이 확보됩니다.\n\n`
    + pick.slice(0, 8).map(g =>
        ` · ${fmtD(g.dep_dt)} ${gname(g)} — ${(g.purpose || '').slice(0, 24)}`
        + ` (${g.travelers.length}명 ${won(g.plan_tot)}원)`).join('\n')
    + (pick.length > 8 ? `\n … 외 ${pick.length - 8}건` : '');
  if (sum > avail) msg += `\n\n확정 후 가용 잔여가 −${won(sum - avail)}원이 됩니다. 그래도 진행할까요?`;
  if (!confirm(msg)) return;
  const btn = $('#selGo');
  if (btn) { btn.disabled = true; btn.textContent = '확정 중…'; }
  const {ok, data} = await api('/groups/bulk_status', {method: 'POST',
    body: JSON.stringify({status: '확정 예정', group_ids: pick.map(g => g.group_id)})});
  if (!ok) { toast((data.errors || ['확정하지 못했습니다'])[0]); if (btn) btn.disabled = false; return; }
  const done = (data.done || []).length, fail = data.failed || [];
  SEL.clear();
  await load();
  rList(); nav('list');
  if (fail.length) {
    showErr('#listErr', [`${done}건 확정 · ${fail.length}건 실패`]
      .concat(fail.slice(0, 5).map(f => `${f.name} — ${f.reason}`)));
  } else {
    toast(`${done}건을 확정했습니다 — 예산에 반영됐습니다`);
  }
}

/* 내보내기 대상 — 고른 것이 있으면 그것만, 없으면 지금 화면에 걸러진 것만.

const EXPORT_MAX = 800;                     // 주소줄 길이 한계 (서버도 같은 값으로 막는다)

    + (whole || !ids.length || ids.length > EXPORT_MAX ? '' : `&gids=${encodeURIComponent(ids.join(','))}`);
  void q;   // 정적판: 주소 대신 아래 dataset.gids 로 넘긴다
  // 정적판(아이패드)에는 서버가 없어 주소 대신 이 값을 읽어 파일을 만든다
  const tag = (whole || !ids.length || ids.length > EXPORT_MAX) ? '' : ids.join(',');
