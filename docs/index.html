<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소재 그룹 국내 출장비 관리</title>
<style>
:root{--bg:#F5F6F8;--white:#FFF;--ink:#111827;--ink2:#344054;--mut:#667085;--faint:#98A2B3;
--line:#D9DEE7;--line2:#EDF0F4;--soft:#EEF1F5;--shade:#F0F2F5;
--navy:#17365D;--navy2:#244C79;--blue:#2563A8;--red:#C23A45;--green:#17725C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-.01em;
font-family:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:var(--white);border-right:1px solid var(--line);
padding:20px 14px;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:0 10px 16px;border-bottom:1px solid var(--line);color:var(--navy);font-size:17px;font-weight:800;line-height:1.3}
.nav-label{margin:16px 10px 5px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.04em}
.nav a{display:block;margin:1px 0;padding:9px 11px;color:var(--ink2);border:1px solid transparent;
cursor:pointer;border-radius:2px;font-size:13.5px;user-select:none}
.nav a:hover,.nav a.on{background:var(--soft);border-color:#E3E7ED;color:var(--navy);font-weight:700}
.nav a .lk{font-size:10px;color:var(--faint);margin-left:4px;font-weight:600}
.contact{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);line-height:1.65}
.contact b{display:block;color:var(--navy);font-size:12px}
.contact a{color:var(--navy);text-decoration:none}
main{width:100%;max-width:1560px;padding:22px 28px 48px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{margin:0;color:var(--navy);font-size:22px}
.top .sub{color:var(--mut);font-size:12.5px}
.top select{margin-left:auto;width:130px}
.view{display:none}.view.on{display:block}
.card{background:var(--white);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.03);
padding:17px;margin-bottom:14px;border-radius:2px}
.card h2{margin:0 0 4px;color:var(--navy);font-size:15px}
.card .cap{margin:0 0 13px;color:var(--mut);font-size:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero{background:var(--white);border:1px solid var(--line);padding:19px 21px;margin-bottom:14px;
display:flex;align-items:center;gap:18px;border-radius:2px}
.hero .lamp{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(23,114,92,.14);flex-shrink:0}
.hero.alert{background:#FFFAFB;border-color:#E6B7BD}
.hero.alert .lamp{background:var(--red);box-shadow:0 0 0 4px rgba(194,58,69,.14)}
.hero .label{color:var(--mut);font-size:12px}
.hero .amount{margin:2px 0 0;color:var(--navy);font-size:31px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero.alert .amount{color:var(--red)}
.hero .msg{font-size:14px;font-weight:700;color:var(--green)}
.hero.alert .msg{color:var(--red)}
.hero .fig{font-size:12.5px;color:var(--ink2);margin-top:3px}
.hero .fig b{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--white);border:1px solid var(--line);padding:14px 15px;border-radius:2px}
.kpi span{display:block;color:var(--mut);font-size:12px}
.kpi b{display:block;margin-top:4px;color:var(--navy);font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{color:var(--faint);font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
label{display:block;margin-bottom:5px;color:#475467;font-size:12px;font-weight:700}
label .rq{color:var(--red)}label .au{color:var(--faint);font-weight:500;font-size:10.5px;margin-left:3px}
input,select,textarea{width:100%;border:1px solid #CFD5DF;background:#FFF;padding:8px 9px;color:var(--ink);
font:inherit;font-size:13.5px;border-radius:2px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(37,99,168,.13);border-color:#6F8EAF}
input[readonly],.auto{background:var(--shade);color:var(--mut)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
textarea{min-height:66px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #CFD5DF;background:#FFF;
color:var(--ink2);padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;border-radius:2px}
.btn:hover{background:#F7F8FA}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#FFF}.btn.pri:hover{background:var(--navy2)}
.btn.red{color:var(--red);border-color:#E2B4BA}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;background:#FFF}
th,td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap;font-size:12.5px}
th{background:#F5F6F8;color:#475467;font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#FAFBFC}
tfoot td{background:var(--shade);font-weight:700;color:var(--navy)}
td .sub{color:var(--faint);font-size:11px}
.status{display:inline-block;padding:2px 8px;border:1px solid #D6DCE5;background:#F3F5F8;color:var(--navy);font-size:11.5px;font-weight:600;border-radius:2px}
.status.done{background:#EDF5F1;border-color:#C4DED2;color:var(--green)}
.status.wip{background:#FDF6EC;border-color:#E8D4B0;color:#8A5A10}
.status.cancel{background:var(--shade);color:var(--faint);text-decoration:line-through}
.status.urgent{background:#FBEDEE;border-color:#E6B7BD;color:var(--red)}
.status.hold{background:#FBEDEE;border-color:#E6B7BD;color:var(--red)}
.status.confirm{background:#EAF1FB;border-color:#CBDCF0;color:var(--blue)}
.pgroup{border:1px solid var(--line);border-radius:2px;margin-bottom:10px;overflow:hidden}
.pg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 13px;background:#FAFBFC;border-bottom:1px solid var(--line2)}
.pg-head .nm{font-weight:700;color:var(--navy)}
.pg-sum{font-size:11.5px;color:var(--mut)}
.pg-sum b{color:var(--red)}
.pg-head .gb{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.note{padding:10px 12px;border:1px solid var(--line);background:#F6F7F9;color:#475467;font-size:12.5px;border-radius:2px;margin-bottom:12px}
.err{margin-bottom:12px;padding:10px 12px;border:1px solid #E2B4BA;background:#FFF7F8;color:var(--red);font-size:12.5px;border-radius:2px;white-space:pre-line}
.trav-table input,.trav-table select{min-width:0;padding:6px 8px;font-size:13px}
.trav-table td{padding:5px 5px}
.trav-table .w-nm{min-width:86px}.trav-table .w-no{min-width:88px}.trav-table .w-rk{min-width:74px}
.trav-table .w-tm{min-width:132px}.trav-table .w-cc{min-width:72px}.trav-table .w-mn{min-width:92px}
.trav-table th:first-child,.trav-table td:first-child{position:sticky;left:0;z-index:1;background:#FFF}
.trav-table thead th:first-child{background:#F5F6F8}
.mailcard{position:fixed;right:16px;bottom:16px;width:600px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);
background:#FFF;border:1px solid #CDD4DF;box-shadow:0 8px 24px rgba(16,24,40,.16);z-index:90;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.mailcard .mh{background:var(--navy);color:#FFF;padding:10px 14px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mailcard .mh button{background:none;border:0;color:#B9C6DC;font-size:17px;cursor:pointer;line-height:1}
.mailcard .meta{padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-size:11.5px}
.mailcard .meta .row{display:flex;gap:8px;margin-bottom:3px}
.mailcard .meta .k{color:var(--mut);font-weight:700;width:36px;flex-shrink:0}
.mailcard .body{padding:14px;overflow:auto;flex:1}
.mailcard .mf{padding:9px 14px;border-top:1px solid var(--line);background:var(--bg);display:flex;gap:7px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.46);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{width:330px;max-width:96vw;background:#FFF;border:1px solid #CDD4DF;border-radius:3px;overflow:hidden}
.modal-box .mh{background:var(--navy);color:#FFF;padding:12px 17px;font-size:14px;font-weight:700}
.modal-box .mb{padding:17px}
.modal-box .hint{font-size:11.5px;color:var(--mut);background:var(--shade);padding:8px 10px;margin:10px 0 13px;border-radius:2px}
.modal-box .hint b{color:var(--navy)}
.modal-box .merr{color:var(--red);font-size:11.5px;margin-bottom:9px;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#182C46;color:#FFF;
padding:10px 17px;z-index:200;font-size:12.5px;font-weight:600;border-radius:2px}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row input,.filter-row select{width:auto;min-width:170px}
.filter-row input{flex:1;min-width:200px}
tr.grp-head td{background:#EEF2F8;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
padding:7px 9px;color:var(--navy)}
tr.grp-head:hover td{background:#EEF2F8}
@media(max-width:980px){.filter-row input,.filter-row select,.filter-row .btn{width:100%;min-width:0}}
/* 이용 안내(흐름) */
.g-lead{background:linear-gradient(180deg,#FBFCFE,#F2F6FB);border:1px solid var(--line);border-radius:2px;padding:17px 19px;margin-bottom:14px}
.g-lead h2{margin:0 0 6px;color:var(--navy);font-size:16px}
.g-lead p{margin:0;color:var(--ink2);font-size:13px;line-height:1.65}
.g-formula{display:inline-block;margin-top:11px;background:#fff;border:1px solid var(--line);border-radius:2px;padding:8px 13px;font-size:13px;font-weight:800;color:var(--navy)}
.flowbar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:4px}
.flowbar .pill{padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;border:1px solid #D6DCE5;background:#F3F5F8;color:var(--navy)}
.flowbar .pill.wip{background:#FDF6EC;border-color:#E8D4B0;color:#8A5A10}
.flowbar .pill.done{background:#EDF5F1;border-color:#C4DED2;color:var(--green)}
.flowbar .pill.confirm{background:#EAF1FB;border-color:#CBDCF0;color:var(--blue)}
.flowbar .arrow{color:var(--faint);font-weight:800}
.gstep{display:flex;gap:14px;padding:16px 2px;border-top:1px solid var(--line2)}
.gstep:first-of-type{border-top:0}
.gnum{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.gstep.admin .gnum{background:#8A5A10}.gstep.cancel .gnum{background:var(--faint)}
.gbody{flex:1;min-width:0}
.gtitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--navy);font-size:14px}
.grole{padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.grole.owner{background:#EAF1FB;color:var(--blue);border:1px solid #CBDCF0}
.grole.admin{background:#FDF6EC;color:#8A5A10;border:1px solid #E8D4B0}
.gwhat{margin:6px 0 9px;color:var(--ink2);font-size:13px;line-height:1.65}
.gauto{font-size:12px;color:var(--green);background:#F1F8F4;border:1px solid #CFE6D8;border-radius:2px;padding:6px 10px;display:inline-block}
.glegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--mut);margin-top:4px}
.glegend span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}aside,main{min-width:0;max-width:100%}aside{position:relative;height:auto}
.contact{margin-top:18px}.kpis,.grid2,.c4,.c3,.c2{grid-template-columns:1fr}main{padding:16px}
.top select{margin-left:0}.mailcard{left:12px;right:12px;width:auto}
.hero{flex-wrap:wrap}.hero>div{min-width:0}.hero .amount{font-size:25px}.hero .fig{word-break:keep-all;white-space:normal}}
</style></head><body>
<div class="app">
<aside>
  <div class="brand">소재 그룹 국내 출장비 관리</div>
  <div class="nav">
    <div class="nav-label">출장 업무</div>
    <a data-view="guide">이용 안내 <span class="lk">흐름</span></a>

    <a data-view="budget">예산 관리 <span class="lk">잠금</span></a>
    <a data-view="data">데이터 관리</a>
  </div>
  <div class="contact"><b>기획 · 개발</b>소재전략 이정훈 TL<br>
  <a href="mailto:junghoon12.lee@sk.com">junghoon12.lee@sk.com</a><br>010-3376-7923</div>
</aside>
<main>
  <div class="top">
    <div><h1 id="pageTitle">대시보드</h1><div class="sub" id="pageSub"></div></div>
    <select id="qsel"></select>
  </div>
  <section id="v-guide" class="view"></section>
  <section id="v-dash" class="view on"></section>
  <section id="v-plan" class="view"></section>
  <section id="v-actual" class="view"></section>
  <section id="v-list" class="view"></section>
  <section id="v-process" class="view"></section>
  <section id="v-budget" class="view"></section>
  <section id="v-data" class="view"></section>
</main>
</div>
<script>
/* 국내 출장비 관리 — 정적(GitHub Pages) 로컬 백엔드
   Flask의 core.py/store.py/routes.py를 브라우저에서 동일 로직으로 구현.
   저장은 localStorage(브라우저별). 관리자 잠금은 UX용(클라이언트라 보안 경계 아님). */
(function (root) {
  'use strict';
  var LS_DATA = 'tb_data', LS_BACKUPS = 'tb_backups', MAX_BACKUPS = 30;

  // ── 상수 (core.py와 동일) ──
  var COST = [['trans', '교통비'], ['lodg', '숙박비'], ['meal', '식대&잡비'], ['etc', '기타']];
  var KEYS = COST.map(function (c) { return c[0]; });
  var PLAN_TYPES = ['계획', '변경', '긴급'];
  var RANKS = ['TL', '팀장'];
  var KINDS = ['기술교류(Live Demo, Data 분석)', '실사&사양 개선,협의', '정기 Audit',
    '비정기 Audit(Issue/Theme)', '기타'];
  var CARS = ['미사용', '자차사용'];
  var REV_TYPES = ['최초배정', '추가증액', '감액', '이월'];
  var ST_PLAN = '계획 등록', ST_INFORM = '실적 입력·인폼', ST_TRANSFER = '소재 이관',
    ST_DONE = '처리 완료', ST_CANCEL = '취소';
  var ST_CONFIRM = '확정 예정';                            // 실제로 감 → 예산 선확보
  var STATUSES = [ST_PLAN, ST_CONFIRM, ST_INFORM, ST_TRANSFER, ST_DONE, ST_CANCEL];
  var PRE = [ST_PLAN, ST_CONFIRM];                         // 실적 전(계획 단계)
  var WIP = [ST_INFORM, ST_TRANSFER];
  var ST_HOLD = '보류';                                    // 개인별 처리 보류
  var PSTATES = [ST_INFORM, ST_TRANSFER, ST_HOLD, ST_DONE]; // 출장자 개인 처리 상태
  var ADMIN_ZONE = [ST_TRANSFER, ST_HOLD, ST_DONE];         // 예산 담당자가 결정한 영역
  var CCG_TEAMS = [
    { team: 'Photo 소재팀', ccg: 'C1303' }, { team: 'Chemical 소재팀', ccg: 'C1101' },
    { team: 'CMP 소재팀', ccg: 'C1404' }, { team: 'Gas 소재팀', ccg: 'C1202' },
    { team: 'Precursor 소재팀', ccg: 'C1505' }, { team: 'Wafer 소재팀', ccg: 'C1606' },
    { team: 'Target 소재팀', ccg: 'C1707' }];
  var CCG_BY_NM = {}; CCG_TEAMS.forEach(function (t) { CCG_BY_NM[t.team] = t.ccg; });
  var CSV_HEADERS = ['no.', '구분', 'LV2', 'CCG', 'CCG명', '사번', '성명', '직책',
    '출장도시', '출장기관&업체', '출장목적&사유', '출발일자', '복귀일자', '출장일수',
    '출장시점', '자차사용여부', '출장구분', '상태', '개인처리상태',
    '계획_총합계', '계획_교통비', '계획_숙박비', '계획_식대&잡비', '계획_기타',
    '실적_총합계', '실적_교통비', '실적_숙박비', '실적_식대&잡비', '실적_기타',
    'SAP전표번호', '리드타임(일)', '비고'];
  var STAGE_ORDER = {}; STAGE_ORDER[ST_PLAN]=0; STAGE_ORDER[ST_CONFIRM]=1; STAGE_ORDER[ST_INFORM]=2;
  STAGE_ORDER[ST_TRANSFER]=3; STAGE_ORDER[ST_DONE]=4; STAGE_ORDER[ST_CANCEL]=5;

  // ── 유틸 ──
  function num(v) { var n = Math.round(Number(String(v == null ? 0 : v).replace(/,/g, ''))); return isFinite(n) ? n : 0; }
  function won(n) { return num(n).toLocaleString('en-US'); }
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseD(s) {
    if (!s) return null;
    var m = String(s).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null; var d = new Date(+m[1], +m[2] - 1, +m[3]); return isNaN(d.getTime()) ? null : d;
  }
  function tripDays(a, b) { var da = parseD(a), db = parseD(b); if (!da || !db) return 0; var n = Math.round((db - da) / 864e5); return n < 0 ? 0 : n + 1; }
  function quarter(s) { var d = parseD(s); return d ? (Math.floor(d.getMonth() / 3) + 1) + 'Q' : ''; }
  function yearQuarter(s) { var d = parseD(s) || today(); return d.getFullYear() + '-' + (Math.floor(d.getMonth() / 3) + 1) + 'Q'; }
  function yqList(n) {
    n = n || 6; var y = today().getFullYear(), q = Math.floor(today().getMonth() / 3) + 1, out = [];
    for (var i = 0; i < n; i++) { out.push(y + '-' + q + 'Q'); q--; if (q === 0) { y--; q = 4; } }
    var ny = today().getFullYear(), nq = Math.floor(today().getMonth() / 3) + 2;
    if (nq === 5) { ny++; nq = 1; }

  function csvSafe(v) { var s = v == null ? '' : String(v); return (s.length && '=+-@\t\r'.indexOf(s.charAt(0)) >= 0) ? "'" + s : s; }
  function makeCsv(data, yq) {
    var out = [], no = 1;
    var groups = (data.groups || []).slice().sort(function (a, b) { return String(a.dep_dt || '').localeCompare(String(b.dep_dt || '')); });
    groups.forEach(function (raw) {
      var g = normalizeGroup(raw); if (yq && g.yq !== yq) return;
      g.travelers.forEach(function (p) {
        out.push([no, g.plan_type, '소재', p.ccg || '', csvSafe(p.ccg_nm || ''),
          csvSafe(p.emp_no || ''), csvSafe(p.name || ''), p.rank || '',
          csvSafe(g.city || ''), csvSafe(g.org || ''), csvSafe(g.purpose || ''),
          g.dep_dt || '', g.ret_dt || '', g.days, g.quarter, g.car || '', g.kind || '', groupRoll(g), effStatus(p, g),
          pSum(p, 'p'), p.p_trans, p.p_lodg, p.p_meal, p.p_etc,
          pSum(p, 'a'), p.a_trans, p.a_lodg, p.a_meal, p.a_etc,
          csvSafe(g.sap_doc || ''), (g.lead_days === null || g.lead_days === undefined) ? '' : g.lead_days,
          csvSafe(g.remark || '')]);
        no++;
      });
    });
    var lines = [CSV_HEADERS.map(csvCell).join(',')];
    out.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
    return '﻿' + lines.join('\r\n') + '\r\n';
  }

  var BUDGET_CSV_HEADERS = ['no.', '분기', 'REV', '반영일', '유형', '증감액', '누적액', '사유'];
  function makeBudgetCsv(data, yq) {
    var B = (data.budget || []).filter(function (b) { return !yq || b.yq === yq; });
    B.sort(function (a, b) {
      var ka = (a.yq || '') + (a.rev_dt || '') + (a.rev_id || '');
      var kb = (b.yq || '') + (b.rev_dt || '') + (b.rev_id || '');
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
    var out = [], run = 0, cur = null;
    B.forEach(function (b, i) {
      if (b.yq !== cur) { cur = b.yq; run = 0; }
      run += num(b.amt);
      out.push([i + 1, csvSafe(b.yq || ''), csvSafe(b.rev_id || ''), csvSafe(b.rev_dt || ''),
                csvSafe(b.rev_type || ''), num(b.amt), run, csvSafe(b.reason || '')]);
    });
    var lines = [BUDGET_CSV_HEADERS.map(csvCell).join(',')];
    out.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
    return '\ufeff' + lines.join('\r\n') + '\r\n';
  }

  // ── 저장소 (localStorage) ──
  function LS() { return root.localStorage || globalThis.localStorage; }
  function appendAudit(data, action, detail, actor) {
    if (!data.audit_log) data.audit_log = [];
    data.audit_log.push({ timestamp: nowISO(), actor: actor || '-', action: action, detail: detail || '' });
    data.audit_log = data.audit_log.slice(-500);
  }
  function loadBackups() { try { return JSON.parse(LS().getItem(LS_BACKUPS) || '[]'); } catch (e) { return []; } }
  function saveBackups(b) { LS().setItem(LS_BACKUPS, JSON.stringify(b)); }
  var Store = {
    load: function () {
      var raw = LS().getItem(LS_DATA);
      if (!raw) { var d = seedData(); LS().setItem(LS_DATA, JSON.stringify(d)); return d; }
      return JSON.parse(raw);
    },
    save: function (data, makeBackup) {
      if (makeBackup !== false) {
        var cur = LS().getItem(LS_DATA);
        if (cur) {
          var d = new Date();
          var fn = 'data_' + d.getFullYear() + pad(d.getMonth() + 1, 2) + pad(d.getDate(), 2) + '_'
            + pad(d.getHours(), 2) + pad(d.getMinutes(), 2) + pad(d.getSeconds(), 2) + '_'
            + pad(d.getMilliseconds(), 3) + pad(Math.floor((root.crypto || globalThis.crypto).getRandomValues(new Uint8Array(1))[0]), 3) + '.json';
          var b = loadBackups(); b.push({ filename: fn, ts: nowISO(), size: byteLen(cur), data: cur });
          b.sort(function (x, y) { return x.filename < y.filename ? 1 : -1; });
          saveBackups(b.slice(0, MAX_BACKUPS));
        }
      }
      data.updated_at = nowISO();
      LS().setItem(LS_DATA, JSON.stringify(data));
      return data;
    },
    backups: function () {
      return loadBackups().slice().sort(function (x, y) { return x.filename < y.filename ? 1 : -1; })
        .map(function (b) { return { filename: b.filename, size: b.size, modified_at: b.ts }; });
    },
    restore: function (filename, auditLog) {
      var b = loadBackups().filter(function (x) { return x.filename === filename; })[0];
      if (!b) throw new Error('백업 파일을 찾을 수 없습니다.');
      var data = JSON.parse(b.data);
      if (auditLog != null) data.audit_log = auditLog;
      return Store.save(data, true);
    },
    reset: function () { LS().removeItem(LS_DATA); LS().removeItem(LS_BACKUPS); }
  };

  // ── 라우트 (routes.py와 동일한 게이트) ──
  function publicSettings(s) { var o = {}; Object.keys(s).forEach(function (k) { if (k !== 'admin_pw') o[k] = s[k]; }); return o; }
  function err(msgs, code) { return { ok: false, status: code || 400, data: { ok: false, errors: Array.isArray(msgs) ? msgs : [msgs] } }; }
  function okr(obj, code) { obj.ok = true; return { ok: true, status: code || 200, data: obj }; }
  function find(data, gid) { return (data.groups || []).filter(function (g) { return g.group_id === gid; })[0] || null; }

  function localApi(path, opt) {
    opt = opt || {};
    var method = (opt.method || 'GET').toUpperCase();
    var body = {}; if (opt.body) { try { body = JSON.parse(opt.body); } catch (e) { body = {}; } }
    var headers = opt.headers || {};
    var qs = ''; var qi = path.indexOf('?'); if (qi >= 0) { qs = path.slice(qi + 1); path = path.slice(0, qi); }
    function qp(k) { var m = qs.match(new RegExp('(?:^|&)' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : null; }
    var data = Store.load();
    var _pw = String(data.settings.admin_pw == null ? '' : data.settings.admin_pw);
    var isAdmin = !!_pw && String(headers['X-Admin-PW'] || '') === _pw;
    var m;

    if (path === '/state' && method === 'GET') {
      var yq = qp('yq') || yearQuarter();
      var groups = (data.groups || []).map(normalizeGroup).sort(function (a, b) { return (b.dep_dt || '') < (a.dep_dt || '') ? -1 : (b.dep_dt || '') > (a.dep_dt || '') ? 1 : 0; });
      return okr({
        yq: yq, yqList: yqList(), settings: publicSettings(data.settings), ccg: CCG_TEAMS,
        dash: dash(data, yq), groups: groups,
        budget: (data.budget || []).filter(function (b) { return b.yq === yq; }).sort(function (a, b) { return (a.rev_dt || '') < (b.rev_dt || '') ? -1 : 1; }),
        meta: { planTypes: PLAN_TYPES, ranks: RANKS, kinds: KINDS, cars: CARS, revTypes: REV_TYPES, statuses: STATUSES, cost: COST.map(function (c) { return { k: c[0], label: c[1] }; }) }
      });
    }
    if (path === '/groups' && method === 'POST') {
      body.group_id = 'TB-' + randHex(8).toUpperCase();
      body.status = body.confirmed ? ST_CONFIRM : ST_PLAN; body.created_at = nowISO();
      (body.travelers || []).forEach(function (p) { if (p && typeof p === 'object') delete p.status; });
      var g = normalizeGroup(body); var e = validateGroup(g, false);
      if (e.length) return err(e);
      data.groups.push(g);
      appendAudit(data, '출장 계획 등록', g.group_id + ' ' + (g.org || '') + ' ' + g.travelers.length + '명');
      Store.save(data); return okr({ group: g }, 201);
    }
    if ((m = path.match(/^\/groups\/([^/]+)$/)) && method === 'PUT') {
      var cur = find(data, m[1]); if (!cur) return err('출장건을 찾을 수 없습니다.', 404);
      if (locked(cur) && !isAdmin) return err('이관·처리 단계의 건은 관리자만 수정할 수 있습니다.', 401);
      var merged = Object.assign({}, cur, body, { group_id: m[1], status: cur.status || ST_PLAN });
      var oldSt = {}; (cur.travelers || []).forEach(function (p) { oldSt[String(p.emp_no)] = p.status || ''; });
      (merged.travelers || []).forEach(function (p) { if (p && typeof p === 'object') p.status = oldSt[String(p.emp_no)] || ''; });
      var g2 = normalizeGroup(merged); var e2 = validateGroup(g2, WIP.indexOf(g2.status) >= 0);
      if (e2.length) return err(e2);
      g2.updated_at = nowISO(); data.groups[data.groups.indexOf(cur)] = g2;
      appendAudit(data, '출장 수정', m[1]); Store.save(data); return okr({ group: g2 });
    }
    if ((m = path.match(/^\/groups\/([^/]+)\/actual$/)) && method === 'POST') {
      var cur3 = find(data, m[1]); if (!cur3) return err('출장건을 찾을 수 없습니다.', 404);
      if (cur3.status === ST_DONE || cur3.status === ST_CANCEL) return err('완료·취소된 건에는 실적을 입력할 수 없습니다.');
      if (locked(cur3) && !isAdmin) return err('이관·처리가 시작된 건의 실적은 관리자만 수정할 수 있습니다.', 401);
      var g3 = normalizeGroup(cur3);
      var byEmp = {}; (body.travelers || []).forEach(function (p) { byEmp[String(p.emp_no)] = p; });
      g3.travelers.forEach(function (p) {
        var src = byEmp[String(p.emp_no)];
        if (src) KEYS.forEach(function (k) { if (('a_' + k) in src) p['a_' + k] = num(src['a_' + k]); });

      data.groups[data.groups.indexOf(cur3)] = g3;
      appendAudit(data, '실적 입력·인폼', m[1] + ' 실적 ' + won(g3.act_tot) + '원');
      Store.save(data);
      return okr({ group: g3, mail: makeMail(g3, data.settings), dash: dash(data, g3.yq) });
    }
    if ((m = path.match(/^\/groups\/([^/]+)\/status$/)) && method === 'POST') {
      var cur4 = find(data, m[1]); if (!cur4) return err('출장건을 찾을 수 없습니다.', 404);
      var want = body.status || '';
      var emp = body.emp_no;
      // ── 개인별 처리 ──
      if (emp !== undefined && emp !== null && emp !== '') {
        if (PSTATES.indexOf(want) < 0) return err('개인 처리 상태 값이 올바르지 않습니다.');
        if (cur4.status === ST_PLAN || cur4.status === ST_CANCEL) return err('실적 입력 후 개인별 처리가 가능합니다.');
        if (!isAdmin) return err('관리자 인증이 필요합니다.', 401);

      var held = 0;

      if (want === ST_DONE) cur4.settle_at = cur4.updated_at;
      appendAudit(data, '상태 변경', m[1] + ' → ' + want, isAdmin ? 'admin' : 'user');

      var whoD = (curD.travelers || []).map(function (p) { return p.name || ''; }).join(', ');
      appendAudit(data, '잠정 계획 삭제',
        m[1] + ' ' + (curD.city || '') + ' ' + (curD.org || '') + ' · ' + whoD +
        ' · 계획 ' + won(gSum(normalizeGroup(curD), 'p')) + '원', isAdmin ? 'admin' : 'user');
      Store.save(data);
      return okr({ dash: dash(data, yqD) });
    }
    if (path === '/admin/verify' && method === 'POST') {
      return String(body.pw == null ? '' : body.pw) === String(data.settings.admin_pw == null ? '' : data.settings.admin_pw)
        ? okr({}) : err('아이디 또는 비밀번호가 올바르지 않습니다.', 401);
    }
    if (path === '/budget' && method === 'POST') {
      if (!isAdmin) return err('관리자 인증이 필요합니다.', 401);
      var e5 = validateBudget(body); if (e5.length) return err(e5);
      var b2 = fixBudgetSign(body);
      var rec = { rev_id: 'B-' + randHex(8).toUpperCase(), yq: String(b2.yq).trim(),
        rev_dt: b2.rev_dt || todayISO(), rev_type: b2.rev_type, amt: b2.amt, reason: String(b2.reason == null ? '' : b2.reason).trim() };
      data.budget.push(rec);
      appendAudit(data, '예산 이력 추가', rec.rev_id + ' ' + rec.rev_type + ' ' + won(rec.amt), 'admin');
      Store.save(data); return okr({ budget: rec, dash: dash(data, rec.yq) }, 201);
    }
    if ((m = path.match(/^\/budget\/([^/]+)$/)) && method === 'DELETE') {
      if (!isAdmin) return err('관리자 인증이 필요합니다.', 401);
      var before = data.budget.length;
      data.budget = data.budget.filter(function (b) { return b.rev_id !== m[1]; });
      if (data.budget.length === before) return err('리비전을 찾을 수 없습니다.', 404);
      appendAudit(data, '예산 이력 삭제', m[1], 'admin'); Store.save(data); return okr({});
    }
    if ((m = path.match(/^\/groups\/([^/]+)\/sap$/)) && method === 'POST') {
      if (!isAdmin) return err('관리자 인증이 필요합니다.', 401);
      var curS = find(data, m[1]); if (!curS) return err('출장건을 찾을 수 없습니다.', 404);
      curS.sap_doc = String(body.sap_doc || '').trim(); curS.updated_at = nowISO();
      appendAudit(data, 'SAP 전표번호', m[1] + ' → ' + (curS.sap_doc || '(삭제)'), 'admin');
      Store.save(data);
      return okr({ group: normalizeGroup(curS) });
    }
    if (path === '/report' && method === 'GET') {
      return okr({ report: centerReport(data, qp('yq') || yearQuarter()) });
    }
    if (path === '/audit' && method === 'GET') {
      return okr({ audit: (data.audit_log || []).slice().reverse().slice(0, 200) });
    }
    if (path === '/backups' && method === 'GET') { return okr({ backups: Store.backups() }); }
    if ((m = path.match(/^\/backups\/([^/]+)\/restore$/)) && method === 'POST') {
      if (!isAdmin) return err('관리자 인증이 필요합니다.', 401);
      var fn = decodeURIComponent(m[1]);
      var au = (Store.load().audit_log || []).slice();
      au.push({ timestamp: nowISO(), actor: 'admin', action: '백업 복원', detail: fn });
      try { Store.restore(fn, au.slice(-500)); } catch (e6) { return err(e6.message); }
      return okr({});
    }
    return err('알 수 없는 요청입니다.', 404);
  }

  var API = {
    localApi: localApi, Store: Store, makeCsv: makeCsv,
    // 테스트/재사용용 내부 함수
    makeBudgetCsv: makeBudgetCsv,
    _: { num: num, won: won, tripDays: tripDays, quarter: quarter, yearQuarter: yearQuarter, yqList: yqList,
      normalizeGroup: normalizeGroup, validateGroup: validateGroup, validateBudget: validateBudget,
      dash: dash, makeMail: makeMail, seedData: seedData, CCG_TEAMS: CCG_TEAMS, CSV_HEADERS: CSV_HEADERS,
      effStatus: effStatus, groupRoll: groupRoll, procCounts: procCounts }
  };
  root.__localApi = localApi;
  root.__tbStore = Store;
  root.downloadBudgetCsv = function (yq) {
    var text = makeBudgetCsv(Store.load(), yq || null);
    var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = '예산리비전_' + (yq || '전체') + '_' + todayISO().replace(/-/g, '') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };
  root.downloadCsv = function (yq) {
    var text = makeCsv(Store.load(), yq || null);
    var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = '국내출장비_' + (yq || '전체') + '_' + todayISO().replace(/-/g, '') + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* 국내 출장비 관리 — 프런트 (서버 SSOT 렌더) */

  list:'출장 내역', process:'이관·처리 관리', budget:'예산 관리', data:'데이터 관리'};

  actual:'실적 저장 시 실비 이관 인폼이 자동 생성됩니다', list:'분기 전체 출장 이력',
  process:'실적 입력·인폼 → 소재 이관 → 처리 완료', budget:'예산 리비전 등록·이력 (감액은 자동 음수 처리)',

let ST = null, YQ = null, VIEW = 'dash';

function adminPw(){ return sessionStorage.getItem('tb_pw') || ''; }
async function api(path, opt = {}){
  opt.headers = Object.assign({'Content-Type':'application/json'}, opt.headers || {});

}
function toast(m){ const t = document.createElement('div'); t.className = 'toast';
  t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
async function copyText(text, msg = '본문을 복사했습니다'){
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); toast(msg); return; }
    const ta = document.createElement('textarea');   // 사내 비-HTTPS 등 clipboard 미지원 환경 폴백
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const okc = document.execCommand('copy'); ta.remove();
    toast(okc ? msg : '복사할 수 없습니다 — 본문을 직접 선택해 복사하세요');
  } catch (e) { toast('복사할 수 없습니다 — 본문을 직접 선택해 복사하세요'); }
}
function showErr(sel, errs){ $(sel).innerHTML =
  `<div class="err">${(errs || ['요청 실패']).map(esc).join('\n')}</div>`; }
function stClass(s){ return s === '처리 완료' ? 'done' : s === '취소' ? 'cancel'
  : s === '확정 예정' ? 'confirm'

function dispSt(s){ return s === '계획 등록' ? '계획(잠정)' : s; }   // 잠정/확정 구분 명확히
function gname(g){ return [g.city, g.org].filter(Boolean).join(' '); }
function names(g){ return (g.travelers || []).map(p => esc(p.name)).join(', '); }
function procTag(g){   // 부분 처리(개인별 상태 분리) 표시 — 섞여 있을 때만
  const p = g.proc;
  if (!p || ['계획 등록', '확정 예정', '취소'].includes(g.status) || p.done === p.total) return '';
  const bits = [];
  if (p.done) bits.push(`완료 ${p.done}`);
  if (p.transfer) bits.push(`이관 ${p.transfer}`);
  if (p.inform) bits.push(`인폼 ${p.inform}`);
  if (p.hold) bits.push(`보류 ${p.hold}`);
  if (!bits.length) return '';                 // 표시할 게 없으면 빈 괄호를 만들지 않는다
  return ` <span class="sub" style="color:${p.hold ? 'var(--red)' : 'var(--mut)'}">(${bits.join(' · ')})</span>`;
}

async function load(){

}
function nav(v){

$$('.nav a').forEach(a => a.onclick = () => {
  const v = a.dataset.view;
  if ((v === 'process' || v === 'budget') && !adminPw()) { askAdmin(() => nav(v)); return; }
  nav(v);
});
function renderAll(){ rGuide(); rDash(); rPlan(); rActual(); rList(); rProcess(); rBudget(); rData(); }

/* ═══ 이용 안내 (처리 흐름) ═══ */
function rGuide(){
  const to = (ST.settings && ST.settings.mail_recipients || []).map(esc).join(', ');
  const step = (n, cls, status, title, role, roleCls, what, auto, jump) => `

    </div>`;
  const lead = `
    <div class="g-lead">

  const steps =
    step(1, '', '계획 등록', '계획을 올리고, 실제로 갈 건 ‘확정’', '담당자', 'owner',
      '도시·업체·목적·일자와 <b>출장자별 예상 비용</b>을 입력합니다(동행자는 행 추가). 처음엔 <b>잠정 계획</b>이고, 실제로 갈 건 <b>‘출장 확정’</b> 하면 계획 금액만큼 <b>예산이 미리 확보</b>돼요. 안 가게 된 잠정 계획은 ‘출장 내역’에서 <b>삭제</b>(흔적 없이 사라짐).',
      '잠정 계획은 예산 미반영(참고), 확정하면 가용 잔여에서 차감됩니다.',
      `<button class="btn pri" onclick="nav('plan')">출장 계획 등록으로 가기 →</button>`) +
    step(2, '', '실적 입력·인폼', '출장을 다녀온 뒤, 실제 쓴 금액을 넣습니다', '담당자', 'owner',

      '<b>소재 출장 예산 담당자</b>가 실비 이관 결재를 상신하고, <b>소재 담당자에게 이관 인폼(메일)</b>을 보냅니다 — “이관 결재 상신했습니다. 참조자로 추가했으니 이관 후 비용 처리 부탁드립니다.” <b>같은 출장이라도 사람마다 사정이 다르면</b>(예: 5명 중 1명만 예산 부족) <b>출장자별로 따로</b> 이관·완료·<b>보류</b>할 수 있어요.',

      <div class="glegend">
        <span><span class="status">계획 등록</span> 아직 계획만</span>

      <div class="gwhat"><b>· 인폼은 누구에게 가나요?</b> ${to || '설정된 수신자'} 로 발송용 초안이 만들어집니다.</div>

  $('#v-guide').innerHTML = lead + steps + money + legend + faq;
}

/* ═══ 대시보드 ═══ */
function rDash(){
  const d = ST.dash;
  const av = d.avail !== undefined ? d.avail : d.remain;
  const burn = d.alloc ? Math.round((d.done + d.wip + (d.commit || 0)) / d.alloc * 100) : 0;
  const hero = `
    <div class="hero ${d.short ? 'alert' : ''}">
      <span class="lamp"></span>

      <div class="btns" style="margin-top:0"><button class="btn" onclick="showReport()">센터 제출 리포트</button></div></div>`;
  const rows = d.byCcg.map(r => `<tr>
    <td><b>${esc(r.team)}</b> <span class="sub">${r.ccg}</span></td>

  const tot = d.byCcg.reduce((a, r) => (
    {done:a.done + r.done, wip:a.wip + r.wip, total:a.total + r.total, commit:a.commit + (r.commit||0), plan:a.plan + r.plan,
     groups:a.groups + r.groups, people:a.people + r.people}), {done:0, wip:0, total:0, commit:0, plan:0, groups:0, people:0});
  const ccg = `

let TRAV_N = 0;
function travRow(p = {}){
  TRAV_N++;
  const teams = ST.ccg.map(t => `<option${t.team === p.ccg_nm ? ' selected' : ''}>${esc(t.team)}</option>`).join('');
  const ranks = ST.meta.ranks.map(r => `<option${r === (p.rank || 'TL') ? ' selected' : ''}>${r}</option>`).join('');
  return `<tr data-tid="${TRAV_N}">
    <td><input class="w-nm t-nm" value="${esc(p.name || '')}" placeholder="성명"></td>
    <td><input class="w-no t-no" value="${esc(p.emp_no || '')}" placeholder="사번"></td>
    <td><select class="w-rk t-rk">${ranks}</select></td>
    <td><select class="w-tm t-tm" onchange="syncCcg(this)"><option value="">선택</option>${teams}</select></td>
    <td><input class="w-cc t-cc auto" value="${esc(p.ccg || '')}" readonly placeholder="자동"></td>
    ${KEYS.map(k => `<td><input type="number" class="w-mn t-p-${k}" step="1000" value="${p['p_' + k] || ''}" placeholder="0" oninput="planSum()"></td>`).join('')}

    <td><button class="btn sm" onclick="this.closest('tr').remove(); planSum()">삭제</button></td>
  </tr>`;
}
function syncCcg(sel){
  const t = ST.ccg.find(x => x.team === sel.value);
  sel.closest('tr').querySelector('.t-cc').value = t ? t.ccg : '';
}
function planSum(){
  let tot = 0;
  $$('#travBody tr').forEach(tr => {
    let s = 0;
    KEYS.forEach(k => s += Number(tr.querySelector('.t-p-' + k).value) || 0);
    tr.querySelector('.t-sum').textContent = won(s);
    tot += s;
  });
  const el = $('#planTot'); if (el) el.textContent = won(tot) + '원';
  const d1 = $('#pl_dep')?.value, d2 = $('#pl_ret')?.value;
  const dy = $('#pl_days');
  if (dy) dy.value = (d1 && d2) ? Math.max(0, (new Date(d2) - new Date(d1)) / 864e5 + 1) : '';
}

function addTrav(p){ $('#travBody').insertAdjacentHTML('beforeend', travRow(p || {})); planSum(); }
function copyPlan(gid){
  if (!gid) return;
  const g = ST.groups.find(x => x.group_id === gid);
  if (!g) return;
  $('#pl_type').value = g.plan_type; $('#pl_city').value = g.city; $('#pl_org').value = g.org;
  $('#pl_kind').value = g.kind; $('#pl_car').value = g.car || '미사용';
  $('#pl_purpose').value = g.purpose; $('#pl_remark').value = '';
  $('#pl_dep').value = ''; $('#pl_ret').value = '';
  $('#travBody').innerHTML = '';
  (g.travelers || []).forEach(p => addTrav(p));
  planSum();
  toast('이전 출장을 복사했습니다 — 일자·금액을 확인하세요');
}
function collectTravelers(){
  return $$('#travBody tr').map(tr => {
    const p = {name: tr.querySelector('.t-nm').value.trim(),
      emp_no: tr.querySelector('.t-no').value.trim(),
      rank: tr.querySelector('.t-rk').value,
      ccg_nm: tr.querySelector('.t-tm').value,
      ccg: tr.querySelector('.t-cc').value};
    KEYS.forEach(k => p['p_' + k] = Number(tr.querySelector('.t-p-' + k).value) || 0);
    return p;
  });
}
async function submitPlan(){
  const body = {plan_type: $('#pl_type').value, city: $('#pl_city').value.trim(),
    org: $('#pl_org').value.trim(), kind: $('#pl_kind').value,
    dep_dt: $('#pl_dep').value, ret_dt: $('#pl_ret').value, car: $('#pl_car').value,
    purpose: $('#pl_purpose').value.trim(), remark: $('#pl_remark').value.trim(),
    confirmed: $('#pl_confirm')?.checked || false,
    travelers: collectTravelers()};
  const {ok, data} = await api('/groups', {method: 'POST', body: JSON.stringify(body)});
  if (!ok) { showErr('#planErr', data.errors); return; }
  toast(`등록 완료 — ${dispSt(data.group.status)} · ${body.travelers.length}명`);

}

let ACT_GID = null;
function rActual(){
  const targets = ST.groups.filter(g => g.yq === YQ && ['계획 등록', '확정 예정', '실적 입력·인폼'].includes(g.status));
  const opts = targets.map(g =>
    `<option value="${g.group_id}">${esc(gname(g))} · ${names(g)} · ${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} · ${g.status}${g.plan_type === '긴급' ? ' [긴급]' : ''}</option>`).join('');
  $('#v-actual').innerHTML = `
    <div class="card">
      <h2>출장 실적 입력</h2>
      <p class="cap">대상 출장을 선택해 출장자별 실적을 입력하면, 저장과 동시에 그룹당 1통의 실비 이관 인폼이 생성됩니다.</p>
      <div id="actErr"></div>
      <div class="filter-row">
        <input id="actFilter" placeholder="성명·업체·도시로 검색" oninput="filterActual()">
        <select id="actSel" onchange="pickActual(this.value)" style="flex:1;min-width:300px">
          <option value="">대상 출장 선택 (${targets.length}건)</option>${opts}</select>
      </div>
      <div id="actBody"></div>
    </div>`;
  ACT_GID = null;
}
function filterActual(){
  const q = $('#actFilter').value.trim();
  [...$('#actSel').options].forEach((o, i) => {
    if (i === 0) return;
    o.hidden = q && !o.textContent.includes(q);
  });
}
function pickActual(gid){
  ACT_GID = gid;
  const box = $('#actBody');
  if (!gid) { box.innerHTML = ''; return; }
  const g = ST.groups.find(x => x.group_id === gid);
  const m = ST.meta;
  const rows = g.travelers.map((p, i) => {
    const plan = KEYS.reduce((s, k) => s + (p['p_' + k] || 0), 0);
    return `<tr data-emp="${esc(p.emp_no)}">
      <td><b>${esc(p.name)}</b> <span class="sub">${esc(p.rank)} · ${esc(p.emp_no)}</span></td>
      <td>${esc(p.ccg_nm)}</td>
      ${KEYS.map(k => `<td><input type="number" class="a-${k}" step="1000" value="${p['a_' + k] || ''}" placeholder="계획 ${won(p['p_' + k])}" oninput="actSum()"></td>`).join('')}
      <td class="num a-sum" style="font-weight:700">0</td>
      <td class="num a-var">–</td>
    </tr>`;
  }).join('');
  box.innerHTML = `
    <div class="note"><b>${esc(gname(g))}</b> · ${esc(g.purpose)} · ${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} (${g.days}일) · ${g.travelers.length}명 · 계획 합계 ${won(g.plan_tot)}원</div>
    <div class="scroll trav-table"><table>
      <thead><tr><th>출장자</th><th>CCG팀</th>
        ${m.cost.map(c => `<th class="num">실적 ${c.label}</th>`).join('')}
        <th class="num">실적 합계</th><th class="num">계획 대비</th></tr></thead>
      <tbody id="actRows">${rows}</tbody>
      <tfoot><tr><td colspan="2">그룹 합계</td>
        ${KEYS.map(k => `<td class="num" id="af-${k}">0</td>`).join('')}
        <td class="num" id="afTot">0</td><td class="num" id="afVar">–</td></tr></tfoot>
    </table></div>
    <div class="form-grid" style="margin-top:12px">
      <div><label>비고 <span class="au">긴급 출장은 필수</span></label><input id="ac_remark" value="${esc(g.remark || '')}"></div>
    </div>
    <div class="btns"><button class="btn pri" onclick="submitActual()">실적 저장 및 인폼 생성 (${g.travelers.length}명)</button></div>`;
  actSum();
}
function actSum(){
  const g = ST.groups.find(x => x.group_id === ACT_GID);
  if (!g) return;
  const ft = {trans:0, lodg:0, meal:0, etc:0};
  let tot = 0, planTot = 0;
  $$('#actRows tr').forEach(tr => {
    const emp = tr.dataset.emp;
    const p = g.travelers.find(x => String(x.emp_no) === emp) || {};
    let s = 0, pl = 0;
    KEYS.forEach(k => { const v = Number(tr.querySelector('.a-' + k).value) || 0;
      s += v; ft[k] += v; pl += p['p_' + k] || 0; });
    tot += s; planTot += pl;
    tr.querySelector('.a-sum').textContent = won(s);
    const v = pl && s ? pl - s : 0;
    const el = tr.querySelector('.a-var');
    el.textContent = v ? (v > 0 ? '+' : '−') + won(Math.abs(v)) : '–';
    el.style.color = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--faint)';
  });
  KEYS.forEach(k => $('#af-' + k).textContent = won(ft[k]));
  $('#afTot').textContent = won(tot);
  const gv = planTot && tot ? planTot - tot : 0;
  const fe = $('#afVar');
  fe.textContent = gv ? (gv > 0 ? '+' : '−') + won(Math.abs(gv)) : '–';
  fe.style.color = gv >= 0 ? 'var(--green)' : 'var(--red)';
}
async function submitActual(){
  const travelers = $$('#actRows tr').map(tr => {
    const p = {emp_no: tr.dataset.emp};
    KEYS.forEach(k => p['a_' + k] = Number(tr.querySelector('.a-' + k).value) || 0);
    return p;
  });
  const {ok, data} = await api(`/groups/${ACT_GID}/actual`,
    {method: 'POST', body: JSON.stringify({travelers, remark: $('#ac_remark').value.trim()})});
  if (!ok) { showErr('#actErr', data.errors); return; }
  showMail(data.mail);
  toast('실적 저장 — 상태: 실적 입력·인폼');
  await load(); nav('actual');
}

/* ═══ 인폼 카드 ═══ */
function showMail(mail){
  document.getElementById('mailCard')?.remove();
  const el = document.createElement('div');
  el.className = 'mailcard'; el.id = 'mailCard';
  el.innerHTML = `
    <div class="mh"><span>${esc(mail.heading || '실비 이관 요청 인폼 (그룹당 1통)')}</span>
      <button onclick="this.closest('.mailcard').remove()">×</button></div>
    <div class="meta">
      <div class="row"><span class="k">수신</span><span style="word-break:break-all">${esc(mail.to)}</span></div>
      <div class="row"><span class="k">제목</span><span>${esc(mail.subject)}</span></div>
    </div>
    <div class="body">${mail.body_html}</div>
    <div class="mf">
      <button class="btn sm pri" id="mailOpen">메일 열기 (Outlook)</button>
      <button class="btn sm" id="mailCopyHtml">표 포함 복사</button>
      <button class="btn sm" id="mailCopyText">본문 텍스트 복사</button>
    </div>`;
  document.body.appendChild(el);
  $('#mailOpen').onclick = () => {
    const url = `mailto:${encodeURIComponent(mail.to)}?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body_text)}`;
    if (url.length > 1900) {   // 긴 본문은 mailto 한도 초과로 잘림 — 복사로 대체
      copyText(mail.body_text, '본문이 길어 메일 대신 복사했습니다 — 새 메일에 붙여넣으세요');
      return;
    }
    location.href = url;
  };
  $('#mailCopyHtml').onclick = async () => {
    if (!navigator.clipboard) { copyText(mail.body_text); return; }
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([mail.body_html], {type: 'text/html'}),
        'text/plain': new Blob([mail.body_text], {type: 'text/plain'})})]);
      toast('표 포함 복사됨 — Outlook에 붙여넣으세요');
    } catch (e) { copyText(mail.body_text, '텍스트로 복사되었습니다'); }
  };
  $('#mailCopyText').onclick = () => copyText(mail.body_text, '본문을 복사했습니다');
}

/* ═══ 출장 내역 ═══ */
/* 목록 정렬·필터·검색 상태 (출장 내역 / 예산 관리 공용) */
const LQ = {q:'', st:'', sort:'stage', dir:'desc'};   // stage=프로세스 우선, date=일자
const BQ = {q:'', type:'', dir:'desc'};
function setLQ(k, v){ LQ[k] = v; rList(); nav('list'); }
function toggleLDir(){ LQ.dir = LQ.dir === 'asc' ? 'desc' : 'asc'; rList(); nav('list'); }
function setBQ(k, v){ BQ[k] = v; rBudget(); nav('budget'); }
function toggleBDir(){ BQ.dir = BQ.dir === 'asc' ? 'desc' : 'asc'; rBudget(); nav('budget'); }
const dirIcon = d => d === 'asc' ? '▲ 오름차순' : '▼ 내림차순';

function rList(){
  const all = ST.groups.filter(g => g.yq === YQ);
  const q = LQ.q.trim().toLowerCase();
  // 검색은 '데이터'만 대상 — 버튼 문구가 걸리던 문제 해소
  const hay = g => [g.city, g.org, g.purpose, g.roll, g.plan_type, g.sap_doc,
    ...(g.travelers || []).flatMap(p => [p.name, p.emp_no, p.ccg_nm])]
    .filter(Boolean).join(' ').toLowerCase();
  let G = all.filter(g => (!LQ.st || g.roll === LQ.st) && (!q || hay(g).includes(q)));
  const sgn = LQ.dir === 'asc' ? 1 : -1;
  const byDate = (a, b) => ((a.dep_dt || '') < (b.dep_dt || '') ? -1 : (a.dep_dt || '') > (b.dep_dt || '') ? 1 : 0);
  G = G.slice().sort(LQ.sort === 'stage'
    // 프로세스별 우선 분류 → 같은 프로세스 안에서 일자 순차 배열
    ? (a, b) => (a.stage - b.stage) || sgn * byDate(a, b)
    : (a, b) => sgn * byDate(a, b));
  const acts = g => {
    const b = [];
    if (g.status === '계획 등록') {          // 잠정: 확정하거나 흔적 없이 삭제
      b.push(`<button class="btn sm pri" onclick="setStatus('${g.group_id}','확정 예정')">출장 확정</button>`);
      b.push(`<button class="btn sm" onclick="delGroup('${g.group_id}')">삭제</button>`);
    } else if (g.status === '확정 예정') {   // 확정: 예산 확보됨
      b.push(`<button class="btn sm" onclick="setStatus('${g.group_id}','계획 등록')">확정 해제</button>`);
      b.push(`<button class="btn sm red" onclick="setStatus('${g.group_id}','취소')">취소</button>`);
    }
    return b.join(' ') || '<span class="sub">진행/처리 단계</span>';
  };
  const row = g => `<tr>
    <td><span class="status ${stClass(g.roll)}">${esc(dispSt(g.roll))}</span>${g.plan_type === '긴급' ? ' <span class="status urgent">긴급</span>' : ''}</td>
    <td><b>${esc(gname(g))}</b><div class="sub">${esc(g.purpose)}</div></td>
    <td>${names(g)} <span class="sub">${g.travelers.length}명</span>${procTag(g)}</td>
    <td class="num">${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)}</td>
    <td class="num">${g.plan_tot ? won(g.plan_tot) : '–'}</td>
    <td class="num"><b>${g.act_tot ? won(g.act_tot) : '–'}</b></td>
    <td class="num">${g.sap_doc ? esc(g.sap_doc) : '–'}</td>
    <td>${acts(g)}</td></tr>`;
  // 프로세스별 우선 분류 — 단계가 바뀔 때마다 구분 머리행
  let body = '', last = null;
  G.forEach(g => {
    if (LQ.sort === 'stage' && g.roll !== last) {
      last = g.roll;
      const n = G.filter(x => x.roll === g.roll).length;
      body += `<tr class="grp-head"><td colspan="8">
        <span class="status ${stClass(g.roll)}">${esc(dispSt(g.roll))}</span>
        <b style="margin-left:6px">${n}건</b>
        <span class="sub">· 출발일 ${LQ.dir === 'asc' ? '빠른' : '늦은'} 순</span></td></tr>`;
    }
    body += row(g);
  });
  const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label || v || '전체')}</option>`;
  const nP = ST.dash.nPlan || 0, nC = ST.dash.nConfirm || 0;
  $('#v-list').innerHTML = `
    <div class="note">‘<b>계획(잠정)</b>’은 참고용 리스트 — 실제로 안 가면 <b>삭제</b>(흔적 없이 사라짐). 실제로 갈 건 ‘<b>출장 확정</b>’ 하면 계획 금액만큼 <b>예산이 미리 확보</b>됩니다. (확정 이후 취소는 기록으로 남습니다)</div>
    <div class="card">
      <div class="card-head"><h2>${YQ} 출장 내역 <span class="sub" style="font-weight:600">${G.length}/${all.length}건 · 잠정 ${nP} · 확정 ${nC}</span></h2>
        <button class="btn" onclick="downloadCsv(YQ)">CSV 다운로드</button></div>
      <div class="filter-row" style="margin-top:12px">
        <input id="listFilter" value="${esc(LQ.q)}" placeholder="🔍 성명·사번·업체·도시·목적·전표번호"
          oninput="LQ.q=this.value; clearTimeout(window._lt); window._lt=setTimeout(()=>{rList();nav('list');document.getElementById('listFilter').focus();},250)">
        <select onchange="setLQ('st',this.value)">
          ${[''].concat(ST.meta.statuses).map(s => opt(s, LQ.st, s ? dispSt(s) : '전체 프로세스')).join('')}
        </select>
        <select onchange="setLQ('sort',this.value)">
          ${opt('stage', LQ.sort, '프로세스별 → 일자순')}${opt('date', LQ.sort, '일자순')}
        </select>
        <button class="btn" onclick="toggleLDir()">${dirIcon(LQ.dir)}</button>
        ${(LQ.q || LQ.st) ? `<button class="btn" onclick="LQ.q='';LQ.st='';rList();nav('list')">필터 해제</button>` : ''}
      </div>
      <div class="scroll"><table>
        <thead><tr><th>상태</th><th>출장</th><th>출장자</th><th class="num">기간</th>
          <th class="num">계획</th><th class="num">실적</th><th class="num">전표번호</th><th>관리</th></tr></thead>
        <tbody id="listBody">${body || '<tr class="empty"><td colspan="8" style="color:var(--faint);text-align:center;padding:18px">조건에 맞는 출장이 없습니다.</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

/* ═══ 이관·처리 관리 (관리자) — 출장자 개인별 처리 ═══ */
function pStClass(s){ return s === '처리 완료' ? 'done' : s === '보류' ? 'hold'
  : (s === '소재 이관' || s === '실적 입력·인폼') ? 'wip' : ''; }
/* 사용자 입력(사번)을 JS 문자열로 보간하면 따옴표 탈출로 코드가 실행된다.
   data 속성 + 이벤트 위임으로 값을 '데이터'로만 전달한다. */
function pBtn(gid, emp, status, label, cls){
  return `<button class="btn sm ${cls || ''}" data-act="person" data-gid="${esc(gid)}"`
    + ` data-emp="${esc(emp)}" data-st="${esc(status)}">${label}</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button[data-act="person"]');
  if (b) setPersonStatus(b.dataset.gid, b.dataset.emp, b.dataset.st);
});
function rProcess(){
  // 이관·처리 = 실적 이후 단계만. 계획(잠정)·확정 예정은 ‘출장 내역’에서 관리.
  const G = ST.groups.filter(g => g.yq === YQ && !['계획 등록', '확정 예정', '취소'].includes(g.status));
  const block = g => {
    const past = g.status !== '계획 등록';            // 실적 입력 후 = 개인별 처리 가능
    const pc = g.proc || {done:0, transfer:0, inform:0, hold:0, total:g.travelers.length};
    const src = g.inform_at || g.updated_at || g.created_at;
    const w = past && g.roll !== '처리 완료' && src ? Math.floor((Date.now() - new Date(src)) / 864e5) : null;
    const wtag = w === null ? '' : ` · <b style="color:${w >= 7 ? 'var(--red)' : w >= 3 ? '#8A5A10' : 'var(--faint)'}">대기 D+${w}</b>`;
    const summary = !past ? '실적 미입력 (먼저 실적을 입력하세요)'
      : `완료 ${pc.done} · 이관 ${pc.transfer} · 인폼 ${pc.inform}${pc.hold ? ` · <b>보류 ${pc.hold}</b>` : ''} / ${pc.total}명${wtag}`;
    // 그룹 전체 버튼 (공통 케이스)
    const gb = [];
    if (past && g.travelers.length > 1 && g.roll !== '처리 완료')
      gb.push(`<button class="btn sm pri" onclick="setStatus('${g.group_id}','처리 완료')">전체 처리 완료</button>`);
    if (past && g.travelers.length > 1 && pc.transfer + pc.done < pc.total)
      gb.push(`<button class="btn sm" onclick="setStatus('${g.group_id}','소재 이관')">전체 소재 이관</button>`);
    if (past && pc.transfer > 0)
      gb.push(`<button class="btn sm" onclick="openTransferMail('${g.group_id}')">이관 인폼</button>`);
    if (['계획 등록', '실적 입력·인폼'].includes(g.roll))
      gb.push(`<button class="btn sm red" onclick="setStatus('${g.group_id}','취소')">출장 취소</button>`);
    // 개인별 행
    const prows = !past ? '' : g.travelers.map(p => {
      const eff = p.status || g.status;
      const a = KEYS.reduce((s, k) => s + (p['a_' + k] || 0), 0);
      const b = [];
      if (['실적 입력·인폼', '보류'].includes(eff)) b.push(pBtn(g.group_id, p.emp_no, '소재 이관', '소재 이관', 'pri'));
      if (['실적 입력·인폼', '소재 이관', '보류'].includes(eff)) b.push(pBtn(g.group_id, p.emp_no, '처리 완료', '처리 완료', 'pri'));
      if (!['보류', '처리 완료'].includes(eff)) b.push(pBtn(g.group_id, p.emp_no, '보류', '보류', 'red'));
      if (['소재 이관', '처리 완료', '보류'].includes(eff)) b.push(pBtn(g.group_id, p.emp_no, '실적 입력·인폼', '되돌리기'));
      return `<tr>
        <td><span class="status ${pStClass(eff)}">${esc(eff)}</span></td>
        <td><b>${esc(p.name)}</b> <span class="sub">${esc(p.ccg_nm)}</span></td>
        <td class="num">${a ? won(a) : '–'}</td>
        <td>${b.join(' ')}</td></tr>`;
    }).join('');
    return `<div class="pgroup">
      <div class="pg-head">
        <span class="status ${stClass(g.roll)}">${esc(g.roll)}</span>
        <span class="nm">${esc(gname(g))}</span>
        <span class="sub">${fmtD(g.dep_dt)}–${fmtD(g.ret_dt)} · ${g.travelers.length}명 · 실적 ${g.act_tot ? won(g.act_tot) : '–'}</span>
        <span class="gb">${gb.join(' ')}</span>
      </div>
      <div style="padding:5px 13px 3px"><span class="pg-sum">${summary}</span></div>
      ${past ? `<div class="scroll" style="border:0"><table>
        <thead><tr><th style="width:120px">개인 상태</th><th>출장자</th><th class="num">실적</th><th>처리 (인당)</th></tr></thead>
        <tbody>${prows}</tbody></table></div>` : ''}
    </div>`;
  };
  $('#v-process').innerHTML = `
    <div class="note">실적 입력·인폼 → <b>소재 이관</b>(실비 이관 접수) → <b>처리 완료</b>(전표 처리 종료). 처리 완료·처리중(인폼·이관·<b>보류</b>) 금액만 잔여에서 차감됩니다.
      <br>같은 출장이라도 <b>출장자별로 따로</b> 처리·보류할 수 있어요 — 아래 ‘처리(인당)’ 버튼. 다 같이 처리할 땐 상단 ‘전체’ 버튼을 쓰세요.</div>
    <div class="card"><h2>${YQ} 이관·처리 관리 (출장자 개인별)</h2>
      ${G.map(block).join('') || '<div style="color:var(--faint);text-align:center;padding:22px">대상이 없습니다.</div>'}
    </div>`;
}
async function setStatus(gid, status){
  if (status === '취소' && !confirm('이 출장을 취소할까요?\n취소 건은 기록으로 남으며, 되돌리려면 관리자 인증이 필요합니다.')) return;
  const {ok, data} = await api(`/groups/${gid}/status`, {method: 'POST', body: JSON.stringify({status})});
  if (!ok) {
    if (data.errors?.[0]?.includes('인증')) { askAdmin(() => setStatus(gid, status)); return; }
    toast((data.errors || ['실패'])[0]); return;
  }
  if (data.mail) showMail(data.mail);          // 이관 → 비용 처리 요청 인폼
  toast(data.held ? `${dispSt(status)} — 보류 ${data.held}명은 제외(유지)됨` : `상태 변경 — ${dispSt(status)}`);
  await load(); nav(VIEW);
}
async function setPersonStatus(gid, emp, status){
  const {ok, data} = await api(`/groups/${gid}/status`, {method: 'POST', body: JSON.stringify({status, emp_no: emp})});
  if (!ok) {
    if (data.errors?.[0]?.includes('인증')) { askAdmin(() => setPersonStatus(gid, emp, status)); return; }
    toast((data.errors || ['실패'])[0]); return;
  }
  if (data.mail) showMail(data.mail);          // 이관 → 비용 처리 요청 인폼
  toast(`개인 처리 — ${status}`);
  await load(); nav(VIEW);
}
async function delGroup(gid){
  const g = ST.groups.find(x => x.group_id === gid);
  const label = g ? gname(g) : '출장';
  if (!confirm(`잠정 계획 ‘${label}’을(를) 삭제할까요?\n실제로 가지 않는 계획은 흔적 없이 사라집니다. (되돌릴 수 없음)`)) return;
  const {ok, data} = await api('/groups/' + gid, {method: 'DELETE'});
  if (!ok) { toast((data.errors || ['삭제 실패'])[0]); return; }
  toast('잠정 계획을 삭제했습니다'); await load(); nav(VIEW);
}
async function openTransferMail(gid){
  const {ok, data} = await api(`/groups/${gid}/transfer_mail`);
  if (!ok) { toast((data.errors || ['이관 인폼을 만들 수 없습니다'])[0]); return; }
  showMail(data.mail);
}

/* ═══ 예산 관리 (관리자) ═══ */
function rBudget(){
  // 누적은 항상 일자 오름차순 기준으로 계산하고, 표시 순서만 정렬 옵션을 따른다
  const asc = ST.budget.slice().sort((a, b) => (a.rev_dt || '') < (b.rev_dt || '') ? -1 : 1);
  let run = 0;
  const withRun = asc.map(b => { run += Number(b.amt) || 0; return {...b, run}; });
  const bq = BQ.q.trim().toLowerCase();
  let BR = withRun.filter(b => (!BQ.type || b.rev_type === BQ.type)
    && (!bq || [b.rev_id, b.rev_dt, b.rev_type, b.reason].filter(Boolean).join(' ').toLowerCase().includes(bq)));
  if (BQ.dir === 'desc') BR = BR.slice().reverse();
  const rows = BR.map(b => `<tr>
    <td>${esc(b.rev_id)}</td><td class="num">${esc(b.rev_dt)}</td>
    <td><span class="status">${esc(b.rev_type)}</span></td>
    <td class="num" style="color:${b.amt >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700">${b.amt >= 0 ? '+' : '−'}${won(Math.abs(b.amt))}</td>
    <td class="num"><b>${won(b.run)}</b></td>
    <td>${esc(b.reason || '')}</td>
    <td><button class="btn sm red" onclick="delBudget('${esc(b.rev_id)}')">삭제</button></td></tr>`).join('');
  const bopt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label || v || '전체')}</option>`;
  const bctl = `
      <div class="filter-row" style="margin-top:10px">
        <input value="${esc(BQ.q)}" placeholder="🔍 REV·유형·사유·반영일"
          oninput="BQ.q=this.value; clearTimeout(window._bt); window._bt=setTimeout(()=>{rBudget();nav('budget')},250)">
        <select onchange="setBQ('type',this.value)">
          ${[''].concat(ST.meta.revTypes).map(t => bopt(t, BQ.type, t || '전체 유형')).join('')}
        </select>
        <button class="btn" onclick="toggleBDir()">반영일 ${dirIcon(BQ.dir)}</button>
        ${(BQ.q || BQ.type) ? `<button class="btn" onclick="BQ.q='';BQ.type='';rBudget();nav('budget')">필터 해제</button>` : ''}
      </div>`;
  $('#v-budget').innerHTML = `
    <div class="card"><h2>예산 리비전 등록</h2>
      <p class="cap">감액은 금액을 자동으로 음수 처리합니다.</p>
      <div id="bdErr"></div>
      <div class="form-grid c4">
        <div><label>분기</label><input id="bd_yq" value="${YQ}"></div>
        <div><label>유형</label><select id="bd_type">${ST.meta.revTypes.map(t => `<option>${t}</option>`).join('')}</select></div>
        <div><label>금액 (원)</label><input type="number" id="bd_amt" step="100000"></div>
        <div><label>반영일</label><input type="date" id="bd_dt" value="${new Date().toISOString().slice(0, 10)}"></div>
      </div>
      <div class="form-grid"><div><label>사유</label><input id="bd_reason"></div></div>
      <div class="btns"><button class="btn pri" onclick="submitBudget()">리비전 반영</button></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>${YQ} 리비전 이력 <span class="sub" style="font-weight:600">${BR.length}/${withRun.length}건 · 누적 ${won(ST.dash.alloc)}원</span></h2>
        <span class="btns" style="margin:0">
          <button class="btn" onclick="downloadBudgetCsv(YQ)">${YQ} 예산 CSV</button>
          <button class="btn" onclick="downloadBudgetCsv(null)">전체 예산 CSV</button>
        </span></div>
      ${bctl}
      <div class="scroll" style="margin-top:10px"><table>
        <thead><tr><th>REV</th><th class="num">반영일</th><th>유형</th><th class="num">증감액</th>
          <th class="num">누적</th><th>사유</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" style="color:var(--faint);text-align:center;padding:18px">조건에 맞는 리비전이 없습니다.</td></tr>'}</tbody>
      </table></div></div>`;
}
async function submitBudget(){
  const body = {yq: $('#bd_yq').value.trim(), rev_type: $('#bd_type').value,
    amt: Number($('#bd_amt').value) || 0, rev_dt: $('#bd_dt').value, reason: $('#bd_reason').value.trim()};
  const {ok, data} = await api('/budget', {method: 'POST', body: JSON.stringify(body)});
  if (!ok) {
    if (data.errors?.[0]?.includes('인증')) { askAdmin(submitBudget); return; }
    showErr('#bdErr', data.errors); return;
  }
  toast(`${data.budget.rev_id} 예산 반영`);
  YQ = body.yq; await load(); nav('budget');
}
async function delBudget(rid){
  if (!confirm(`${rid} 리비전을 삭제할까요?`)) return;
  const {ok, data} = await api('/budget/' + rid, {method: 'DELETE'});
  if (!ok) { toast((data.errors || ['실패'])[0]); return; }
  toast('삭제되었습니다'); await load(); nav('budget');
}

/* ═══ 데이터 관리 ═══ */

    <td>${esc(b.filename)}</td><td class="num">${(b.size / 1024).toFixed(1)}KB</td>
    <td class="num">${esc(b.modified_at).replace('T', ' ')}</td>
    <td><button class="btn sm" onclick="restoreBackup('${esc(b.filename)}')">복원</button></td></tr>`).join('');
  $('#v-data').innerHTML = `
    <div class="card"><h2>내보내기</h2>
      <div class="btns" style="margin-top:6px">
        <button class="btn pri" onclick="downloadCsv(YQ)">${YQ} 출장 CSV</button>
        <button class="btn" onclick="downloadCsv(null)">전체 출장 CSV</button>
        <button class="btn" onclick="downloadBudgetCsv(YQ)">${YQ} 예산 CSV</button>
        <button class="btn" onclick="downloadBudgetCsv(null)">전체 예산 CSV</button></div></div>
    <div class="card"><h2>자동 백업 (최근 30개 유지)</h2>
      <p class="cap">저장 직전 자동 백업됩니다. 복원은 관리자 인증이 필요합니다.</p>
      <div class="scroll"><table>
        <thead><tr><th>파일</th><th class="num">크기</th><th class="num">시각</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="color:var(--faint);text-align:center;padding:18px">백업이 없습니다.</td></tr>'}</tbody>
      </table></div></div>
    <div class="card"><h2>감사 로그 <span class="sub" style="font-weight:600">최근 활동 — 누가 무엇을 했는지</span></h2>
      <p class="cap">삭제·상태 변경·예산·복원 이력이 남습니다. 잠정 계획 삭제는 내용까지 기록됩니다.</p>
      <div id="auditBox"><button class="btn" onclick="loadAudit()">감사 로그 불러오기</button></div></div>
    <div class="card"><h2>저장 위치</h2>
      <div class="note">정적(GitHub Pages) 버전 — 데이터는 이 브라우저의 localStorage에 저장됩니다(브라우저별 개별). 여러 명이 공유하는 원장은 사내 Flask 버전을 사용하세요.</div></div>`;
}
async function loadAudit(){
  const {ok, data} = await api('/audit?n=200');
  if (!ok) { toast('감사 로그를 불러오지 못했습니다'); return; }
  const rows = (data.audit || []).map(a => `<tr>
    <td class="num">${esc(String(a.timestamp || '').replace('T', ' '))}</td>
    <td>${esc(a.actor || '-')}</td><td>${esc(a.action || '')}</td>
    <td>${esc(a.detail || '')}</td></tr>`).join('');
  $('#auditBox').innerHTML = `<div class="scroll"><table>
    <thead><tr><th class="num">시각</th><th>행위자</th><th>동작</th><th>내용</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4" style="color:var(--faint);text-align:center;padding:18px">기록이 없습니다.</td></tr>'}</tbody>
  </table></div>`;
}

/* ═══ 센터 제출 리포트 ═══ */
async function showReport(){
  const {ok, data} = await api('/report?yq=' + encodeURIComponent(YQ));
  if (!ok) { toast('리포트를 만들지 못했습니다'); return; }
  const r = data.report;
  const rows = r.byCcg.map(x => `<tr><td>${esc(x.team)} <span class="sub">${esc(x.ccg)}</span></td>
    <td class="num">${won(x.done)}</td><td class="num">${won(x.wip)}</td><td class="num">${won(x.commit)}</td>
    <td class="num"><b>${won(x.total)}</b></td><td class="num">${x.groups}</td><td class="num">${x.people}</td></tr>`).join('');
  const revs = r.revisions.map(b => `<tr><td class="num">${esc(b.rev_dt)}</td><td>${esc(b.rev_type)}</td>
    <td class="num">${b.amt >= 0 ? '+' : '−'}${won(Math.abs(b.amt))}</td><td>${esc(b.reason || '')}</td></tr>`).join('');
  const text = [`[${r.yq} 소재 그룹 국내 출장비 집행 현황]`, '',
    `배정 ${won(r.alloc)}원 / 집행 ${won(r.used)}원 (완료 ${won(r.done)} + 처리중 ${won(r.wip)})`,
    `확정 예정(확보) ${won(r.commit)}원 · 소진율 ${(r.burn * 100).toFixed(1)}%`,
    `가용 잔여 ${won(r.avail)}원` + (r.need > 0 ? ` · 추가 필요 예상 ${won(r.need)}원` : ''), '',
    `출장 ${r.nDone + r.nWip + r.nConfirm}건 (완료 ${r.nDone} · 진행 ${r.nWip} · 확정 ${r.nConfirm}) · 연인원 ${r.nPeople}명`].join('\n');
  document.getElementById('mailCard')?.remove();
  const el = document.createElement('div');
  el.className = 'mailcard'; el.id = 'mailCard'; el.style.width = '760px';
  el.innerHTML = `<div class="mh"><span>센터 제출 리포트 · ${esc(r.yq)}</span>
      <button onclick="this.closest('.mailcard').remove()">×</button></div>
    <div class="body">
      <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">
        <div class="kpi"><span>배정</span><b>${won(r.alloc)}</b></div>
        <div class="kpi"><span>집행(완료+처리중)</span><b>${won(r.used)}</b></div>
        <div class="kpi"><span>확정 예정</span><b>${won(r.commit)}</b></div>
        <div class="kpi"><span>${r.need > 0 ? '추가 필요' : '가용 잔여'}</span><b style="color:${r.need > 0 ? 'var(--red)' : 'var(--navy)'}">${won(r.need > 0 ? r.need : r.avail)}</b></div>
      </div>
      <p class="cap" style="margin:6px 0 10px">소진율 ${(r.burn * 100).toFixed(1)}% · 출장 ${r.nDone + r.nWip + r.nConfirm}건 · 연인원 ${r.nPeople}명</p>
      <table style="width:100%"><thead><tr><th>CCG팀</th><th class="num">완료</th><th class="num">처리중</th>
        <th class="num">확정예정</th><th class="num">합계</th><th class="num">건</th><th class="num">인원</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--faint);padding:14px">집행 없음</td></tr>'}</tbody></table>
      <h2 style="font-size:13px;margin:14px 0 6px;color:var(--navy)">예산 리비전</h2>
      <table style="width:100%"><thead><tr><th class="num">반영일</th><th>유형</th><th class="num">증감</th><th>사유</th></tr></thead>
        <tbody>${revs || '<tr><td colspan="4" style="text-align:center;color:var(--faint);padding:14px">없음</td></tr>'}</tbody></table>
    </div>
    <div class="mf"><button class="btn sm pri" id="rptCopy">요약 복사</button>
      <button class="btn sm" onclick="downloadCsv(YQ)">상세 CSV</button>
      <button class="btn sm" onclick="downloadBudgetCsv(YQ)">예산 CSV</button></div>`;
  document.body.appendChild(el);
  $('#rptCopy').onclick = () => copyText(text, '센터 제출용 요약을 복사했습니다');
}

async function restoreBackup(fn){
  if (!confirm(`${fn}\n이 시점으로 복원할까요? 현재 데이터는 백업 후 교체됩니다.`)) return;
  const {ok, data} = await api(`/backups/${encodeURIComponent(fn)}/restore`, {method: 'POST'});
  if (!ok) {
    if (data.errors?.[0]?.includes('인증')) { askAdmin(() => restoreBackup(fn)); return; }
    toast((data.errors || ['복원 실패'])[0]); return;
  }
  toast('복원되었습니다'); await load();
}

/* ═══ 관리자 인증 ═══ */
function askAdmin(then){
  document.getElementById('adminModal')?.remove();
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'adminModal';
  m.innerHTML = `<div class="modal-box">
    <div class="mh">관리자 인증</div>
    <div class="mb">
      <div class="merr" id="admErr">아이디 또는 비밀번호가 올바르지 않습니다.</div>
      <label>아이디</label><input id="admId" autocomplete="off" style="margin-bottom:10px">
      <label>비밀번호</label><input id="admPw" type="password" autocomplete="off">
      <div class="hint">공개 계정 — ID <b>2071478</b> / PW <b>2071478</b></div>
      <div class="btns" style="margin-top:0">
        <button class="btn pri" id="admOk">확인</button>
        <button class="btn" onclick="document.getElementById('adminModal').remove()">취소</button>
      </div></div></div>`;
  document.body.appendChild(m);
  setTimeout(() => $('#admId')?.focus(), 50);   // 모달이 이미 닫혔으면 무시
  const go = async () => {
    const {ok} = await api('/admin/verify', {method: 'POST', body: JSON.stringify({pw: $('#admPw').value})});
    if (!ok) { $('#admErr').style.display = 'block'; return; }
    sessionStorage.setItem('tb_pw', $('#admPw').value);
    m.remove(); if (then) then();
  };
  $('#admOk').onclick = go;
  $('#admPw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

load().catch(e => { document.body.innerHTML =
  `<pre style="padding:24px;color:#B42318">${esc(e.message)}</pre>`; });

</script>
